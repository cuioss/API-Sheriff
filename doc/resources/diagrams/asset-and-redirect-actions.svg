<?xml version="1.0" encoding="UTF-8"?>
<!--
  Branching execution flow for Asset and Redirect terminal actions after Stage 4 Authentication.
  theme-handling: A (theme-neutral)
  see  pm-documents:ref-svg-diagrams/standards/diagram-type-flow.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 368"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Asset and redirect terminal action pipeline flow after Stage 4 authentication</title>
  <desc id="desc">A branching left-to-right flow diagram. Both asset and redirect routes execute Stages 0 through 4 (headers, floor, route match, verb gate, thorough filter, and authentication), rejecting unauthorized callers before touching any asset source or disclosing a redirect Location. After Stage 4, the flow branches. On the top track (Asset Terminal Action), requests run Stage 5 ForwardPolicyStage (GET and HEAD only, sub-path canonicalized and confined under the root), read from either DirectoryAssetSource (with confined index and fallback) or UpstreamAssetSource (scheme allowlist, followRedirects NEVER, 5 s connect / 10 s read, response byte cap), and exit through the shared AssetResponseEnvelope (Content-Type from the add-only extension map where restating a built-in extension is refused at boot, X-Content-Type-Options: nosniff, Set-Cookie and identity headers stripped, and Cache-Control: no-store for authenticated routes). On the bottom track (Redirect Terminal Action), RedirectStage answers immediately before Stage 5 (REQUEST_FORWARDED not counted), applying boot-validated open-redirect rules (single-slash internal path, or allow_external http/https without user-info and without keep_query) and emitting 301/302/307/308 with Cache-Control: no-store when authenticated or carrying Set-Cookie.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .stage      { font-size: 13px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .mono       { font-size: 11px; fill: #6e7681; text-anchor: middle; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      .sub        { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .caption    { font-size: 12px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .track      { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .dash       { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; fill: none; }
      .arrow-fill { fill: #6e7681; }
    </style>
  </defs>

  <!-- Left Origin: Stages 0-4 -->
  <rect class="stroke" x="20" y="108" width="196" height="128" rx="6"/>
  <text x="118" y="132" class="stage">Stages 0–4 · Pipeline</text>
  <text x="118" y="152" class="mono">headers · floor · route</text>
  <text x="118" y="170" class="mono">verb · filter · auth</text>
  <line class="dash" x1="36" y1="182" x2="200" y2="182"/>
  <text x="118" y="200" class="sub">unauthorized callers rejected</text>
  <text x="118" y="216" class="sub">before source or Location</text>

  <!-- Fork after Stage 4: Asset (top) vs Redirect (bottom) -->
  <line class="track" x1="216" y1="172" x2="236" y2="172"/>
  <circle cx="240" cy="172" r="4" class="stroke"/>
  <path class="track" d="M 240 168 L 240 114 L 264 114" marker-end="url(#arrow)"/>
  <path class="track" d="M 240 176 L 240 272 L 264 272" marker-end="url(#arrow)"/>

  <!-- ============================================================ -->
  <!-- TOP TRACK: Asset Terminal Action                             -->
  <!-- ============================================================ -->
  <rect class="stroke" x="268" y="54" width="168" height="120" rx="6"/>
  <text x="352" y="78"  class="stage">Stage 5 · Asset Prep</text>
  <text x="352" y="98"  class="mono">ForwardPolicyStage</text>
  <text x="352" y="116" class="mono">GET / HEAD only</text>
  <line class="dash" x1="284" y1="128" x2="420" y2="128"/>
  <text x="352" y="146" class="sub">sub-path canonicalized</text>
  <text x="352" y="162" class="sub">&amp; confined under root</text>

  <!-- Fork to DirectoryAssetSource vs UpstreamAssetSource -->
  <line class="track" x1="436" y1="114" x2="452" y2="114"/>
  <circle cx="456" cy="114" r="4" class="stroke"/>
  <path class="track" d="M 456 110 L 456 72 L 476 72" marker-end="url(#arrow)"/>
  <path class="track" d="M 456 118 L 456 156 L 476 156" marker-end="url(#arrow)"/>

  <!-- Source A: DirectoryAssetSource -->
  <rect class="stroke" x="480" y="36" width="288" height="72" rx="6"/>
  <text x="624" y="58"  class="stage">DirectoryAssetSource (source: directory)</text>
  <text x="624" y="76"  class="mono">local root · optional index &amp; fallback</text>
  <text x="624" y="94"  class="sub">index/fallback re-enter real-path confinement</text>

  <!-- Source B: UpstreamAssetSource -->
  <rect class="stroke" x="480" y="120" width="288" height="72" rx="6"/>
  <text x="624" y="142" class="stage">UpstreamAssetSource (source: upstream)</text>
  <text x="624" y="160" class="mono">scheme allowlist · no redirects · 5s/10s</text>
  <text x="624" y="178" class="sub">bounded by AssetSource.DEFAULT_MAX_BYTES</text>

  <!-- Converge into AssetResponseEnvelope -->
  <path class="track" d="M 768 72 L 788 72 L 788 106 L 808 106" marker-end="url(#arrow)"/>
  <path class="track" d="M 768 156 L 788 156 L 788 122 L 808 122" marker-end="url(#arrow)"/>

  <rect class="stroke" x="812" y="36" width="328" height="156" rx="6"/>
  <text x="976" y="58"  class="stage">Governed AssetResponseEnvelope</text>
  <text x="976" y="78"  class="mono">Content-Type: gateway extension map</text>
  <text x="976" y="94"  class="sub">(add-only content_types; built-in override</text>
  <text x="976" y="110" class="sub">refused at boot to prevent SVG/HTML XSS)</text>
  <line class="dash" x1="828" y1="120" x2="1124" y2="120"/>
  <text x="976" y="138" class="mono">X-Content-Type-Options: nosniff</text>
  <text x="976" y="156" class="sub">strips Set-Cookie, RESPONSE_STRIP &amp; identity;</text>
  <text x="976" y="174" class="sub">access: authenticated → Cache-Control: no-store</text>

  <!-- ============================================================ -->
  <!-- BOTTOM TRACK: Redirect Terminal Action                       -->
  <!-- ============================================================ -->
  <line class="dash" x1="256" y1="208" x2="1140" y2="208"/>

  <rect class="stroke" x="268" y="224" width="440" height="96" rx="6"/>
  <text x="488" y="246" class="stage">RedirectStage · Answers Before Stage 5 (No Upstream)</text>
  <text x="488" y="266" class="mono">boot open-redirect validation (ConfigValidator · GW-13):</text>
  <text x="488" y="284" class="sub">• default: single-slash gateway path (no \, encoded /, .., or control chars)</text>
  <text x="488" y="302" class="sub">• allow_external: http(s) + host + no user-info (WARN 128; refuses keep_query)</text>

  <line class="track" x1="708" y1="272" x2="764" y2="272" marker-end="url(#arrow)"/>

  <rect class="stroke" x="768" y="224" width="372" height="96" rx="6"/>
  <text x="954" y="246" class="stage">301 · 302 · 307 · 308 Redirect Response</text>
  <text x="954" y="266" class="mono">Location: configured location (+ ?query if keep_query)</text>
  <text x="954" y="284" class="mono">authenticated or Set-Cookie → Cache-Control: no-store</text>
  <text x="954" y="302" class="sub">REQUEST_FORWARDED not counted; protocol: http only</text>

  <!-- Footer caption -->
  <text x="580" y="348" class="caption">Authentication runs at Stage 4 before both terminal actions, so unauthenticated requests never touch an asset source or reveal a redirect target.</text>
</svg>
