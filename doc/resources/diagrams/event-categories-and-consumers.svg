<?xml version="1.0" encoding="UTF-8"?>
<!--
  Event model: failure categories, their events, and the consumers keyed by category.
  theme-handling: A (theme-neutral)
  see  pm-documents:ref-svg-diagrams/standards/diagram-type-block.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 394"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Event system: failure categories, events and consumers</title>
  <desc id="desc">A three-column block diagram. Column 1 lists failure events by category: input-validation (PATH_NOT_ALLOWED, SECURITY_FILTER_VIOLATION, PARAMETER_LIMIT_EXCEEDED, CONTENT_TOO_LARGE, RESERVED_BODY_TOO_LARGE, INBOUND_BODY_ABORTED, REQUEST_BODY_TIMEOUT), routing (NO_ROUTE_MATCHED, PASSTHROUGH_HOST_SMUGGLED, METHOD_NOT_ALLOWED, PRE_TRUST_INTERNAL_FAILURE) and authentication (TOKEN_MISSING, TOKEN_INVALID, LOGOUT_TOKEN_INVALID). Column 2 lists authorization (SCOPE_MISSING, CSRF_REJECTED, WEBSOCKET_ORIGIN_REJECTED), upstream (UPSTREAM_ERROR, UPSTREAM_TIMEOUT, UPSTREAM_CIRCUIT_OPEN), rate-limiting (SOURCE_BLOCKED) and boot-only configuration events, plus informational events with no category. Column 3 lists what the event type feeds: GatewayEventCounter, the HTTP status mapping, the RFC 9457 problem type urn:api-sheriff:problem with the category slug, the category label of sheriff_errors_total, and grpc-message on gRPC routes.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .col-header { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .item-bold  { font-size: 12px; font-weight: 700; fill: #6e7681; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      .item       { font-size: 12px; fill: #6e7681; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      .sub        { font-size: 11px; fill: #6e7681; font-style: italic; }
      .col-sub    { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .gut        { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .caption    { font-size: 12px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .arrow      { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .arrow-fill { fill: #6e7681; }
      .sep        { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; fill: none; }
    </style>
  </defs>

  <text x="188" y="32" class="col-header">Failure Events (1/2)</text>
  <rect class="stroke" x="24" y="48" width="328" height="326" rx="6"/>
  <text x="44" y="80" class="item-bold">input-validation</text>
  <text x="56" y="102" class="sub">PATH_NOT_ALLOWED · SECURITY_FILTER_VIOLATION</text>
  <text x="56" y="120" class="sub">PARAMETER_LIMIT_EXCEEDED · CONTENT_TOO_LARGE</text>
  <text x="56" y="138" class="sub">RESERVED_BODY_TOO_LARGE · INBOUND_BODY_ABORTED</text>
  <text x="56" y="156" class="sub">REQUEST_BODY_TIMEOUT</text>
  <line class="sep" x1="44" y1="168" x2="332" y2="168"/>
  <text x="44" y="192" class="item-bold">routing</text>
  <text x="56" y="214" class="sub">NO_ROUTE_MATCHED · METHOD_NOT_ALLOWED</text>
  <text x="56" y="232" class="sub">PASSTHROUGH_HOST_SMUGGLED</text>
  <text x="56" y="250" class="sub">PRE_TRUST_INTERNAL_FAILURE (answered 404)</text>
  <line class="sep" x1="44" y1="262" x2="332" y2="262"/>
  <text x="44" y="286" class="item-bold">authentication</text>
  <text x="56" y="308" class="sub">TOKEN_MISSING · TOKEN_INVALID</text>
  <text x="56" y="326" class="sub">LOGOUT_TOKEN_INVALID</text>

  <text x="536" y="32" class="col-header">Failure Events (2/2)</text>
  <rect class="stroke" x="392" y="48" width="288" height="326" rx="6"/>
  <text x="412" y="80" class="item-bold">authorization</text>
  <text x="424" y="102" class="sub">SCOPE_MISSING · CSRF_REJECTED</text>
  <text x="424" y="120" class="sub">WEBSOCKET_ORIGIN_REJECTED</text>
  <line class="sep" x1="412" y1="132" x2="660" y2="132"/>
  <text x="412" y="156" class="item-bold">upstream</text>
  <text x="424" y="178" class="sub">UPSTREAM_ERROR · UPSTREAM_TIMEOUT</text>
  <text x="424" y="196" class="sub">UPSTREAM_CIRCUIT_OPEN</text>
  <line class="sep" x1="412" y1="208" x2="660" y2="208"/>
  <text x="412" y="232" class="item-bold">rate-limiting</text>
  <text x="424" y="254" class="sub">SOURCE_BLOCKED</text>
  <line class="sep" x1="412" y1="266" x2="660" y2="266"/>
  <text x="412" y="290" class="item-bold">configuration (boot only)</text>
  <text x="424" y="312" class="sub">never an HTTP response</text>
  <line class="sep" x1="412" y1="324" x2="660" y2="324"/>
  <text x="424" y="348" class="sub">informational events: null category</text>

  <text x="872" y="32" class="col-header">What an Event Feeds</text>
  <rect class="stroke" x="728" y="48" width="288" height="326" rx="6"/>
  <text x="748" y="80" class="item-bold">GatewayEventCounter</text>
  <text x="760" y="102" class="sub">lock-free, per EventType</text>
  <line class="sep" x1="748" y1="114" x2="996" y2="114"/>
  <text x="748" y="138" class="item-bold">GatewayException → edge</text>
  <text x="760" y="160" class="sub">event → HTTP status, problem+json</text>
  <line class="sep" x1="748" y1="172" x2="996" y2="172"/>
  <text x="748" y="196" class="item-bold">Category slug</text>
  <text x="760" y="218" class="sub">urn:api-sheriff:problem:&lt;slug&gt;</text>
  <text x="760" y="236" class="sub">sheriff_errors_total{category}</text>
  <text x="760" y="254" class="sub">grpc-message on gRPC routes</text>

</svg>
