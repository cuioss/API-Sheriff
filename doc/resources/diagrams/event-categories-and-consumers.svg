<?xml version="1.0" encoding="UTF-8"?>
<!--
  Event emission, category-slug classification, and fan-out flow to in-process counters,
  Prometheus metrics, per-source detection ledgers, and wire error rendering.
  theme-handling: A (theme-neutral)
  see  pm-documents:ref-svg-diagrams/standards/diagram-type-flow.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 396"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Event emission, category classification, and fan-out flow</title>
  <desc id="desc">A left-to-right flow diagram of the event system. On the left, pipeline stages emit EventType values grouped into six runtime failure categories (input-validation, routing, authentication, authorization, upstream, rate-limiting), boot-only configuration events (CONFIG_INVALID, AUTH_WEAKENED), and informational events with null category (REQUEST_FORWARDED, TOKEN_REFRESHED, SOURCE_TRIPPED). In the center, GatewayException and ErrorResponseWriter resolve the honest HTTP status and category slug, recording the true EventType before any pre-trust uniform-404 rewrite. On the right, each event fans out to four consumers: (1) GatewayEventCounter (lock-free ConcurrentHashMap of AtomicLong) and CuiLogger; (2) Prometheus metrics (sheriff_errors_total{route,category,event} plus cui-http sheriff_security_events_total); (3) SourceGate and ThreatClassifier ledgers; and (4) the wire error contract (urn:api-sheriff:problem:&lt;slug&gt; RFC 9457 JSON, gRPC trailers-only grpc-message, or HTML error page).</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .stage      { font-size: 13px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .mono       { font-size: 11px; fill: #6e7681; text-anchor: middle; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      .sub        { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .caption    { font-size: 12px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .track      { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .dash       { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; fill: none; }
      .arrow-fill { fill: #6e7681; }
    </style>
  </defs>

  <!-- Left Box: Event Producers & Categories -->
  <rect class="stroke" x="20" y="32" width="356" height="316" rx="6"/>
  <text x="198" y="54"  class="stage">1 · EventType &amp; EventCategory</text>
  <text x="198" y="74"  class="mono">input-validation (400 / 408 / 413)</text>
  <text x="198" y="90"  class="sub">PATH_NOT_ALLOWED · SECURITY_FILTER_VIOLATION</text>
  <text x="198" y="104" class="sub">PARAMETER_LIMIT · CONTENT / RESERVED_TOO_LARGE</text>
  <text x="198" y="118" class="sub">INBOUND_BODY_ABORTED · REQUEST_BODY_TIMEOUT</text>
  <line class="dash" x1="36" y1="128" x2="360" y2="128"/>
  <text x="198" y="146" class="mono">routing (404 / 405)</text>
  <text x="198" y="162" class="sub">NO_ROUTE_MATCHED · METHOD_NOT_ALLOWED</text>
  <text x="198" y="176" class="sub">PASSTHROUGH_HOST_SMUGGLED · PRE_TRUST_INTERNAL</text>
  <line class="dash" x1="36" y1="186" x2="360" y2="186"/>
  <text x="198" y="204" class="mono">authentication (401/400) &amp; authorization (403)</text>
  <text x="198" y="220" class="sub">TOKEN_MISSING/INVALID · LOGOUT_TOKEN_INVALID</text>
  <text x="198" y="234" class="sub">SCOPE_MISSING · CSRF_REJECTED · WS_ORIGIN_REJECTED</text>
  <line class="dash" x1="36" y1="244" x2="360" y2="244"/>
  <text x="198" y="262" class="mono">upstream (502/503/504) &amp; rate-limiting (429)</text>
  <text x="198" y="278" class="sub">UPSTREAM_ERROR / TIMEOUT / CIRCUIT · SOURCE_BLOCKED</text>
  <line class="dash" x1="36" y1="288" x2="360" y2="288"/>
  <text x="198" y="306" class="mono">configuration (boot) · informational (null)</text>
  <text x="198" y="322" class="sub">CONFIG_INVALID / AUTH_WEAKENED · REQUEST_FORWARDED</text>
  <text x="198" y="336" class="sub">TOKEN_REFRESHED · CONFIG_LOADED · SOURCE_TRIPPED</text>

  <line class="track" x1="376" y1="190" x2="412" y2="190" marker-end="url(#arrow)"/>

  <!-- Center Box: Classification & True-Event Recording -->
  <rect class="stroke" x="416" y="96" width="264" height="188" rx="6"/>
  <text x="548" y="120" class="stage">2 · Classification &amp; Dispatch</text>
  <text x="548" y="142" class="mono">GatewayException(EventType)</text>
  <text x="548" y="160" class="sub">maps EventType → honest HTTP status</text>
  <text x="548" y="178" class="sub">&amp; EventCategory slug</text>
  <line class="dash" x1="432" y1="192" x2="664" y2="192"/>
  <text x="548" y="212" class="mono">handleGatewayRejection</text>
  <text x="548" y="230" class="sub">records true EventType &amp; category</text>
  <text x="548" y="248" class="sub">before checking UniformNotFound</text>
  <text x="548" y="266" class="sub">so metrics &amp; ledgers stay honest</text>

  <!-- Fan-out spine to 4 consumers -->
  <line class="track" x1="680" y1="190" x2="702" y2="190"/>
  <circle cx="706" cy="190" r="4" class="stroke"/>
  <path class="track" d="M 706 186 L 706 68  L 732 68"  marker-end="url(#arrow)"/>
  <path class="track" d="M 706 186 L 706 148 L 732 148" marker-end="url(#arrow)"/>
  <path class="track" d="M 706 194 L 706 230 L 732 230" marker-end="url(#arrow)"/>
  <path class="track" d="M 706 194 L 706 312 L 732 312" marker-end="url(#arrow)"/>

  <!-- Consumer 1: GatewayEventCounter & CuiLogger -->
  <rect class="stroke" x="736" y="34" width="404" height="68" rx="6"/>
  <text x="938" y="56" class="stage">3a · GatewayEventCounter &amp; CuiLogger</text>
  <text x="938" y="74" class="mono">ConcurrentHashMap&lt;EventType, AtomicLong&gt; (lock-free)</text>
  <text x="938" y="90" class="sub">increment(EventType) + structured LogRecord</text>

  <!-- Consumer 2: Prometheus Metrics -->
  <rect class="stroke" x="736" y="114" width="404" height="68" rx="6"/>
  <text x="938" y="136" class="stage">3b · Prometheus Metrics (/q/metrics)</text>
  <text x="938" y="154" class="mono">sheriff_errors_total{route, category, event}</text>
  <text x="938" y="170" class="sub">+ sheriff_security_events_total{failure_type} (cui-http)</text>

  <!-- Consumer 3: Per-Source Detection Ledgers -->
  <rect class="stroke" x="736" y="196" width="404" height="68" rx="6"/>
  <text x="938" y="218" class="stage">3c · Per-Source Recon &amp; Threat Ledgers</text>
  <text x="938" y="236" class="mono">SourceGate (Tier 1) · ThreatClassifier (Tier 2)</text>
  <text x="938" y="252" class="sub">PRE_TRUST_INTERNAL_FAILURE carries zero caller weight</text>

  <!-- Consumer 4: Wire Error Rendering -->
  <rect class="stroke" x="736" y="278" width="404" height="70" rx="6"/>
  <text x="938" y="300" class="stage">3d · Wire Error Contract (ErrorResponseWriter)</text>
  <text x="938" y="318" class="mono">urn:api-sheriff:problem:&lt;slug&gt; (RFC 9457 JSON)</text>
  <text x="938" y="334" class="sub">or grpc-message: &lt;slug&gt; trailers-only · or PortalErrorPage</text>

  <!-- Footer caption -->
  <text x="580" y="376" class="caption">Boot-only CONFIGURATION events abort startup and never enter request metrics or HTTP responses.</text>
</svg>
