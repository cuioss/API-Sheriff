<?xml version="1.0" encoding="UTF-8"?>
<!--
  Edge package layers — acyclic dependency hierarchy beneath GatewayEdgeRoute.
  theme-handling: A (theme-neutral)
  see  pm-documents:ref-svg-diagrams/standards/diagram-type-stack.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1144 510"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Edge package layered dependency architecture</title>
  <desc id="desc">A six-layer stack showing de.cuioss.sheriff.gateway.edge and its nine acyclic sub-packages from top to bottom. Top slab: GatewayEdgeRoute (root entrypoint, depends on all nine sub-packages). Second slab: terminal and reserved (dispatching terminal actions, reserved OIDC paths, and the portal). Third slab: admission, relay, and error (admission permits and source gates, response streaming, and rejection rendering). Fourth slab: end (response-end rules, HTTP/2 post-response resets, connection retirement). Fifth slab: upstream (guarded dispatch, retry gate, egress clients, circuit breakers). Bottom slab: assembly and request (boot-only route completion and pipeline request conversion, depending on no edge sub-package). On the right, EdgeSubPackageArchTest enforces acyclicity and forbids any sub-package from depending on the root.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .layer-hdr  { font-size: 14px; font-weight: 600; fill: #6e7681; }
      .layer-sub  { font-size: 11px; fill: #6e7681; font-style: italic; }
      .mono-bold  { font-size: 12px; font-weight: 700; fill: #6e7681; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      .mono       { font-size: 12px; fill: #6e7681; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      .cons-hdr   { font-size: 14px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .cons-sub   { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .conn       { stroke: #6e7681; stroke-width: 1.0; fill: none; }
      .sep        { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; fill: none; }
      .arrow-fill { fill: #6e7681; }
    </style>
  </defs>

  <!-- Slab 1: Root Entrypoint -->
  <rect class="stroke" x="32" y="24" width="824" height="56" rx="6"/>
  <text x="48" y="48" class="layer-hdr">Root Entrypoint</text>
  <text x="48" y="66" class="layer-sub">depends on all 9</text>
  <line class="sep" x1="216" y1="32" x2="216" y2="72"/>
  <text x="232" y="48" class="mono-bold">GatewayEdgeRoute</text>
  <text x="384" y="48" class="mono">registerRoutes · handle · dispatchProcessing · process</text>
  <text x="232" y="66" class="layer-sub">CDI &amp; test entrypoints · shutdown drain observer · switches over DispatchPath</text>

  <line class="sep" x1="32" y1="88" x2="856" y2="88"/>

  <!-- Slab 2: Dispatch & Reserved -->
  <rect class="stroke" x="32" y="96" width="824" height="68" rx="6"/>
  <text x="48" y="122" class="layer-hdr">Dispatch &amp; Reserved</text>
  <text x="48" y="140" class="layer-sub">action &amp; reserved exits</text>
  <line class="sep" x1="216" y1="104" x2="216" y2="156"/>
  <text x="232" y="122" class="mono-bold">terminal</text>
  <text x="312" y="122" class="mono">TerminalDispatch · RedirectStage</text>
  <text x="656" y="122" class="layer-sub">→ lower 7 packages</text>
  <text x="232" y="144" class="mono-bold">reserved</text>
  <text x="312" y="144" class="mono">ReservedPathHandler · ReservedBodyReader</text>
  <text x="656" y="144" class="layer-sub">→ error, end, request</text>

  <line class="sep" x1="32" y1="172" x2="856" y2="172"/>

  <!-- Slab 3: Admission, Relay & Error -->
  <rect class="stroke" x="32" y="180" width="824" height="88" rx="6"/>
  <text x="48" y="208" class="layer-hdr">Gate, Relay &amp; Error</text>
  <text x="48" y="226" class="layer-sub">permits, streaming, RFC 9457</text>
  <line class="sep" x1="216" y1="188" x2="216" y2="260"/>
  <text x="232" y="204" class="mono-bold">admission</text>
  <text x="312" y="204" class="mono">EdgeAdmission · SourceGate · ThreatClassifier</text>
  <text x="656" y="204" class="layer-sub">→ end, error, request</text>
  <text x="232" y="226" class="mono-bold">error</text>
  <text x="312" y="226" class="mono">RejectionReporter · ErrorResponseWriter</text>
  <text x="656" y="226" class="layer-sub">→ end, upstream, relay, request</text>
  <text x="232" y="248" class="mono-bold">relay</text>
  <text x="312" y="248" class="mono">ResponseStage · WebSocketRelayStage</text>
  <text x="656" y="248" class="layer-sub">→ end, upstream</text>

  <line class="sep" x1="32" y1="276" x2="856" y2="276"/>

  <!-- Slab 4: Stream & Response End -->
  <rect class="stroke" x="32" y="284" width="824" height="56" rx="6"/>
  <text x="48" y="308" class="layer-hdr">Response &amp; Stream End</text>
  <text x="48" y="326" class="layer-sub">→ upstream</text>
  <line class="sep" x1="216" y1="292" x2="216" y2="332"/>
  <text x="232" y="308" class="mono-bold">end</text>
  <text x="312" y="308" class="mono">ResponseEnds · EarlyResponseEnd · InboundStreamWindow</text>
  <text x="312" y="326" class="layer-sub">HTTP/2 post-response stream drain/reset · connection retirement · response delay timer</text>

  <line class="sep" x1="32" y1="348" x2="856" y2="348"/>

  <!-- Slab 5: Outbound Upstream -->
  <rect class="stroke" x="32" y="356" width="824" height="56" rx="6"/>
  <text x="48" y="380" class="layer-hdr">Upstream Transport</text>
  <text x="48" y="398" class="layer-sub">→ assembly</text>
  <line class="sep" x1="216" y1="364" x2="216" y2="404"/>
  <text x="232" y="380" class="mono-bold">upstream</text>
  <text x="312" y="380" class="mono">DispatchStage · GrpcDispatchStage · EgressClients · UpstreamGuards</text>
  <text x="312" y="398" class="layer-sub">guarded HTTP/gRPC dispatch · StreamAwareRetryGate · SmallRye circuit breaker &amp; head timeout</text>

  <line class="sep" x1="32" y1="420" x2="856" y2="420"/>

  <!-- Slab 6: Leaf Foundations -->
  <rect class="stroke" x="32" y="428" width="824" height="64" rx="6"/>
  <text x="48" y="454" class="layer-hdr">Leaf Foundations</text>
  <text x="48" y="472" class="layer-sub">no edge dependencies</text>
  <line class="sep" x1="216" y1="436" x2="216" y2="484"/>
  <text x="232" y="452" class="mono-bold">assembly</text>
  <text x="312" y="452" class="mono">RouteAssembler · UpstreamClients · SecurityPostures · AssetSources</text>
  <text x="232" y="474" class="mono-bold">request</text>
  <text x="312" y="474" class="mono">EdgeRequests (Vert.x HttpServerRequest → PipelineRequest)</text>

  <!-- Right-side architectural fitness consumer -->
  <rect class="stroke" x="904" y="196" width="216" height="112" rx="6"/>
  <text x="1012" y="226" class="cons-hdr">EdgeSubPackageArchTest</text>
  <text x="1012" y="248" class="cons-sub">ArchUnit fitness function</text>
  <text x="1012" y="270" class="cons-sub">enforces top-down DAG;</text>
  <text x="1012" y="286" class="cons-sub">forbids root back-edges</text>

  <!-- Convergent connectors from slabs to ArchTest -->
  <line class="conn" x1="856" y1="52"  x2="904" y2="220" marker-end="url(#arrow)"/>
  <line class="conn" x1="856" y1="130" x2="904" y2="235" marker-end="url(#arrow)"/>
  <line class="conn" x1="856" y1="224" x2="904" y2="250" marker-end="url(#arrow)"/>
  <line class="conn" x1="856" y1="312" x2="904" y2="265" marker-end="url(#arrow)"/>
  <line class="conn" x1="856" y1="384" x2="904" y2="280" marker-end="url(#arrow)"/>
  <line class="conn" x1="856" y1="460" x2="904" y2="292" marker-end="url(#arrow)"/>
</svg>
