<?xml version="1.0" encoding="UTF-8"?>
<!--
  HTTP/2 post-response stream reset, dispatch body framing, and stream/body timers
  shown as a time-ordered sequence across Client, API Sheriff Edge, and Upstream.
  theme-handling: A (theme-neutral)
  see  pm-documents:ref-svg-diagrams/standards/diagram-type-sequence.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Request-body streaming timers, framing checks, and HTTP/2 post-response reset sequence</title>
  <desc id="desc">A sequence diagram across Client, API Sheriff Edge, and Upstream Target. Part 1 shows normal streaming dispatch under EdgeHardeningOptions (100 concurrent streams, 6,553,500 B connection window, 16 KiB header list, 200/30s RST_STREAM cap), enforcing live body-framing checks (bodyless GET/HEAD 400, Content-Length overflow/truncation 400, max_body_bytes 413) and the four timers (10 s chunk idle 408, 25 s body deadline 408, 30 s upstream head guard 504, 5 min gRPC stream-idle DEADLINE_EXCEEDED). Part 2 shows ResponseEnds.endResponse when a response is ready while the inbound request body is still open: (1) reset upstream request (H1 abortive SO_LINGER 0 TCP RST or H2 stream reset) and pause inbound stream; (2) hold END_STREAM until the stream window hits 0, 50 ms passes with no DATA frame, or the 1 s cap expires; (3) flush response END_STREAM and RST_STREAM(NO_ERROR) together.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .col-header   { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .stroke       { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .sep          { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; fill: none; }
      .arrow        { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .arrow-return { stroke: #6e7681; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .arrow-fill   { fill: #6e7681; }
      .arrow-lbl    { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .mono-lbl     { font-size: 11px; fill: #6e7681; text-anchor: middle; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      .activation   { stroke: #6e7681; stroke-width: 0.8; fill: #6e7681; opacity: 0.15; }
      .note         { font-size: 11px; fill: #6e7681; text-anchor: start; font-style: italic; }
      .note-mono    { font-size: 11px; fill: #6e7681; text-anchor: start; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      .caption      { font-size: 12px; fill: #6e7681; text-anchor: middle; font-style: italic; }
    </style>
  </defs>

  <!-- Actors + Lifelines -->
  <text x="128" y="30" class="col-header">Client (H1 / H2)</text>
  <rect class="stroke" x="56" y="42" width="144" height="36" rx="6"/>
  <line class="sep" x1="128" y1="80" x2="128" y2="536"/>

  <text x="480" y="30" class="col-header">API Sheriff Edge</text>
  <rect class="stroke" x="404" y="42" width="152" height="36" rx="6"/>
  <line class="sep" x1="480" y1="80" x2="480" y2="536"/>

  <text x="860" y="30" class="col-header">Upstream Target</text>
  <rect class="stroke" x="788" y="42" width="144" height="36" rx="6"/>
  <line class="sep" x1="860" y1="80" x2="860" y2="536"/>

  <!-- Activation bars -->
  <rect class="activation" x="475" y="108" width="10" height="408"/>
  <rect class="activation" x="855" y="144" width="10" height="168"/>

  <!-- 1. Client -> Edge: request head + body stream -->
  <line class="arrow" x1="128" y1="114" x2="475" y2="114" marker-end="url(#arrow)"/>
  <text x="302" y="104" class="arrow-lbl">HEADERS + DATA (6.55 MB window · 100 streams · 16 KiB hdrs)</text>

  <!-- 2. Edge -> Upstream: piped stream -->
  <line class="arrow" x1="485" y1="150" x2="855" y2="150" marker-end="url(#arrow)"/>
  <text x="670" y="140" class="arrow-lbl">pipe request head &amp; unbuffered DATA chunks</text>

  <!-- Live framing & timers box on Edge -->
  <rect class="stroke" x="504" y="168" width="332" height="128" rx="4"/>
  <text x="516" y="186" class="note-mono">Framing: GET/HEAD body, &gt;CL, or EOF&lt;CL → 400</text>
  <text x="516" y="204" class="note-mono">Cap:     stream &gt; max_body_bytes → 413</text>
  <text x="516" y="224" class="note">• 10 s chunk-idle timer → 408 (pauses on backpressure)</text>
  <text x="516" y="242" class="note">• 25 s body deadline → 408 pre-head (kept post-head)</text>
  <text x="516" y="260" class="note">• 30 s SmallRye guard head timeout → 504</text>
  <text x="516" y="278" class="note">• 5 min gRPC stream-idle → grpc-status: 4</text>

  <!-- Client RST flood note -->
  <text x="148" y="216" class="note">client RST_STREAM &gt; 200 / 30 s</text>
  <text x="148" y="234" class="note-mono">→ GOAWAY(ENHANCE_YOUR_CALM)</text>

  <!-- Divider: Early Answer / Post-Response Reset -->
  <line class="sep" x1="56" y1="320" x2="944" y2="320"/>
  <text x="480" y="338" class="mono-lbl">ResponseEnds.endResponse — early answer while inbound body is still open</text>

  <!-- Step 1: Edge resets upstream & pauses inbound -->
  <line class="arrow" x1="485" y1="368" x2="855" y2="368" marker-end="url(#arrow)"/>
  <text x="670" y="358" class="arrow-lbl">1a. reset upstream req (H1: SO_LINGER 0 RST · H2: stream reset)</text>
  <text x="302" y="388" class="arrow-lbl">1b. pause inbound stream (return conn credit on 503)</text>

  <!-- Step 2: Drain window / quiet timer -->
  <line class="arrow" x1="128" y1="432" x2="475" y2="432" marker-end="url(#arrow)"/>
  <text x="302" y="422" class="arrow-lbl">in-flight DATA frames drain against stream window</text>
  <text x="504" y="432" class="note">2. hold END_STREAM until: window == 0,</text>
  <text x="504" y="450" class="note">   50 ms quiet period, or 1 s cap expires</text>

  <!-- Step 3: Flush END_STREAM + RST_STREAM(NO_ERROR) -->
  <line class="arrow-return" x1="475" y1="492" x2="128" y2="492" marker-end="url(#arrow)"/>
  <text x="302" y="482" class="arrow-lbl">3. flush response END_STREAM + H2 RST_STREAM(NO_ERROR)</text>

  <!-- Footer caption -->
  <text x="500" y="566" class="caption">Client-ended dispatches (aborts, framing errors, 10 s / 25 s / 5 min timeouts) never retry and never trip the circuit breaker.</text>
</svg>
