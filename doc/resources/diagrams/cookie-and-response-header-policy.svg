<?xml version="1.0" encoding="UTF-8"?>
<!--
  Request/response sequence for Cookie rebuild, CsrfDefence same-origin check,
  UpstreamSetCookieFilter, identity header stripping, LocationRewriter and security headers.
  theme-handling: A (theme-neutral)
  see  pm-documents:ref-svg-diagrams/standards/diagram-type-sequence.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Cookie policy, same-origin check, response filtering, security headers and Location rewrite sequence</title>
  <desc id="desc">A four-actor sequence diagram across Browser/Client, Stage 0 and 2a (Security Headers), Stage 5 and 7 (Forward and Response Relay), and Upstream Target. On the inbound path, Stage 0 seeds global HSTS, XCTO, XFO, CSP and CORS (answering 204 preflights globally), and Stage 2a swaps the four security headers to the route's resolved block after route selection. At Stage 5, ForwardPolicyStage.admittedCookiePairs splits the first Cookie header on semicolons, strips GatewayCookies (__Host-sheriff-* and session cookies), filters by mode (none, exact list, all), and checks CsrfDefence on unsafe methods when admitted cookies are non-empty (requiring matching Origin or fallback Sec-Fetch-Site: same-origin, else CSRF_REJECTED; WebSocket uses websocket.allowed_origins). On the response path at Stage 7, ResponseStage runs UpstreamSetCookieFilter (dropping GatewayCookies, enforcing mode, stripping every Domain attribute), drops Server and X-Powered-By unless keep_identity_headers is true, runs LocationRewriter when rewrite_location is true (mapping in-base-path upstream Location onto the route match key), and merges the route's security headers by header_modes (set overwrites, default fills gaps).</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .actor      { font-size: 13px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .msg        { font-size: 11px; fill: #6e7681; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      .msg-c      { font-size: 11px; fill: #6e7681; text-anchor: middle; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      .note       { font-size: 11px; fill: #6e7681; font-style: italic; text-anchor: middle; }
      .caption    { font-size: 12px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .lifeline   { stroke: #6e7681; stroke-width: 1.0; stroke-dasharray: 4 4; fill: none; }
      .call       { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .ret        { stroke: #6e7681; stroke-width: 1.3; stroke-dasharray: 5 3; fill: none; }
      .sep        { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; fill: none; }
      .arrow-fill { fill: #6e7681; }
    </style>
  </defs>

  <!-- Actor 1: Browser / Client -->
  <rect class="stroke" x="24" y="20" width="168" height="44" rx="6"/>
  <text x="108" y="40" class="actor">Browser / Client</text>
  <text x="108" y="56" class="note">Cookie · Origin</text>
  <line class="lifeline" x1="108" y1="64" x2="108" y2="532"/>

  <!-- Actor 2: Stage 0 & 2a -->
  <rect class="stroke" x="268" y="20" width="200" height="44" rx="6"/>
  <text x="368" y="40" class="actor">Stage 0 &amp; 2a · Security</text>
  <text x="368" y="56" class="note">HSTS · XCTO · XFO · CSP · CORS</text>
  <line class="lifeline" x1="368" y1="64" x2="368" y2="532"/>

  <!-- Actor 3: Stage 5 & 7 -->
  <rect class="stroke" x="568" y="20" width="224" height="44" rx="6"/>
  <text x="680" y="40" class="actor">Stage 5 &amp; 7 · Cookie &amp; Relay</text>
  <text x="680" y="56" class="note">ForwardPolicy · ResponseStage</text>
  <line class="lifeline" x1="680" y1="64" x2="680" y2="532"/>

  <!-- Actor 4: Upstream Target -->
  <rect class="stroke" x="908" y="20" width="184" height="44" rx="6"/>
  <text x="1000" y="40" class="actor">Upstream Target</text>
  <text x="1000" y="56" class="note">HTTP · gRPC · WS</text>
  <line class="lifeline" x1="1000" y1="64" x2="1000" y2="532"/>

  <!-- Step 1: Inbound request -->
  <line class="call" x1="108" y1="96" x2="364" y2="96" marker-end="url(#arrow)"/>
  <text x="236" y="88" class="msg-c">1 · Request + Cookie + Origin</text>

  <!-- Stage 0 & 2a seeding note -->
  <rect class="stroke" x="236" y="108" width="264" height="52" rx="4"/>
  <text x="368" y="128" class="msg-c">Stage 0: global sec-headers + CORS</text>
  <text x="368" y="146" class="note">Stage 2a: swap in route block wholesale</text>

  <!-- Advance to Stage 5 -->
  <line class="call" x1="368" y1="176" x2="676" y2="176" marker-end="url(#arrow)"/>
  <text x="522" y="168" class="msg-c">2 · Routed &amp; authorised request</text>

  <!-- Stage 5 Cookie Rebuild + Same-Origin Check -->
  <rect class="stroke" x="500" y="188" width="360" height="92" rx="4"/>
  <text x="680" y="208" class="msg-c">admittedCookiePairs (1st Cookie on ';'):</text>
  <text x="680" y="224" class="note">drop GatewayCookies · keep none | list | all</text>
  <line class="sep" x1="516" y1="234" x2="844" y2="234"/>
  <text x="680" y="250" class="msg-c">CsrfDefence (unsafe verb + cookies &gt; 0):</text>
  <text x="680" y="268" class="note">Origin or Sec-Fetch-Site: same-origin → else CSRF_REJECTED</text>

  <!-- Forward to Upstream -->
  <line class="call" x1="680" y1="298" x2="996" y2="298" marker-end="url(#arrow)"/>
  <text x="838" y="290" class="msg-c">3 · Single joined Cookie ('; ')</text>

  <!-- Upstream Response -->
  <line class="ret" x1="1000" y1="334" x2="684" y2="334" marker-end="url(#arrow)"/>
  <text x="842" y="326" class="msg-c">4 · Set-Cookie · Server · Location</text>

  <!-- Stage 7 Response Filtering + LocationRewriter -->
  <rect class="stroke" x="504" y="348" width="352" height="112" rx="4"/>
  <text x="680" y="368" class="msg-c">UpstreamSetCookieFilter (HTTP &amp; gRPC):</text>
  <text x="680" y="384" class="note">drop GatewayCookies · mode filter · strip every Domain</text>
  <line class="sep" x1="520" y1="394" x2="840" y2="394"/>
  <text x="680" y="410" class="msg-c">Drop Server &amp; X-Powered-By (unless keep_identity)</text>
  <line class="sep" x1="520" y1="420" x2="840" y2="420"/>
  <text x="680" y="436" class="msg-c">LocationRewriter (when rewrite_location: true):</text>
  <text x="680" y="452" class="note">in-base-path Location → route match key; foreign unchanged</text>

  <!-- Return to Stage 0/2a header modes -->
  <line class="ret" x1="680" y1="478" x2="372" y2="478" marker-end="url(#arrow)"/>
  <text x="526" y="470" class="msg-c">5 · Sanitized response headers</text>

  <!-- Return to Browser with security headers -->
  <line class="ret" x1="368" y1="510" x2="112" y2="510" marker-end="url(#arrow)"/>
  <text x="240" y="502" class="msg-c">6 · header_modes: set | default</text>

  <!-- Footer caption -->
  <text x="560" y="558" class="caption">WebSocket routes enforce websocket.allowed_origins at Stage 3 and relay no upstream response headers; upstream assets strip every Set-Cookie.</text>
</svg>
