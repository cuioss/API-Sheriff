<?xml version="1.0" encoding="UTF-8"?>
<!--
  Request pipeline — inbound request flowing left-to-right through the gateway stages and terminal actions.
  theme-handling: A (theme-neutral)
  see  pm-documents:ref-svg-diagrams/standards/diagram-type-flow.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 440"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">API Sheriff inbound request pipeline and terminal actions</title>
  <desc id="desc">A left-to-right flow across stages 0 through 7 on a virtual thread. Stage 0 seeds global security headers and CORS; Stage 1 runs BasicChecksStage, CanonicalPathGuard, and FramingGate to produce the canonical path. Between Stage 1 and Stage 2, CORS preflights (204), the Host-vs-SNI guard, reserved OIDC endpoints, and the application portal short-circuit before route selection. Stage 2 selects the route (deny-by-default) and Stages 2a and 2b apply route security headers and the verb gate. Stage 3 runs ThoroughChecksStage (body cap, allowed_paths, profile-gated filter). Stage 4 runs CSRF defence, authentication (Bearer or Session), and scope enforcement, marking the trust boundary (rejections between Stage 2 and Stage 4 render as a uniform 404 to untrusted callers). After Stage 4 the pipeline branches by terminal action into Redirect (RedirectStage 3xx), Asset (Stage 5 ForwardPolicyStage then AssetSource), or Proxy (Stage 5 ForwardPolicyStage, Stage 6 DispatchStage, Stage 7 ResponseStage to Upstream).</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .stage      { font-size: 13px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .mono       { font-size: 11px; fill: #6e7681; text-anchor: middle; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      .sub        { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .note       { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .trust-lbl  { font-size: 11px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .track      { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .trust      { stroke: #6e7681; stroke-width: 2.0; stroke-dasharray: 8 4; fill: none; }
      .arrow-fill { fill: #6e7681; }
      .dash       { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; fill: none; }
      .caption    { font-size: 12px; fill: #6e7681; text-anchor: middle; font-style: italic; }
    </style>
  </defs>

  <!-- Pre-trust uniform-404 bracket annotation -->
  <line class="dash" x1="328" y1="42" x2="760" y2="42"/>
  <line class="dash" x1="328" y1="42" x2="328" y2="58"/>
  <line class="dash" x1="760" y1="42" x2="760" y2="58"/>
  <text x="544" y="32" class="note">Pre-trust rejections render as uniform 404 (with timing floor) when uniform_not_found is active</text>

  <!-- Main horizontal track through stages 0..4 -->
  <circle cx="28" cy="200" r="4" class="stroke"/>
  <line class="track" x1="32" y1="200" x2="52" y2="200"/>
  <line class="track" x1="212" y1="200" x2="328" y2="200"/>
  <line class="track" x1="504" y1="200" x2="528" y2="200"/>
  <line class="track" x1="664" y1="200" x2="688" y2="200"/>

  <!-- Stage 0 + 1: Pre-route floor -->
  <rect class="stroke" x="52" y="156" width="160" height="88" rx="6"/>
  <text x="132" y="144" class="stage">Stages 0 – 1</text>
  <text x="132" y="182" class="mono">SecurityHeaders</text>
  <text x="132" y="200" class="mono">BasicChecks · Framing</text>
  <text x="132" y="220" class="sub">canonical path floor</text>

  <!-- Inter-stage junction between Stage 1 and Stage 2 -->
  <circle cx="268" cy="200" r="4" class="stroke"/>
  <line class="track" x1="268" y1="196" x2="268" y2="128" marker-end="url(#arrow)"/>
  <rect class="stroke" x="188" y="68" width="160" height="56" rx="4"/>
  <text x="268" y="90" class="mono">CORS 204 · SNI guard</text>
  <text x="268" y="108" class="mono">OIDC · Portal paths</text>

  <!-- Stage 2 + 2a + 2b: Route selection & verb gate -->
  <rect class="stroke" x="328" y="156" width="176" height="88" rx="6"/>
  <text x="416" y="144" class="stage">Stages 2 – 2b</text>
  <text x="416" y="182" class="mono">RouteSelection</text>
  <text x="416" y="200" class="mono">RouteHeaders · VerbGate</text>
  <text x="416" y="220" class="sub">deny-by-default</text>

  <!-- Stage 3: Post-route thorough checks -->
  <rect class="stroke" x="528" y="156" width="136" height="88" rx="6"/>
  <text x="596" y="144" class="stage">Stage 3</text>
  <text x="596" y="182" class="mono">ThoroughChecks</text>
  <text x="596" y="200" class="mono">max_body_bytes</text>
  <text x="596" y="220" class="sub">allowed_paths · profile</text>

  <!-- Stage 4: Auth & CSRF -->
  <rect class="stroke" x="688" y="156" width="136" height="88" rx="6"/>
  <text x="756" y="144" class="stage">Stage 4</text>
  <text x="756" y="182" class="mono">CsrfDefence</text>
  <text x="756" y="200" class="mono">Auth · Scopes</text>
  <text x="756" y="220" class="sub">bearer / session</text>

  <!-- Trust boundary vertical line after Stage 4 -->
  <line class="trust" x1="844" y1="68" x2="844" y2="344"/>
  <text x="844" y="58" class="trust-lbl">trust boundary</text>

  <!-- Post-auth branch junction -->
  <line class="track" x1="824" y1="200" x2="860" y2="200"/>
  <circle cx="844" cy="200" r="3.5" class="stroke"/>
  <circle cx="864" cy="200" r="4" class="stroke"/>

  <!-- Branch 1 (Top): Redirect terminal action -->
  <path class="track" d="M 864 196 L 864 104 L 892 104" marker-end="url(#arrow)"/>
  <rect class="stroke" x="896" y="76" width="176" height="56" rx="6"/>
  <text x="984" y="98" class="stage">RedirectStage</text>
  <text x="984" y="116" class="sub">3xx + Location (no upstream)</text>

  <!-- Branch 2 (Middle): Asset terminal action -->
  <line class="track" x1="868" y1="200" x2="892" y2="200" marker-end="url(#arrow)"/>
  <rect class="stroke" x="896" y="168" width="136" height="64" rx="6"/>
  <text x="964" y="192" class="mono">5 · ForwardPolicy</text>
  <text x="964" y="212" class="sub">projection</text>
  <line class="track" x1="1032" y1="200" x2="1056" y2="200" marker-end="url(#arrow)"/>
  <rect class="stroke" x="1060" y="168" width="136" height="64" rx="6"/>
  <text x="1128" y="192" class="stage">AssetSource</text>
  <text x="1128" y="212" class="sub">directory / upstream</text>

  <!-- Branch 3 (Bottom): Proxy terminal action (Stages 5 - 7) -->
  <path class="track" d="M 864 204 L 864 296 L 892 296" marker-end="url(#arrow)"/>
  <rect class="stroke" x="896" y="264" width="176" height="64" rx="6"/>
  <text x="984" y="286" class="mono">5 · Forward  6 · Dispatch</text>
  <text x="984" y="304" class="mono">7 · ResponseStage</text>
  <text x="984" y="320" class="sub">HTTP · gRPC · WebSocket</text>
  <line class="track" x1="1072" y1="296" x2="1096" y2="296" marker-end="url(#arrow)"/>
  <rect class="stroke" x="1100" y="264" width="96" height="64" rx="6"/>
  <text x="1148" y="292" class="stage">Upstream</text>
  <text x="1148" y="310" class="sub">origin</text>

  <!-- Cross-cutting observability band -->
  <line class="dash" x1="52" y1="372" x2="1196" y2="372"/>
  <text x="624" y="394" class="note">GatewayEventCounter &amp; SecurityEventCounter &#8594; Prometheus metrics &#183; ErrorResponseWriter (RFC 9457 / gRPC trailers / HTML)</text>

  <!-- Footer caption -->
  <text x="624" y="424" class="caption">Every request runs on a virtual thread; any stage rejection halts the pipeline and renders through the error contract.</text>
</svg>
