<?xml version="1.0" encoding="UTF-8"?>
<!--
  Inbound security filter and framing gate — pre-route floor vs post-route thorough checks.
  theme-handling: A (theme-neutral)
  see  pm-documents:ref-svg-diagrams/standards/diagram-type-block.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Two-stage inbound security filter and anti-smuggling framing gate across route selection</title>
  <desc id="desc">A three-column block diagram. Column 1 (Stage 1 Pre-Route Floor, non-skippable) runs BasicChecksStage (URLPathValidationPipeline producing the canonical path, header name/value pipelines with Authorization and Cookie carve-outs, and maxParameterCount / maxHeaderCount collection caps), CanonicalPathGuard, and FramingGate (rejecting CL+TE, repeated/invalid Content-Length, non-chunked Transfer-Encoding, unexpected GET/HEAD body, and Connection hop-by-hop smuggling). Column 2 (Stage 2 Route Selection) matches the canonical path against the route table and resolves the route's security_filter.profile (strict default, paranoid, lenient, or minimal). Column 3 (Stage 3 Post-Route ThoroughChecksStage) splits into an unconditional resource/surface half (max_body_bytes and allowed_paths, enforced even under minimal) and a profile-gated validation half (raw query parameter name/value pipelines with semicolon-to-%3B forwarding rewrite, plus divergent path/header pipeline re-runs, skipped only under minimal).</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .col-header { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .item-bold  { font-size: 12px; font-weight: 700; fill: #6e7681; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      .item       { font-size: 12px; fill: #6e7681; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      .sub        { font-size: 11px; fill: #6e7681; font-style: italic; }
      .col-sub    { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .caption    { font-size: 12px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .arrow      { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .arrow-fill { fill: #6e7681; }
      .sep        { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; fill: none; }
    </style>
  </defs>

  <!-- Column headers -->
  <text x="184" y="32" class="col-header">Stage 1 · Pre-Route Floor</text>
  <text x="520" y="32" class="col-header">Stage 2 · Route Selection</text>
  <text x="856" y="32" class="col-header">Stage 3 · Post-Route Stage</text>

  <!-- Column boxes -->
  <rect class="stroke" x="24"  y="48" width="320" height="328" rx="6"/>
  <rect class="stroke" x="392" y="48" width="256" height="328" rx="6"/>
  <rect class="stroke" x="696" y="48" width="320" height="328" rx="6"/>

  <!-- Column 1: Stage 1 Pre-Route Floor -->
  <text x="44" y="80"  class="item-bold">BasicChecksStage (gateway baseline)</text>
  <text x="56" y="100" class="item">URLPathValidationPipeline</text>
  <text x="56" y="118" class="sub">→ decodes &amp; produces canonical path</text>
  <text x="56" y="138" class="item">Header name &amp; value pipelines</text>
  <text x="56" y="156" class="sub">Authorization &amp; Cookie length carve-outs</text>
  <text x="56" y="176" class="item">maxParameterCount &amp; maxHeaderCount</text>
  <line class="sep" x1="44" y1="192" x2="324" y2="192"/>

  <text x="44" y="216" class="item-bold">FramingGate (anti-smuggling, 400)</text>
  <text x="56" y="236" class="sub">1. Content-Length + Transfer-Encoding</text>
  <text x="56" y="254" class="sub">2. multi/comma CL or non-1*DIGIT / overflow</text>
  <text x="56" y="272" class="sub">3. repeated or non-chunked Transfer-Encoding</text>
  <text x="56" y="290" class="sub">4. body on GET/HEAD (unless GET CL opt-in)</text>
  <text x="56" y="308" class="sub">5. Connection naming framing/trust header</text>

  <text x="184" y="356" class="col-sub">non-skippable under every profile</text>

  <!-- Gutter 1 → 2 -->
  <line class="arrow" x1="344" y1="212" x2="388" y2="212" marker-end="url(#arrow)"/>
  <text x="366" y="202" class="col-sub">path</text>

  <!-- Column 2: Stage 2 Route Selection -->
  <text x="412" y="84"  class="item-bold">RouteSelectionStage</text>
  <text x="424" y="104" class="sub">matches canonical path:</text>
  <text x="424" y="122" class="sub">exact first, longest-prefix next</text>
  <line class="sep" x1="412" y1="142" x2="628" y2="142"/>

  <text x="412" y="168" class="item-bold">Resolved Filter Profile</text>
  <text x="424" y="190" class="item">strict (default)</text>
  <text x="424" y="210" class="item">paranoid</text>
  <text x="424" y="230" class="item">lenient</text>
  <text x="424" y="250" class="item">minimal</text>
  <line class="sep" x1="412" y1="270" x2="628" y2="270"/>

  <text x="412" y="294" class="sub">minimal inherits limits from nearest</text>
  <text x="412" y="312" class="sub">non-minimal ancestor; refused at boot</text>
  <text x="412" y="330" class="sub">on authenticated or type: bff routes</text>

  <text x="520" y="356" class="col-sub">Stage 2b VerbGate runs before Stage 3</text>

  <!-- Gutter 2 → 3 -->
  <line class="arrow" x1="648" y1="212" x2="692" y2="212" marker-end="url(#arrow)"/>
  <text x="670" y="202" class="col-sub">route</text>

  <!-- Column 3: Stage 3 Post-Route Stage -->
  <text x="716" y="80"  class="item-bold">Always Enforced (all profiles)</text>
  <text x="728" y="100" class="item">max_body_bytes cap (413)</text>
  <text x="728" y="118" class="sub">declared Content-Length + stream counter</text>
  <text x="728" y="138" class="item">allowed_paths allowlist (400/404)</text>
  <text x="728" y="156" class="sub">surface restriction on sub-paths</text>
  <line class="sep" x1="716" y1="176" x2="996" y2="176"/>

  <text x="716" y="202" class="item-bold">Profile-Gated (off under minimal)</text>
  <text x="728" y="222" class="item">Query parameter name &amp; value</text>
  <text x="728" y="240" class="sub">validated on raw &amp;-split wire pairs;</text>
  <text x="728" y="258" class="sub">raw ';' rewritten to '%3B' on forward</text>
  <text x="728" y="280" class="item">Divergent path/header re-run</text>
  <text x="728" y="298" class="sub">runs when route policy ≠ baseline</text>
  <text x="728" y="316" class="sub">(skipped for reserved BFF query params)</text>

  <text x="856" y="356" class="col-sub">feeds SecurityEventCounter &amp; metrics</text>

  <!-- Footer caption -->
  <text x="520" y="402" class="caption">HTTP/1.x framing rejections close the connection; HTTP/2 framing rejections reset only the offending stream with NO_ERROR.</text>
</svg>
