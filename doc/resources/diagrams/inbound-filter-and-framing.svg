<?xml version="1.0" encoding="UTF-8"?>
<!--
  Two-stage inbound security filter and anti-smuggling framing gate flow across route selection.
  theme-handling: A (theme-neutral)
  see  pm-documents:ref-svg-diagrams/standards/diagram-type-flow.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1128 390"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Inbound security filter and anti-smuggling framing gate flow across route selection</title>
  <desc id="desc">A multi-track flow diagram. Every admitted request enters Stage 1 BasicChecksStage (URLPathValidationPipeline producing the single canonical path, header name/value pipelines with Authorization and Cookie carve-outs, and maxParameterCount / maxHeaderCount collection caps) followed by FramingGate (rejecting CL+TE, repeated/invalid Content-Length, non-chunked Transfer-Encoding, unexpected GET/HEAD body, and Connection hop-by-hop smuggling). Any violation exits downward with a pre-trust 400/404 rejection. Validated requests pass through Stage 2 RouteSelectionStage and VerbGateStage to resolve the route and its security_filter.profile, then enter Stage 3 ThoroughChecksStage: first the unconditional resource/surface checks (max_body_bytes 413 and allowed_paths) enforced under all profiles including minimal, then a branch where minimal bypasses Stage 3b directly to Stage 4 while strict, paranoid, and lenient run raw query parameter validation (rewriting ';' to '%3B') and divergent path/header pipeline re-runs.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .stage      { font-size: 13px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .mono       { font-size: 11px; fill: #6e7681; text-anchor: middle; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      .sub        { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .caption    { font-size: 12px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .track      { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .arrow-fill { fill: #6e7681; }
    </style>
  </defs>

  <!-- Entry dot -->
  <circle cx="20" cy="148" r="4" class="stroke"/>
  <line class="track" x1="24" y1="148" x2="48" y2="148" marker-end="url(#arrow)"/>

  <!-- Stage 1a: BasicChecksStage -->
  <rect class="stroke" x="52" y="100" width="192" height="96" rx="6"/>
  <text x="148" y="88"  class="stage">Stage 1 · BasicChecks</text>
  <text x="148" y="122" class="mono">URLPathValidationPipeline</text>
  <text x="148" y="140" class="sub">→ single canonical path</text>
  <text x="148" y="158" class="mono">Header name &amp; value</text>
  <text x="148" y="176" class="sub">Auth/Cookie carve-out · count caps</text>

  <line class="track" x1="244" y1="148" x2="268" y2="148" marker-end="url(#arrow)"/>

  <!-- Stage 1b: FramingGate -->
  <rect class="stroke" x="272" y="100" width="184" height="96" rx="6"/>
  <text x="364" y="88"  class="stage">Stage 1 · FramingGate</text>
  <text x="364" y="122" class="mono">CL + TE · multi/bad CL</text>
  <text x="364" y="140" class="mono">non-chunked TE</text>
  <text x="364" y="158" class="mono">GET/HEAD body guard</text>
  <text x="364" y="176" class="sub">Connection hop-by-hop guard</text>

  <!-- Stage 1 downward rejection branch -->
  <circle cx="148" cy="196" r="4" class="stroke"/>
  <circle cx="364" cy="196" r="4" class="stroke"/>
  <path class="track" d="M 148 200 L 148 232 L 256 232"/>
  <path class="track" d="M 364 200 L 364 232 L 256 232"/>
  <line class="track" x1="256" y1="232" x2="256" y2="260" marker-end="url(#arrow)"/>
  <rect class="stroke" x="136" y="264" width="240" height="56" rx="6"/>
  <text x="256" y="286" class="stage">Pre-Route Reject (400 / 404)</text>
  <text x="256" y="306" class="sub">H1 close · H2 RST_STREAM(NO_ERROR)</text>

  <line class="track" x1="456" y1="148" x2="480" y2="148" marker-end="url(#arrow)"/>

  <!-- Stage 2: RouteSelection + VerbGate -->
  <rect class="stroke" x="484" y="100" width="168" height="96" rx="6"/>
  <text x="568" y="88"  class="stage">Stage 2 · Route &amp; Verb</text>
  <text x="568" y="122" class="mono">RouteSelectionStage</text>
  <text x="568" y="140" class="mono">VerbGateStage</text>
  <text x="568" y="158" class="mono">strict · paranoid</text>
  <text x="568" y="176" class="mono">lenient · minimal</text>

  <line class="track" x1="652" y1="148" x2="676" y2="148" marker-end="url(#arrow)"/>

  <!-- Stage 3a: Unconditional Surface & Body Bounds -->
  <rect class="stroke" x="680" y="100" width="168" height="96" rx="6"/>
  <text x="764" y="88"  class="stage">Stage 3a · Always On</text>
  <text x="764" y="122" class="mono">max_body_bytes (413)</text>
  <text x="764" y="140" class="sub">CL + stream byte counter</text>
  <text x="764" y="158" class="mono">allowed_paths (400/404)</text>
  <text x="764" y="176" class="sub">enforced even under minimal</text>

  <!-- Profile fork after Stage 3a -->
  <line class="track" x1="848" y1="148" x2="864" y2="148"/>
  <circle cx="868" cy="148" r="4" class="stroke"/>

  <!-- Top bypass track: profile == minimal -->
  <path class="track" d="M 868 144 L 868 48 L 1080 48 L 1080 144"/>
  <text x="974" y="38" class="mono">profile == minimal (bypass Stage 3b)</text>

  <!-- Main track: strict / paranoid / lenient -->
  <line class="track" x1="872" y1="148" x2="892" y2="148" marker-end="url(#arrow)"/>
  <rect class="stroke" x="896" y="100" width="168" height="96" rx="6"/>
  <text x="980" y="88"  class="stage">Stage 3b · Profile-Gated</text>
  <text x="980" y="122" class="mono">Query name &amp; value</text>
  <text x="980" y="140" class="sub">raw &amp;-split · ';' → '%3B'</text>
  <text x="980" y="158" class="mono">Path/Header Re-Run</text>
  <text x="980" y="176" class="sub">when route ≠ baseline</text>

  <!-- Re-join after Stage 3b -> Stage 4 -->
  <line class="track" x1="1064" y1="148" x2="1076" y2="148"/>
  <circle cx="1080" cy="148" r="4" class="stroke"/>
  <line class="track" x1="1084" y1="148" x2="1112" y2="148" marker-end="url(#arrow)"/>

  <!-- Stage 3 rejection branch -->
  <circle cx="764" cy="196" r="4" class="stroke"/>
  <circle cx="980" cy="196" r="4" class="stroke"/>
  <path class="track" d="M 764 200 L 764 232 L 872 232"/>
  <path class="track" d="M 980 200 L 980 232 L 872 232"/>
  <line class="track" x1="872" y1="232" x2="872" y2="260" marker-end="url(#arrow)"/>
  <rect class="stroke" x="744" y="264" width="256" height="56" rx="6"/>
  <text x="872" y="286" class="stage">Post-Route Reject (400 / 413 / 404)</text>
  <text x="872" y="306" class="sub">increments SecurityEventCounter · Stage 4 on pass</text>

  <!-- Footer caption -->
  <text x="564" y="364" class="caption">Stage 1 is non-skippable under every profile; Stage 3b is skipped only on unauthenticated routes declaring profile: minimal.</text>
</svg>
