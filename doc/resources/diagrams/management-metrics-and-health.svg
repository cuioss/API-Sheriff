<?xml version="1.0" encoding="UTF-8"?>
<!--
  Management port (:9000) sequence for Prometheus metrics scraping and SmallRye Health readiness probes.
  theme-handling: A (theme-neutral)
  see  pm-documents:ref-svg-diagrams/standards/diagram-type-sequence.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 530"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Management port metrics scrape and readiness probe sequence</title>
  <desc id="desc">A four-actor sequence diagram across Scraper / Probe, Management Port (:9000), Micrometer / SheriffMetrics, and GatewayReadinessCheck. In the top section (Metrics Scrape), a scraper requests GET /q/metrics over HTTPS on port 9000 (or plain HTTP with WARN ApiSheriff-115 when the deployment supplies no key material for the port); Micrometer exports traffic counters/timers (requests_total, request_duration_seconds, upstream_duration_seconds), rejection/detection counters (errors_total, source_trips_total, source_untracked_total, threat_alerts_total, threat_untracked_total, uniform_not_found_overruns_total), and security/auth counters (security_events_total, session_events_total, auth_branch_total, token_validation_errors_total, token_validation_success_operations_total). In the bottom section (Readiness Probe), GET /q/health/ready invokes GatewayReadinessCheck, which checks validated configuration and issuer JWKS key sets (DOWN with jwks: loading or unavailable until every issuer loads keys, then UP with jwks: ready retained across refresh failures) and, when a BFF runtime is active, attaches oidc (server or cookie) and non-fetching oidc_discovery (not-attempted, resolved, or failed without altering the UP/DOWN verdict), returning state tokens only while logging causes via WARN ApiSheriff-116.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .actor      { font-size: 13px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .section    { font-size: 12px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .msg-c      { font-size: 11px; fill: #6e7681; text-anchor: middle; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      .note       { font-size: 11px; fill: #6e7681; font-style: italic; text-anchor: middle; }
      .caption    { font-size: 12px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .lifeline   { stroke: #6e7681; stroke-width: 1.0; stroke-dasharray: 4 4; fill: none; }
      .call       { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .ret        { stroke: #6e7681; stroke-width: 1.3; stroke-dasharray: 5 3; fill: none; }
      .sep        { stroke: #6e7681; stroke-width: 0.7; stroke-dasharray: 4 4; fill: none; }
      .arrow-fill { fill: #6e7681; }
    </style>
  </defs>

  <!-- Actor 1: Scraper / K8s Probe -->
  <rect class="stroke" x="24" y="20" width="184" height="44" rx="6"/>
  <text x="116" y="40" class="actor">Scraper / K8s Probe</text>
  <text x="116" y="56" class="note">Prometheus · Orchestrator</text>
  <line class="lifeline" x1="116" y1="64" x2="116" y2="484"/>

  <!-- Actor 2: Management Port (:9000) -->
  <rect class="stroke" x="288" y="20" width="208" height="44" rx="6"/>
  <text x="392" y="40" class="actor">Management Port (:9000)</text>
  <text x="392" y="56" class="note">HTTPS if keyed · root /q</text>
  <line class="lifeline" x1="392" y1="64" x2="392" y2="484"/>

  <!-- Actor 3: Micrometer / SheriffMetrics -->
  <rect class="stroke" x="596" y="20" width="216" height="44" rx="6"/>
  <text x="704" y="40" class="actor">Micrometer (sheriff_*)</text>
  <text x="704" y="56" class="note">SheriffMetrics · Collectors</text>
  <line class="lifeline" x1="704" y1="64" x2="704" y2="484"/>

  <!-- Actor 4: GatewayReadinessCheck -->
  <rect class="stroke" x="884" y="20" width="212" height="44" rx="6"/>
  <text x="990" y="40" class="actor">GatewayReadinessCheck</text>
  <text x="990" y="56" class="note">SmallRye Health · Non-fetching</text>
  <line class="lifeline" x1="990" y1="64" x2="990" y2="484"/>

  <!-- ============================================================ -->
  <!-- TOP SECTION: Prometheus Metrics Scrape                       -->
  <!-- ============================================================ -->
  <text x="560" y="86" class="section">1 · Metrics Scrape (GET /q/metrics — Isolated from Public Data-Plane Port)</text>

  <line class="call" x1="116" y1="112" x2="388" y2="112" marker-end="url(#arrow)"/>
  <text x="252" y="104" class="msg-c">1 · GET /q/metrics (HTTPS)</text>

  <line class="call" x1="392" y1="136" x2="700" y2="136" marker-end="url(#arrow)"/>
  <text x="546" y="128" class="msg-c">2 · Collect sheriff_* meters</text>

  <rect class="stroke" x="472" y="148" width="464" height="92" rx="4"/>
  <text x="704" y="168" class="msg-c">Traffic: requests_total · request_duration · upstream_duration</text>
  <line class="sep" x1="488" y1="176" x2="920" y2="176"/>
  <text x="704" y="192" class="msg-c">Errors/Recon: errors_total{route,category,event} · source_trips</text>
  <text x="704" y="208" class="note">source_untracked · threat_alerts · threat_untracked · 404_overruns</text>
  <line class="sep" x1="488" y1="216" x2="920" y2="216"/>
  <text x="704" y="232" class="msg-c">Auth: security_events · session_events · auth_branch · token_val_*</text>

  <line class="ret" x1="704" y1="258" x2="120" y2="258" marker-end="url(#arrow)"/>
  <text x="412" y="250" class="msg-c">3 · 200 OK Prometheus exposition</text>

  <!-- ============================================================ -->
  <!-- BOTTOM SECTION: Health & Readiness Probe                     -->
  <!-- ============================================================ -->
  <line class="sep" x1="24" y1="280" x2="1096" y2="280"/>
  <text x="560" y="300" class="section">2 · Readiness Probe (GET /q/health/ready — Non-Fetching State Evaluation)</text>

  <line class="call" x1="116" y1="326" x2="388" y2="326" marker-end="url(#arrow)"/>
  <text x="252" y="318" class="msg-c">1 · GET /q/health/ready</text>

  <line class="call" x1="392" y1="350" x2="986" y2="350" marker-end="url(#arrow)"/>
  <text x="688" y="342" class="msg-c">2 · Read issuer JWKS &amp; BFF discovery state (no network call)</text>

  <rect class="stroke" x="628" y="362" width="468" height="84" rx="4"/>
  <text x="862" y="382" class="msg-c">Token Validation JWKS: loading | unavailable → DOWN</text>
  <text x="862" y="398" class="note">all issuers loaded → UP (jwks: ready, retained across refresh errs)</text>
  <line class="sep" x1="644" y1="408" x2="1080" y2="408"/>
  <text x="862" y="424" class="msg-c">Active BFF: oidc (server|cookie) + oidc_discovery</text>
  <text x="862" y="440" class="note">not-attempted | resolved | failed (never alters UP/DOWN verdict)</text>

  <line class="ret" x1="990" y1="468" x2="120" y2="468" marker-end="url(#arrow)"/>
  <text x="555" y="460" class="msg-c">3 · 200 UP / 503 DOWN (state tokens only; causes logged via WARN 116)</text>

  <!-- Footer caption -->
  <text x="560" y="510" class="caption">Without key material :9000 falls back to plain HTTP for metrics and health and logs WARN ApiSheriff-115 at boot.</text>
</svg>
