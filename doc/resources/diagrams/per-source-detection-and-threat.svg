<?xml version="1.0" encoding="UTF-8"?>
<!--
  Two-tier per-source enumeration detection and threat classification shown as
  parallel state-transition flows over the shared SourceLedger substrate.
  theme-handling: A (theme-neutral)
  see  pm-documents:ref-svg-diagrams/standards/diagram-type-state.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Per-source enumeration detection and threat classification state and event flow</title>
  <desc id="desc">A two-track state and flow diagram. On the left, SourceKeys resolves (source, host) on the event loop before admission (trusted_proxies XFF or TCP peer, IPv6 /64 prefix, unknown Host folded to '*') and ErrorResponseWriter.handleGatewayRejection feeds the true EventType (before uniform 404 masking). The top track shows Tier 1 Enumeration Detection (SourceGate, 65,536-key SourceLedger): a key starts in CLEAR (linear drain threshold/window per second), transitions to TRIPPED / BLOCKED when pre-trust ReconEvents (weight 1) reach threshold (logging WARN ApiSheriff-141, incrementing sheriff_source_trips_total{action}, and feeding +50 to Tier 2), enforces observe (default), delay (held-answer sub-budget), or block (pre-admission 429 SOURCE_BLOCKED + Retry-After), and loops back to CLEAR once drained or expired. The bottom track shows Tier 2 Threat Classification (ThreatClassifier, 65,536-key SourceLedger): weighted rejections (input-validation 10, authn/authz 2, routing 1, recon_trip 50) transition a key from CLEAR to ALERT EPISODE (observe only, emitting one ECS ALERT JSON via WARN ApiSheriff-143 and sheriff_threat_alerts_total) and return to CLEAR only after draining to 0.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .stage      { font-size: 13px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .mono       { font-size: 11px; fill: #6e7681; text-anchor: middle; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      .sub        { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .caption    { font-size: 12px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .track      { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .dash       { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; fill: none; }
      .arrow-fill { fill: #6e7681; }
    </style>
  </defs>

  <!-- Left origin: SourceKeys + handleGatewayRejection -->
  <rect class="stroke" x="20" y="136" width="212" height="128" rx="6"/>
  <text x="126" y="124" class="stage">SourceKey &amp; Event Feed</text>
  <text x="126" y="158" class="mono">SourceKeys: (source, host)</text>
  <text x="126" y="176" class="sub">XFF/peer · IPv6 /64 · host or '*'</text>
  <line class="dash" x1="36" y1="190" x2="216" y2="190"/>
  <text x="126" y="210" class="mono">handleGatewayRejection</text>
  <text x="126" y="228" class="sub">feeds true EventType before</text>
  <text x="126" y="246" class="sub">uniform 404 masking</text>

  <!-- Split junction to Tier 1 (top) and Tier 2 (bottom) -->
  <line class="track" x1="232" y1="200" x2="254" y2="200"/>
  <circle cx="258" cy="200" r="4" class="stroke"/>
  <path class="track" d="M 258 196 L 258 96 L 292 96" marker-end="url(#arrow)"/>
  <path class="track" d="M 258 204 L 258 312 L 292 312" marker-end="url(#arrow)"/>

  <!-- ============================================================ -->
  <!-- TOP TRACK: Tier 1 Enumeration Detection (SourceGate)         -->
  <!-- ============================================================ -->
  <text x="716" y="26" class="stage">Tier 1 · Enumeration Detection (SourceGate · 65,536-key SourceLedger · overflow WARN 142)</text>

  <!-- State 1: CLEAR -->
  <rect class="stroke" x="296" y="56" width="184" height="80" rx="8" ry="8"/>
  <text x="388" y="80"  class="stage">State: CLEAR</text>
  <text x="388" y="100" class="mono">ReconEvents (weight = 1)</text>
  <text x="388" y="118" class="sub">pre-trust only · linear drain</text>

  <!-- Transition CLEAR -> TRIPPED -->
  <line class="track" x1="480" y1="96" x2="664" y2="96" marker-end="url(#arrow)"/>
  <text x="572" y="68"  class="mono">count &gt;= threshold</text>
  <text x="572" y="84"  class="sub">WARN 141 · SOURCE_TRIPPED</text>

  <!-- Cross-tier feed: Tier 1 trip -> Tier 2 (+50), routed clear of labels -->
  <circle cx="540" cy="96" r="4" class="stroke"/>
  <path class="track" d="M 540 100 L 540 214 L 404 214 L 404 264" marker-end="url(#arrow)"/>
  <text x="472" y="206" class="mono">recon_trip (+50)</text>

  <!-- State 2: TRIPPED / BLOCKED -->
  <rect class="stroke" x="668" y="44" width="248" height="104" rx="8" ry="8"/>
  <text x="792" y="66"  class="stage">State: TRIPPED / BLOCKED</text>
  <text x="792" y="86"  class="mono">• observe: wire unchanged</text>
  <text x="792" y="104" class="mono">• delay: hold 404 (cap → 429)</text>
  <text x="792" y="122" class="mono">• block: pre-admit 429</text>
  <text x="792" y="138" class="sub">sheriff_source_trips_total{action}</text>

  <!-- Terminal wire output on block -->
  <line class="track" x1="916" y1="96" x2="956" y2="96" marker-end="url(#arrow)"/>
  <rect class="stroke" x="960" y="64" width="176" height="64" rx="6"/>
  <text x="1048" y="90"  class="stage">429 SOURCE_BLOCKED</text>
  <text x="1048" y="110" class="sub">+ Retry-After on event loop</text>

  <!-- Back-edge TRIPPED -> CLEAR -->
  <path class="track" d="M 792 148 Q 792 178 590 178 Q 388 178 388 140" marker-end="url(#arrow)"/>
  <text x="688" y="194" class="sub">drains to 0 or block_seconds expires</text>

  <!-- ============================================================ -->
  <!-- BOTTOM TRACK: Tier 2 Threat Classification (ThreatClassifier) -->
  <!-- ============================================================ -->
  <line class="dash" x1="276" y1="228" x2="1136" y2="228"/>
  <text x="792" y="250" class="stage">Tier 2 · Threat Classification (ThreatClassifier · 65,536-key SourceLedger · overflow WARN 144)</text>

  <!-- State 1: CLEAR (Weighted Score) -->
  <rect class="stroke" x="296" y="268" width="216" height="84" rx="8" ry="8"/>
  <text x="404" y="290" class="stage">State: CLEAR (Scoring)</text>
  <text x="404" y="308" class="mono">input-val: 10 · authn/z: 2</text>
  <text x="404" y="326" class="mono">routing: 1 · recon_trip: 50</text>
  <text x="404" y="342" class="sub">pre- &amp; post-trust · linear drain</text>

  <!-- Transition CLEAR -> ALERT EPISODE -->
  <line class="track" x1="512" y1="312" x2="664" y2="312" marker-end="url(#arrow)"/>
  <text x="588" y="300" class="mono">score &gt;= threshold</text>

  <!-- State 2: ALERT EPISODE -->
  <rect class="stroke" x="668" y="268" width="248" height="84" rx="8" ry="8"/>
  <text x="792" y="290" class="stage">State: ALERT EPISODE</text>
  <text x="792" y="310" class="mono">action = observe (fixed)</text>
  <text x="792" y="328" class="sub">one alert per episode until</text>
  <text x="792" y="344" class="sub">score drains completely to 0</text>

  <!-- Alert output -->
  <line class="track" x1="916" y1="312" x2="956" y2="312" marker-end="url(#arrow)"/>
  <rect class="stroke" x="960" y="280" width="176" height="64" rx="6"/>
  <text x="1048" y="304" class="stage">ECS ALERT Log</text>
  <text x="1048" y="322" class="mono">WARN ApiSheriff-143</text>
  <text x="1048" y="338" class="sub">sheriff_threat_alerts_total</text>

  <!-- Back-edge ALERT EPISODE -> CLEAR -->
  <path class="track" d="M 792 352 Q 792 384 598 384 Q 404 384 404 356" marker-end="url(#arrow)"/>
  <text x="598" y="376" class="sub">score drains to 0 (re-arms episode)</text>

  <!-- Footer caption -->
  <text x="580" y="418" class="caption">Tier 1 excludes post-trust, asset, favicon/robots, and body-abort events; Tier 2 still scores 400 filter violations on any path.</text>
</svg>
