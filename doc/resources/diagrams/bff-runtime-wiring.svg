<?xml version="1.0" encoding="UTF-8"?>
<!--
  BFF runtime request dispatch flow through ReservedPathRegistry and SessionAuthenticationStage
  into the SessionBinding seam and token-sheriff-client engine with IdP controls.
  theme-handling: A (theme-neutral)
  see  pm-documents:ref-svg-diagrams/standards/diagram-type-flow.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 368"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">BFF runtime request dispatch flow, SessionBinding seam, and IdP-facing controls</title>
  <desc id="desc">A multi-track flow diagram of the BFF runtime. On the left, BffRuntime (built at boot by BffRuntimeProducer, or inert without a global oidc block) splits incoming requests into two tracks. The top track matches ReservedPathRegistry by exact path before the route table (login, callback, widening, user, logout on the OIDC host; backchannel-logout and /bff/jwks on every host; bypassing the URL-parameter value pipeline). The bottom track mediates routed requests via SessionAuthenticationStage and CsrfDefence. Both tracks converge on the SessionBinding seam (bind, persist, persistReissuingCookie with absolute and idle deadlines), realized either by server mode (opaque handle + bounded InMemorySessionStore + 1-minute sweep) or cookie mode (AES-256-GCM sealed cookie + HMAC-SHA-256 activity cookie), and drive token-sheriff-client with boot-assembled IdP controls: private_key_jwt (or client_secret_basic), Pushed Authorization Requests (PAR) on every authorization seam, DPoP SenderConstraint, and BoundTokenEndpointClient requiring token_type DPoP with matching cnf.jkt (RFC 9470 step-up is assembled but not currently driven by the live edge).</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .stage      { font-size: 13px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .mono       { font-size: 11px; fill: #6e7681; text-anchor: middle; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      .sub        { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .caption    { font-size: 12px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .track      { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .dash       { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; fill: none; }
      .arrow-fill { fill: #6e7681; }
    </style>
  </defs>

  <!-- Step 1: Edge Admission (BffRuntime) -->
  <rect class="stroke" x="20" y="108" width="192" height="128" rx="6"/>
  <text x="116" y="132" class="stage">Edge · BffRuntime</text>
  <text x="116" y="152" class="mono">BffRuntimeProducer</text>
  <text x="116" y="170" class="sub">assembled at boot when</text>
  <text x="116" y="186" class="sub">global oidc is configured</text>
  <line class="dash" x1="36" y1="198" x2="196" y2="198"/>
  <text x="116" y="218" class="sub">inert runtime otherwise</text>

  <!-- Fork to ReservedPathRegistry (top) and Routed Stage 4 (bottom) -->
  <line class="track" x1="212" y1="172" x2="232" y2="172"/>
  <circle cx="236" cy="172" r="4" class="stroke"/>
  <path class="track" d="M 236 168 L 236 96 L 260 96" marker-end="url(#arrow)"/>
  <path class="track" d="M 236 176 L 236 248 L 260 248" marker-end="url(#arrow)"/>

  <!-- Top Track: ReservedPathRegistry -->
  <rect class="stroke" x="264" y="36" width="256" height="120" rx="6"/>
  <text x="392" y="58"  class="stage">ReservedPathRegistry</text>
  <text x="392" y="76"  class="sub">exact match before route table</text>
  <text x="392" y="94"  class="mono">login · callback · widen · logout</text>
  <text x="392" y="110" class="sub">(OIDC host only; bypasses param filter)</text>
  <line class="dash" x1="280" y1="120" x2="504" y2="120"/>
  <text x="392" y="136" class="mono">backchannel-logout · /bff/jwks</text>
  <text x="392" y="150" class="sub">(matched on every host)</text>

  <!-- Bottom Track: Routed SessionAuthenticationStage -->
  <rect class="stroke" x="264" y="188" width="256" height="120" rx="6"/>
  <text x="392" y="210" class="stage">Routed · SessionAuthStage</text>
  <text x="392" y="230" class="mono">require: session | fallback</text>
  <text x="392" y="248" class="mono">+ CsrfDefence (unsafe verbs)</text>
  <line class="dash" x1="280" y1="260" x2="504" y2="260"/>
  <text x="392" y="278" class="sub">near-expiry &amp; scope refresh;</text>
  <text x="392" y="294" class="sub">closes WS via SessionRelayRegistry</text>

  <!-- Converge into SessionBinding Seam -->
  <line class="track" x1="520" y1="96"  x2="564" y2="96"  marker-end="url(#arrow)"/>
  <line class="track" x1="520" y1="248" x2="564" y2="248" marker-end="url(#arrow)"/>

  <!-- Middle Box: SessionBinding Seam -->
  <rect class="stroke" x="568" y="36" width="260" height="272" rx="6"/>
  <text x="698" y="58"  class="stage">SessionBinding Seam</text>
  <text x="698" y="78"  class="mono">bind · persist ·</text>
  <text x="698" y="94"  class="mono">persistReissuingCookie</text>
  <text x="698" y="110" class="sub">absolute expiry + idle timeout</text>
  <line class="dash" x1="584" y1="122" x2="812" y2="122"/>
  <text x="698" y="142" class="stage">mode: server</text>
  <text x="698" y="160" class="mono">opaque cookie handle</text>
  <text x="698" y="176" class="sub">InMemorySessionStore (max_sessions,</text>
  <text x="698" y="192" class="sub">per-subject cap, 1-min sweep)</text>
  <line class="dash" x1="584" y1="204" x2="812" y2="204"/>
  <text x="698" y="224" class="stage">mode: cookie</text>
  <text x="698" y="242" class="mono">AES-256-GCM sealed cookie</text>
  <text x="698" y="258" class="sub">+ HMAC-SHA-256 -activity cookie</text>
  <text x="698" y="274" class="sub">+ PendingAuthorizationStore (login)</text>

  <!-- Advance to Engine & IdP Controls -->
  <line class="track" x1="828" y1="172" x2="872" y2="172" marker-end="url(#arrow)"/>

  <!-- Right Box: token-sheriff-client & IdP Controls -->
  <rect class="stroke" x="876" y="36" width="264" height="272" rx="6"/>
  <text x="1008" y="58"  class="stage">Engine &amp; IdP Controls</text>
  <text x="1008" y="78"  class="mono">token-sheriff-client</text>
  <text x="1008" y="96"  class="sub">login · callback · widening ·</text>
  <text x="1008" y="112" class="sub">logout · refresh (step-up inactive)</text>
  <line class="dash" x1="892" y1="124" x2="1124" y2="124"/>
  <text x="1008" y="144" class="mono">1. private_key_jwt (default)</text>
  <text x="1008" y="160" class="sub">or client_secret_basic (WARN 133)</text>
  <line class="dash" x1="892" y1="172" x2="1124" y2="172"/>
  <text x="1008" y="192" class="mono">2. Pushed Auth Requests (PAR)</text>
  <text x="1008" y="208" class="sub">every auth seam; fail → 502 (132)</text>
  <line class="dash" x1="892" y1="220" x2="1124" y2="220"/>
  <text x="1008" y="240" class="mono">3. DPoP SenderConstraint</text>
  <text x="1008" y="258" class="mono">4. BoundTokenEndpointClient</text>
  <text x="1008" y="274" class="sub">requires token_type=DPoP + cnf.jkt</text>
  <text x="1008" y="290" class="sub">unbound callback → 400 (WARN 134)</text>

  <!-- Footer caption -->
  <text x="580" y="346" class="caption">OIDC discovery metadata is resolved lazily on first engine use so the gateway boots without a live IdP; GatewayJson serializes BFF JSON bodies.</text>
</svg>
