<?xml version="1.0" encoding="UTF-8"?>
<!--
  Lifecycle flow from boot-time assembly and deduplication into shared runtime state
  and isolated per-request virtual-thread stack execution.
  theme-handling: A (theme-neutral)
  see  pm-documents:ref-svg-diagrams/standards/diagram-type-flow.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 376"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Boot-time assembly, shared state reuse, and per-request stack execution flow</title>
  <desc id="desc">A left-to-right lifecycle flow diagram. In Phase 1 (Boot-Time Assembly), RouteTableBuilder constructs framework-free Route records (neededScopes, allowed_methods, cookies, cookieOriginDefence, LocationRewriter, matchers) and RouteAssembler attaches boot-only components via toBuilder(): deduplicated SecurityPostures (one per distinct filter shape), UpstreamClients (one Vert.x pool per UpstreamTarget), ResilienceShape guards (one SmallRye FT guard per target and retry setting), AssetSource, TokenValidator, and ForwardedHeaderResolver. This produces two shared runtime tiers in the center: Shared Immutable State (read-only AssembledRoutes, postures, pools, TokenValidator, ForwardedHeaderResolver) and Shared Bounded/Lock-Free State (20-call circuit-breaker windows, AtomicLong event counters, 65,536-key SourceLedgers, and bounded BFF stores). In Phase 2 (Per-Request Execution on the right), each request reads the immutable tier, updates only bounded/lock-free counters, and keeps all per-request state on its own virtual-thread stack (PipelineRequest, ResolvedForwarding, AccessTokenContent, Route reference) while streaming body chunks unbuffered on the event loop.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .stage      { font-size: 13px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .mono       { font-size: 11px; fill: #6e7681; text-anchor: middle; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      .sub        { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .caption    { font-size: 12px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .track      { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .dash       { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; fill: none; }
      .arrow-fill { fill: #6e7681; }
    </style>
  </defs>

  <!-- Phase 1: Boot-Time Assembly -->
  <rect class="stroke" x="20" y="36" width="308" height="292" rx="6"/>
  <text x="174" y="58"  class="stage">1 · Boot-Time Assembly (Once)</text>
  <text x="174" y="80"  class="mono">Step A: RouteTableBuilder</text>
  <text x="174" y="98"  class="sub">framework-free Route records:</text>
  <text x="174" y="114" class="sub">neededScopes · allowed_methods · cookies</text>
  <text x="174" y="130" class="sub">cookieOriginDefence · LocationRewriter</text>
  <line class="dash" x1="36" y1="144" x2="312" y2="144"/>
  <text x="174" y="164" class="mono">Step B: RouteAssembler (toBuilder)</text>
  <text x="174" y="182" class="sub">• SecurityPostures (1 / filter shape)</text>
  <text x="174" y="198" class="sub">• UpstreamClients (1 pool / target)</text>
  <text x="174" y="214" class="sub">• ResilienceShape (1 guard / target+retry)</text>
  <text x="174" y="230" class="sub">• AssetSource (directory | upstream)</text>
  <line class="dash" x1="36" y1="244" x2="312" y2="244"/>
  <text x="174" y="264" class="mono">Shared Singleton Services</text>
  <text x="174" y="282" class="sub">TokenValidator (JWKS cache-backed)</text>
  <text x="174" y="298" class="sub">ForwardedHeaderResolver · BffRuntime</text>

  <!-- Fork from Boot Assembly into Immutable vs Bounded Shared State -->
  <line class="track" x1="328" y1="182" x2="352" y2="182"/>
  <circle cx="356" cy="182" r="4" class="stroke"/>
  <path class="track" d="M 356 178 L 356 106 L 384 106" marker-end="url(#arrow)"/>
  <path class="track" d="M 356 186 L 356 258 L 384 258" marker-end="url(#arrow)"/>

  <!-- Middle Top: Shared Immutable State -->
  <rect class="stroke" x="388" y="36" width="352" height="136" rx="6"/>
  <text x="564" y="58"  class="stage">2a · Shared Immutable State (Read-Only)</text>
  <text x="564" y="78"  class="mono">AssembledRoutes (exact → longest prefix)</text>
  <text x="564" y="96"  class="mono">SecurityPostures &amp; SecurityConfiguration</text>
  <text x="564" y="114" class="mono">Vert.x HttpClient Pools &amp; Egress TLS</text>
  <text x="564" y="132" class="mono">TokenValidator · ForwardedHeaderResolver</text>
  <text x="564" y="152" class="sub">zero runtime compilation or anchor lookups</text>

  <!-- Middle Bottom: Shared Bounded / Lock-Free State -->
  <rect class="stroke" x="388" y="188" width="352" height="140" rx="6"/>
  <text x="564" y="210" class="stage">2b · Shared Bounded &amp; Lock-Free State</text>
  <text x="564" y="230" class="mono">SmallRye FT Breakers (20-call windows)</text>
  <text x="564" y="248" class="mono">GatewayEventCounter &amp; SecurityEventCounter</text>
  <text x="564" y="266" class="mono">SourceGate &amp; ThreatClassifier (65,536 cap)</text>
  <text x="564" y="284" class="mono">BFF InMemorySessionStore (max_sessions)</text>
  <text x="564" y="304" class="sub">+ PendingAuthorizationStore &amp; WS RelayRegistry</text>

  <!-- Arrows into Phase 2 Per-Request Execution -->
  <line class="track" x1="740" y1="106" x2="788" y2="106" marker-end="url(#arrow)"/>
  <line class="track" x1="740" y1="258" x2="788" y2="258" marker-end="url(#arrow)"/>

  <!-- Phase 2: Per-Request Stack & Stream State -->
  <rect class="stroke" x="792" y="36" width="348" height="292" rx="6"/>
  <text x="966" y="58"  class="stage">3 · Per-Request Execution (Isolated)</text>
  <text x="966" y="80"  class="mono">Virtual-Thread Stack Only (Never Shared)</text>
  <text x="966" y="100" class="mono">• PipelineRequest</text>
  <text x="966" y="118" class="mono">• ResolvedForwarding</text>
  <text x="966" y="136" class="mono">• Validated AccessTokenContent</text>
  <text x="966" y="154" class="mono">• Matched Route &amp; stream references</text>
  <text x="966" y="174" class="sub">preventing any cross-request state bleed</text>
  <line class="dash" x1="808" y1="190" x2="1124" y2="190"/>
  <text x="966" y="212" class="mono">Event-Loop Stream State</text>
  <text x="966" y="232" class="sub">• ReadStream.pipeTo chunks flow with</text>
  <text x="966" y="248" class="sub">  backpressure on connection event loop</text>
  <text x="966" y="266" class="sub">• Streaming max_body_bytes byte counter</text>
  <text x="966" y="284" class="sub">• Proxied payloads never buffered in heap</text>

  <!-- Footer caption -->
  <text x="580" y="356" class="caption">N routes targeting the same backend share one Vert.x connection pool; N routes sharing a filter profile share one SecurityPosture.</text>
</svg>
