<?xml version="1.0" encoding="UTF-8"?>
<!--
  Threading model: Vert.x event loop owns socket I/O, per-request virtual thread runs pipeline logic.
  theme-handling: A (theme-neutral)
  see  pm-documents:ref-svg-diagrams/standards/diagram-type-block.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 336"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Threading model: event loop socket ownership and per-request virtual thread</title>
  <desc id="desc">A three-column block diagram. Column 1, the Vert.x Event Loop: owns the inbound socket; performs L4 accept and SNI parsing; reads reserved POST bodies (back-channel logout) before the virtual-thread hop; handles pause and resume; writing responses from the virtual thread must marshal back with runOnContext. Column 2, the Request Virtual Thread: one virtual thread per admitted request on Java 25 (JEP 491, no carrier pinning); runs synchronous CPU pipeline logic (stages 1 through 5, inbound security validation); coordinates data-plane streaming without blocking on body bytes; handles control-plane cui-http calls. Column 3, Socket Ownership Rule: inbound-socket I/O must never run inline on the virtual thread; draining a paused body on the virtual thread causes read-deadline timeouts under CPU contention (1 to 2 cores).</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .col-header { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .item-bold  { font-size: 12px; font-weight: 700; fill: #6e7681; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      .item       { font-size: 12px; fill: #6e7681; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      .sub        { font-size: 11px; fill: #6e7681; font-style: italic; }
      .col-sub    { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .gut        { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .caption    { font-size: 12px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .arrow      { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .arrow-fill { fill: #6e7681; }
      .sep        { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; fill: none; }
    </style>
  </defs>

  <text x="184" y="32" class="col-header">Event Loop (Socket Owner)</text>
  <rect class="stroke" x="24" y="48" width="320" height="268" rx="6"/>
  <text x="44" y="80" class="item-bold">Inbound Socket Operations</text>
  <text x="56" y="102" class="sub">L4 accept &amp; cleartext SNI split</text>
  <text x="56" y="120" class="sub">pause() / resume() on inbound stream</text>
  <text x="56" y="138" class="sub">WebSocket upgrade (toWebSocket)</text>
  <line class="sep" x1="44" y1="150" x2="324" y2="150"/>
  <text x="44" y="174" class="item-bold">Reserved Body (pre-hop)</text>
  <text x="56" y="196" class="sub">back-channel logout body read</text>
  <text x="56" y="214" class="sub">on event loop before VT hop (ADR-0019)</text>
  <line class="sep" x1="44" y1="226" x2="324" y2="226"/>
  <text x="44" y="250" class="item-bold">Writing Responses</text>
  <text x="56" y="272" class="sub">ctx.vertx().runOnContext(...)</text>

  <text x="552" y="32" class="col-header">Per-Request Virtual Thread</text>
  <rect class="stroke" x="392" y="48" width="320" height="268" rx="6"/>
  <text x="412" y="80" class="item-bold">Java 25 Baseline (JEP 491)</text>
  <text x="424" y="102" class="sub">no carrier-thread pinning on sync blocks</text>
  <text x="424" y="120" class="sub">CI matrix verifies Java 25 &amp; 26</text>
  <line class="sep" x1="412" y1="132" x2="692" y2="132"/>
  <text x="412" y="156" class="item-bold">Synchronous Pipeline Logic</text>
  <text x="424" y="178" class="sub">Stage 1 floor · Stage 2 routing</text>
  <text x="424" y="196" class="sub">Stage 3 thorough checks · Stage 4 auth</text>
  <text x="424" y="214" class="sub">Stage 5 forward policy</text>
  <line class="sep" x1="412" y1="226" x2="692" y2="226"/>
  <text x="412" y="250" class="item-bold">I/O Coordination</text>
  <text x="424" y="272" class="sub">streams bodies via ReadStream.pipeTo</text>
  <text x="424" y="290" class="sub">cui-http control-plane calls</text>

  <text x="888" y="32" class="col-header">Socket Invariant</text>
  <rect class="stroke" x="760" y="48" width="256" height="268" rx="6"/>
  <text x="780" y="80" class="item-bold">Never drive socket I/O</text>
  <text x="780" y="108" class="item-bold">from the virtual thread!</text>
  <text x="792" y="130" class="sub">virtual thread = pipeline logic</text>
  <text x="792" y="148" class="sub">event loop = inbound socket</text>
  <line class="sep" x1="780" y1="160" x2="996" y2="160"/>
  <text x="780" y="184" class="item-bold">CPU Contention Risk</text>
  <text x="792" y="206" class="sub">draining paused body on VT</text>
  <text x="792" y="224" class="sub">causes read deadlines on 1-2 cores</text>
  <text x="792" y="242" class="sub">reproduce: docker --cpus 1</text>

  <line class="arrow" x1="348" y1="182" x2="388" y2="182" marker-end="url(#arrow)"/>
  <text x="368" y="174" class="gut">hop</text>
  <line class="arrow" x1="716" y1="182" x2="756" y2="182" marker-end="url(#arrow)"/>
</svg>
