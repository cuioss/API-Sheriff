<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sequence diagram of the boundary between the Vert.x inbound connection event loop
  and the per-request Java 25 virtual thread.
  theme-handling: A (theme-neutral)
  see  pm-documents:ref-svg-diagrams/standards/diagram-type-sequence.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 550"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Event loop and per-request virtual thread handoff sequence</title>
  <desc id="desc">A four-actor sequence diagram across Client Socket, Inbound Event Loop (Socket Owner), Per-Request Virtual Thread (Java 25), and Upstream / Control I/O. Step 1: the Client Socket delivers the request to the Inbound Event Loop, which runs pre-admission checks (SourceGate 429, admission cap 503 via ResponseEnds.reject) and either pauses the proxied stream (request.pause()) or buffers a back-channel logout POST body via ReservedBodyReader#readReservedBodyThenDispatch before hopping. Step 2: execution hops to the Per-Request Virtual Thread (Java 25 JEP 491, no carrier pinning on synchronized blocks), which runs synchronous CPU pipeline logic (Stages 1–5, offline TokenValidator) and any cui-http control-plane calls, while respecting the hard invariant never to drive inbound-socket I/O inline from the virtual thread. Step 3: the virtual thread marshals socket actions back to the Inbound Event Loop via ctx.vertx().runOnContext(...). Step 4: the Inbound Event Loop drives ReadStream.pipeTo streaming (or toWebSocket()) against Upstream I/O and writes the response back to the Client Socket.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .actor      { font-size: 13px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .msg-c      { font-size: 11px; fill: #6e7681; text-anchor: middle; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      .note       { font-size: 11px; fill: #6e7681; font-style: italic; text-anchor: middle; }
      .caption    { font-size: 12px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .lifeline   { stroke: #6e7681; stroke-width: 1.0; stroke-dasharray: 4 4; fill: none; }
      .call       { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .ret        { stroke: #6e7681; stroke-width: 1.3; stroke-dasharray: 5 3; fill: none; }
      .sep        { stroke: #6e7681; stroke-width: 0.7; stroke-dasharray: 4 4; fill: none; }
      .arrow-fill { fill: #6e7681; }
    </style>
  </defs>

  <!-- Actor 1: Client Socket -->
  <rect class="stroke" x="24" y="20" width="168" height="44" rx="6"/>
  <text x="108" y="40" class="actor">Client Socket</text>
  <text x="108" y="56" class="note">TLS · H1 / H2 / WS</text>
  <line class="lifeline" x1="108" y1="64" x2="108" y2="504"/>

  <!-- Actor 2: Inbound Event Loop -->
  <rect class="stroke" x="268" y="20" width="224" height="44" rx="6"/>
  <text x="380" y="40" class="actor">Inbound Event Loop</text>
  <text x="380" y="56" class="note">Owns inbound socket I/O</text>
  <line class="lifeline" x1="380" y1="64" x2="380" y2="504"/>

  <!-- Actor 3: Per-Request Virtual Thread -->
  <rect class="stroke" x="580" y="20" width="236" height="44" rx="6"/>
  <text x="698" y="40" class="actor">Request Virtual Thread</text>
  <text x="698" y="56" class="note">Java 25 (JEP 491 · no pinning)</text>
  <line class="lifeline" x1="698" y1="64" x2="698" y2="504"/>

  <!-- Actor 4: Upstream / Control I/O -->
  <rect class="stroke" x="888" y="20" width="208" height="44" rx="6"/>
  <text x="992" y="40" class="actor">Upstream &amp; Control I/O</text>
  <text x="992" y="56" class="note">Vert.x Pool · cui-http</text>
  <line class="lifeline" x1="992" y1="64" x2="992" y2="504"/>

  <!-- Step 1: Inbound arrival on Event Loop -->
  <line class="call" x1="108" y1="92" x2="376" y2="92" marker-end="url(#arrow)"/>
  <text x="242" y="84" class="msg-c">1 · Request head arrives</text>

  <rect class="stroke" x="208" y="104" width="344" height="68" rx="4"/>
  <text x="380" y="124" class="msg-c">Pre-admission: SourceGate 429 · cap 503</text>
  <text x="380" y="142" class="note">Proxied route: request.pause() on event loop</text>
  <text x="380" y="158" class="note">Back-channel logout: ReservedBodyReader buffers first</text>

  <!-- Step 2: Hop to Virtual Thread -->
  <line class="call" x1="380" y1="190" x2="694" y2="190" marker-end="url(#arrow)"/>
  <text x="537" y="182" class="msg-c">2 · Dispatch to per-request virtual thread</text>

  <rect class="stroke" x="508" y="202" width="380" height="88" rx="4"/>
  <text x="698" y="222" class="msg-c">Synchronous CPU Pipeline (Stages 1–5):</text>
  <text x="698" y="238" class="note">floor · route · verb · thorough filter · TokenValidator · forward</text>
  <line class="sep" x1="524" y1="248" x2="872" y2="248"/>
  <text x="698" y="264" class="msg-c">INVARIANT: Never touch inbound socket on VT</text>
  <text x="698" y="280" class="note">(draining paused body on VT times out under 1–2 CPU cores)</text>

  <!-- Step 3a: Control-plane or Guard invocation -->
  <line class="call" x1="698" y1="312" x2="988" y2="312" marker-end="url(#arrow)"/>
  <text x="845" y="304" class="msg-c">3a · Control-plane cui-http / Stage 6 Guard</text>

  <!-- Step 3b: Marshal back to Event Loop via runOnContext -->
  <line class="ret" x1="698" y1="348" x2="384" y2="348" marker-end="url(#arrow)"/>
  <text x="537" y="340" class="msg-c">3b · ctx.vertx().runOnContext(v -&gt; …)</text>

  <!-- Step 4: Event Loop drives Pipe streaming / WebSocket upgrade -->
  <rect class="stroke" x="220" y="362" width="320" height="52" rx="4"/>
  <text x="380" y="382" class="msg-c">Event loop owns resume() / Pipe / toWebSocket()</text>
  <text x="380" y="400" class="note">and every response write (ErrorResponseWriter, assets)</text>

  <line class="call" x1="380" y1="434" x2="988" y2="434" marker-end="url(#arrow)"/>
  <text x="684" y="426" class="msg-c">4 · ReadStream.pipeTo (non-blocking backpressure)</text>

  <line class="ret" x1="992" y1="464" x2="384" y2="464" marker-end="url(#arrow)"/>
  <text x="684" y="456" class="msg-c">5 · Upstream response stream</text>

  <line class="ret" x1="380" y1="490" x2="112" y2="490" marker-end="url(#arrow)"/>
  <text x="242" y="482" class="msg-c">6 · Write response on event loop</text>

  <!-- Footer caption -->
  <text x="560" y="532" class="caption">Proxied request and response bodies stream directly between event loops and are never buffered on the virtual-thread stack.</text>
</svg>
