<?xml version="1.0" encoding="UTF-8"?>
<!--
  Upstream client split by plane: streaming data plane, programmatic resilience guard, cui-http control plane.
  theme-handling: A (theme-neutral)
  see  pm-documents:ref-svg-diagrams/standards/diagram-type-block.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 394"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Upstream client split by plane with the fixed resilience guard</title>
  <desc id="desc">A three-column block diagram. Column 1, the data plane: a Vert.x HttpClient with one shared pool per distinct upstream target (scheme, host, port, forced HTTP/2), streaming request and response bodies with backpressure, natively handling trailers, WebSocket upgrades and upstream HTTP/2; non-h2 clients close abortively with SO_LINGER 0. Column 2, the programmatic SmallRye Fault Tolerance guard built at boot per upstream target and retry setting: retry only when enabled, at most two retries 100 ms apart, idempotent methods and only when zero body bytes were sent; a fixed circuit breaker over a rolling window of 20 calls opening at 50 percent failures for 5 seconds and closing after two successes; a fixed 30 second timeout until the response head; client-ended dispatches are neither failures nor retried. Column 3, the control plane: cui-http HttpHandler, ResilientHttpAdapter, ETagAwareHttpAdapter and HttpResult for bounded JSON calls such as OIDC discovery, JWKS, PAR, token exchange and revocation; and there is no gateway response cache.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .col-header { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .item-bold  { font-size: 12px; font-weight: 700; fill: #6e7681; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      .item       { font-size: 12px; fill: #6e7681; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      .sub        { font-size: 11px; fill: #6e7681; font-style: italic; }
      .col-sub    { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .gut        { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .caption    { font-size: 12px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .arrow      { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .arrow-fill { fill: #6e7681; }
      .sep        { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; fill: none; }
    </style>
  </defs>

  <text x="184" y="32" class="col-header">Data Plane</text>
  <rect class="stroke" x="24" y="48" width="320" height="326" rx="6"/>
  <text x="44" y="80" class="item-bold">Vert.x HttpClient</text>
  <text x="56" y="102" class="sub">bodies piped as streams, backpressure</text>
  <text x="56" y="120" class="sub">trailers, WebSocket, upstream HTTP/2</text>
  <line class="sep" x1="44" y1="132" x2="324" y2="132"/>
  <text x="44" y="156" class="item-bold">One pool per UpstreamTarget</text>
  <text x="56" y="178" class="sub">scheme + host + port + forced h2,</text>
  <text x="56" y="196" class="sub">shared egress TLS trust options</text>
  <line class="sep" x1="44" y1="208" x2="324" y2="208"/>
  <text x="44" y="232" class="item-bold">Abortive close (SO_LINGER 0)</text>
  <text x="56" y="254" class="sub">every client not forced to h2: RST,</text>
  <text x="56" y="272" class="sub">no TIME_WAIT; gRPC client resets stream</text>
  <line class="sep" x1="44" y1="284" x2="324" y2="284"/>
  <text x="56" y="308" class="sub">max_body_bytes: streaming byte counter</text>

  <text x="568" y="32" class="col-header">Resilience Guard (SmallRye FT)</text>
  <rect class="stroke" x="392" y="48" width="352" height="326" rx="6"/>
  <text x="412" y="80" class="item-bold">Built at boot per target + retry</text>
  <text x="424" y="102" class="sub">programmatic; no CDI interception</text>
  <line class="sep" x1="412" y1="114" x2="724" y2="114"/>
  <text x="412" y="138" class="item-bold">Retry (route retry.enabled)</text>
  <text x="424" y="160" class="sub">max 2 retries, 100 ms; idempotent method,</text>
  <text x="424" y="178" class="sub">only if zero body bytes sent upstream</text>
  <line class="sep" x1="412" y1="190" x2="724" y2="190"/>
  <text x="412" y="214" class="item-bold">Circuit breaker (fixed, ADR-0064)</text>
  <text x="424" y="236" class="sub">last 20 calls · open at 50% · 5 s open</text>
  <text x="424" y="254" class="sub">closes after 2 successful trial calls</text>
  <line class="sep" x1="412" y1="266" x2="724" y2="266"/>
  <text x="412" y="290" class="item-bold">Timeout: fixed 30 s to response head</text>
  <line class="sep" x1="412" y1="306" x2="724" y2="306"/>
  <text x="424" y="330" class="sub">client-ended dispatches: not failures,</text>
  <text x="424" y="348" class="sub">never retried</text>

  <text x="904" y="32" class="col-header">Control Plane</text>
  <rect class="stroke" x="792" y="48" width="224" height="326" rx="6"/>
  <text x="812" y="80" class="item-bold">cui-http</text>
  <text x="824" y="102" class="sub">HttpHandler</text>
  <text x="824" y="120" class="sub">ResilientHttpAdapter</text>
  <text x="824" y="138" class="sub">ETagAwareHttpAdapter</text>
  <text x="824" y="156" class="sub">HttpResult&lt;T&gt;</text>
  <line class="sep" x1="812" y1="168" x2="996" y2="168"/>
  <text x="824" y="192" class="sub">bounded JSON: discovery,</text>
  <text x="824" y="210" class="sub">JWKS, PAR, token, revoke</text>
  <line class="sep" x1="812" y1="222" x2="996" y2="222"/>
  <text x="812" y="246" class="item-bold">No response cache</text>
  <text x="824" y="268" class="sub">no cross-user leaks</text>

  <line class="arrow" x1="348" y1="211" x2="388" y2="211" marker-end="url(#arrow)"/>
  <line class="arrow" x1="748" y1="211" x2="788" y2="211" marker-end="url(#arrow)"/>
</svg>
