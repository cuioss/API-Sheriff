<?xml version="1.0" encoding="UTF-8"?>
<!--
  Boot-time configuration flow: three static input tracks converge through
  ConfigLoader, fail-fast ConfigValidator, and RouteAssembler into the
  immutable runtime state.
  theme-handling: A (theme-neutral)
  see  pm-documents:ref-svg-diagrams/standards/diagram-type-flow.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Boot-time configuration assembly flow from static input layers to immutable runtime state</title>
  <desc id="desc">A multi-track flow diagram. Three input tracks on the left — gateway.yaml (global defaults, anchors, OIDC, TLS), endpoints/*.yaml (portable route descriptors with abstract base_url aliases), and topology.properties (concrete URL bindings with environment variable expansion) — converge into ConfigLoader and PolicyBlockResolver. The resolved configuration passes through ConfigValidator, which aborts startup with CONFIG_INVALID or AUTH_WEAKENED on any violation, and then through RouteTableBuilder and RouteAssembler to freeze the immutable runtime state (GatewayConfig, sorted RouteTable, deduplicated UpstreamClients and Guards, BffRuntime, and PortalCatalog).</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .stage      { font-size: 13px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .mono       { font-size: 11px; fill: #6e7681; text-anchor: middle; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      .sub        { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .caption    { font-size: 12px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .track      { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .arrow-fill { fill: #6e7681; }
    </style>
  </defs>

  <!-- Input Track 1: gateway.yaml -->
  <rect class="stroke" x="24" y="32" width="208" height="56" rx="6"/>
  <text x="128" y="54" class="stage">gateway.yaml</text>
  <text x="128" y="74" class="sub">defaults · anchors · oidc · tls</text>
  <path class="track" d="M 232 60 Q 264 60 264 104 L 264 144"/>

  <!-- Input Track 2: endpoints/*.yaml -->
  <rect class="stroke" x="24" y="120" width="208" height="56" rx="6"/>
  <text x="128" y="142" class="stage">endpoints/*.yaml</text>
  <text x="128" y="162" class="sub">routes · abstract base_url alias</text>
  <line class="track" x1="232" y1="148" x2="260" y2="148"/>

  <!-- Input Track 3: topology.properties -->
  <rect class="stroke" x="24" y="208" width="208" height="56" rx="6"/>
  <text x="128" y="230" class="stage">topology.properties</text>
  <text x="128" y="250" class="sub">alias → URL · ${ENV:-default}</text>
  <path class="track" d="M 232 236 Q 264 236 264 192 L 264 152"/>

  <!-- Convergence junction -->
  <circle cx="264" cy="148" r="4" class="stroke"/>
  <line class="track" x1="268" y1="148" x2="296" y2="148" marker-end="url(#arrow)"/>

  <!-- Stage 1: ConfigLoader + PolicyBlockResolver -->
  <rect class="stroke" x="300" y="108" width="176" height="80" rx="6"/>
  <text x="388" y="96"  class="stage">1 · Load &amp; Resolve</text>
  <text x="388" y="132" class="mono">ConfigLoader</text>
  <text x="388" y="150" class="mono">PolicyBlockResolver</text>
  <text x="388" y="170" class="sub">route → anchor → global</text>

  <line class="track" x1="476" y1="148" x2="508" y2="148" marker-end="url(#arrow)"/>

  <!-- Stage 2: ConfigValidator -->
  <rect class="stroke" x="512" y="108" width="176" height="80" rx="6"/>
  <text x="600" y="96"  class="stage">2 · Validate (Fail-Fast)</text>
  <text x="600" y="132" class="mono">ConfigValidator</text>
  <text x="600" y="150" class="sub">collisions · SSRF · TLS</text>
  <text x="600" y="168" class="sub">scope closure · profiles</text>

  <!-- Fail-fast abort branch -->
  <circle cx="600" cy="188" r="4" class="stroke"/>
  <line class="track" x1="600" y1="192" x2="600" y2="236" marker-end="url(#arrow)"/>
  <text x="652" y="216" class="sub">any violation</text>
  <rect class="stroke" x="488" y="240" width="224" height="56" rx="6"/>
  <text x="600" y="262" class="stage">Startup Aborted</text>
  <text x="600" y="282" class="mono">CONFIG_INVALID · AUTH_WEAKENED</text>

  <line class="track" x1="688" y1="148" x2="720" y2="148" marker-end="url(#arrow)"/>

  <!-- Stage 3: RouteTableBuilder + RouteAssembler -->
  <rect class="stroke" x="724" y="108" width="168" height="80" rx="6"/>
  <text x="808" y="96"  class="stage">3 · Build &amp; Assemble</text>
  <text x="808" y="132" class="mono">RouteTableBuilder</text>
  <text x="808" y="150" class="mono">RouteAssembler</text>
  <text x="808" y="170" class="sub">dedup clients &amp; postures</text>

  <line class="track" x1="892" y1="148" x2="924" y2="148" marker-end="url(#arrow)"/>

  <!-- Stage 4: Immutable Runtime State -->
  <rect class="stroke" x="928" y="96" width="152" height="104" rx="6"/>
  <text x="1004" y="84"  class="stage">4 · Frozen Runtime</text>
  <text x="1004" y="120" class="mono">GatewayConfig</text>
  <text x="1004" y="138" class="mono">RouteTable</text>
  <text x="1004" y="156" class="mono">UpstreamClients</text>
  <text x="1004" y="174" class="mono">BffRuntime</text>
  <text x="1004" y="192" class="sub">shared immutably</text>

  <!-- Footer caption -->
  <text x="550" y="336" class="caption">No dynamic reload or partial route table: traffic is served only after all static layers merge, validate, and assemble at boot.</text>
</svg>
