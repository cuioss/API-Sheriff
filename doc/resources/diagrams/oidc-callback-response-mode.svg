<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sequence comparison of OIDC callback delivery: why response_mode=form_post drops
  the SameSite=Lax binding cookie on cross-site POST while response_mode=query preserves it
  on a top-level GET navigation, bounded by PKCE S256, single-use codes, and state verification.
  theme-handling: A (theme-neutral)
  see  pm-documents:ref-svg-diagrams/standards/diagram-type-sequence.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 510"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">OIDC callback sequence: form_post cross-site POST failure vs response_mode=query top-level GET</title>
  <desc id="desc">A three-actor sequence diagram comparing OIDC callback delivery across Browser (User-Agent), API Sheriff (/bff/callback), and Identity Provider (IdP). In the top section (form_post, overridden engine default), the IdP returns an auto-submitted HTML form that triggers a cross-site POST to /bff/callback; the browser withholds the SameSite=Lax __Host-sheriff-binding cookie on cross-site POSTs, so every login fails with 403. In the bottom section (response_mode=query, selected by QueryResponseModeAuthorizationRequestBuilder on login, widening, and step-up), the IdP returns 302 Found to /bff/callback?code&amp;state; the browser performs a top-level GET navigation with no body and includes the SameSite=Lax __Host-sheriff-binding cookie, API Sheriff verifies the binding cookie and constant-time state (excluding CALLBACK from ReservedBodyReader), redeems the single-use code at the IdP token endpoint with the mandatory PKCE S256 verifier, and sets the session cookie.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .actor      { font-size: 13px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .section    { font-size: 12px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .msg-c      { font-size: 11px; fill: #6e7681; text-anchor: middle; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      .note       { font-size: 11px; fill: #6e7681; font-style: italic; text-anchor: middle; }
      .caption    { font-size: 12px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .lifeline   { stroke: #6e7681; stroke-width: 1.0; stroke-dasharray: 4 4; fill: none; }
      .call       { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .ret        { stroke: #6e7681; stroke-width: 1.3; stroke-dasharray: 5 3; fill: none; }
      .sep        { stroke: #6e7681; stroke-width: 0.8; stroke-dasharray: 4 4; fill: none; }
      .arrow-fill { fill: #6e7681; }
    </style>
  </defs>

  <!-- Actor 1: Browser -->
  <rect class="stroke" x="40" y="20" width="200" height="44" rx="6"/>
  <text x="140" y="40" class="actor">Browser (User-Agent)</text>
  <text x="140" y="56" class="note">__Host-sheriff-binding (Lax)</text>
  <line class="lifeline" x1="140" y1="64" x2="140" y2="462"/>

  <!-- Actor 2: API Sheriff -->
  <rect class="stroke" x="412" y="20" width="236" height="44" rx="6"/>
  <text x="530" y="40" class="actor">API Sheriff (/bff/callback)</text>
  <text x="530" y="56" class="note">PKCE verifier · PendingAuthStore</text>
  <line class="lifeline" x1="530" y1="64" x2="530" y2="462"/>

  <!-- Actor 3: Identity Provider -->
  <rect class="stroke" x="808" y="20" width="208" height="44" rx="6"/>
  <text x="912" y="40" class="actor">Identity Provider (IdP)</text>
  <text x="912" y="56" class="note">PAR · /authorize · /token</text>
  <line class="lifeline" x1="912" y1="64" x2="912" y2="462"/>

  <!-- ============================================================ -->
  <!-- TOP SECTION: form_post (Overridden Default — Fails)          -->
  <!-- ============================================================ -->
  <text x="530" y="86" class="section">Overridden Engine Default: response_mode=form_post (Fails with SameSite=Lax)</text>

  <line class="ret" x1="912" y1="112" x2="144" y2="112" marker-end="url(#arrow)"/>
  <text x="526" y="104" class="msg-c">1 · 200 HTML auto-submitted &lt;form method="POST" action="/bff/callback"&gt;</text>

  <line class="call" x1="140" y1="144" x2="526" y2="144" marker-end="url(#arrow)"/>
  <text x="333" y="136" class="msg-c">2 · Cross-site POST (Lax binding cookie withheld)</text>

  <line class="ret" x1="530" y1="176" x2="144" y2="176" marker-end="url(#arrow)"/>
  <text x="333" y="168" class="msg-c">3 · 403 Forbidden (missing binding cookie)</text>

  <!-- ============================================================ -->
  <!-- BOTTOM SECTION: response_mode=query (Chosen — Succeeds)       -->
  <!-- ============================================================ -->
  <line class="sep" x1="40" y1="200" x2="1016" y2="200"/>
  <text x="530" y="220" class="section">Gateway Override: response_mode=query (Login · Session Widening · Step-Up)</text>

  <line class="ret" x1="912" y1="248" x2="144" y2="248" marker-end="url(#arrow)"/>
  <text x="526" y="240" class="msg-c">1 · 302 Found Location: /bff/callback?code=…&amp;state=…</text>

  <line class="call" x1="140" y1="282" x2="526" y2="282" marker-end="url(#arrow)"/>
  <text x="333" y="274" class="msg-c">2 · Top-level GET + Cookie: __Host-sheriff-binding</text>

  <!-- Verification box on API Sheriff -->
  <rect class="stroke" x="358" y="296" width="344" height="64" rx="4"/>
  <text x="530" y="316" class="msg-c">Verify binding cookie + constant-time state</text>
  <text x="530" y="334" class="note">mismatch → 403 · CALLBACK excluded from</text>
  <text x="530" y="350" class="note">ReservedBodyReader (stray POST → 400)</text>

  <line class="call" x1="530" y1="382" x2="908" y2="382" marker-end="url(#arrow)"/>
  <text x="720" y="374" class="msg-c">3 · POST /token (single-use code + PKCE S256 + DPoP)</text>

  <line class="ret" x1="912" y1="414" x2="534" y2="414" marker-end="url(#arrow)"/>
  <text x="720" y="406" class="msg-c">4 · DPoP-bound tokens (cnf.jkt verified)</text>

  <line class="ret" x1="530" y1="444" x2="144" y2="444" marker-end="url(#arrow)"/>
  <text x="333" y="436" class="msg-c">5 · 302 Found + Set-Cookie session</text>

  <!-- Footer caption -->
  <text x="530" y="490" class="caption">SameSite=None on __Host-sheriff-binding was rejected; URL code exposure is bounded by mandatory PKCE (S256), single-use codes, and binding + state check.</text>
</svg>
