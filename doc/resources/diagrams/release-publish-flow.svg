<?xml version="1.0" encoding="UTF-8"?>
<!--
  Release publish flow — two independent tracks: the release lane (one release run, entered by a
  guarded version-bump merge or a deliberate dispatch, splitting after the Maven release into one
  leg per architecture, each building, testing, scanning, pushing and smoking its own image, then
  converging on one join that assembles the index, writes the release tags and signs) and the
  pull-request lane (an independent, non-gating early signal).
  The two tracks deliberately never converge.
  theme-handling: A (theme-neutral)
  see  pm-documents:ref-svg-diagrams/standards/diagram-type-flow.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1270 570"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">API Sheriff release publish flow</title>
  <desc id="desc">Two independent tracks. The release lane is entered by either of two triggers — merging a version change that the centrally-owned version-changed guard admits, or a deliberate workflow_dispatch. From there the Maven release is cut, and the lane splits into two legs, one per architecture: linux/amd64 on an amd64 runner and linux/arm64 on an arm64 runner. Each leg checks out the release tag and asserts the version, then runs the integration-test suite, whose docker compose build is that leg's one and only image build, so what the leg publishes is by construction exactly what it tested. A Syft SBOM and a gating Trivy scan at HIGH and CRITICAL then run before the leg writes to the registry. The leg pushes its image under a leg-local tag only, and pulls the digest back on its own architecture to assert it is identical to the tested image. The two legs converge on one join, reached only when both are green: it assembles one image index from exactly the two tested digests, writes the two release tags onto it, asserts that the index lists exactly linux/amd64 and linux/arm64, and signs and verifies the index digest and both platform digests keylessly with Cosign. A failed leg leaves the join skipped, so no release tag is written. On the pull-request lane, an independent non-gating scan of the pinned base image and the repository filesystem reports on every change without ever building an image or failing the check. The two lanes never converge.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .lane       { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: start; }
      .leg        { font-size: 13px; font-weight: 600; fill: #6e7681; text-anchor: start; }
      .legsub     { font-size: 11px; font-weight: 400; font-style: italic; }
      .stage      { font-size: 13px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .sub        { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .note       { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .junction   { font-size: 11px; fill: #6e7681; text-anchor: start; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .track      { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .arrow-fill { fill: #6e7681; }
      .dash       { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; fill: none; }
      .caption    { font-size: 12px; fill: #6e7681; text-anchor: middle; font-style: italic; }
    </style>
  </defs>

  <!-- ============================ release lane ============================ -->
  <text x="635" y="24" class="note">Two entry paths &#8212; a version-bump merge the central guard admits, or a deliberate dispatch</text>
  <text x="20" y="54" class="lane">Release lane</text>

  <!-- trunk: trigger and Maven release, then the split into one leg per architecture -->
  <circle cx="20" cy="216" r="4" class="stroke"/>
  <line class="track" x1="20" y1="216" x2="296" y2="216"/>
  <circle cx="296" cy="216" r="4" class="stroke"/>
  <path class="track" d="M296,212 Q296,136 340,136"/>
  <path class="track" d="M296,220 Q296,296 340,296"/>

  <!-- leg tracks (each passes through every stage of its leg) -->
  <line class="track" x1="340" y1="136" x2="890" y2="136"/>
  <line class="track" x1="340" y1="296" x2="890" y2="296"/>

  <!-- convergence on the join, then the join track to the single terminal arrowhead -->
  <path class="track" d="M890,136 Q934,136 934,212"/>
  <path class="track" d="M890,296 Q934,296 934,220"/>
  <circle cx="934" cy="216" r="4" class="stroke"/>
  <line class="track" x1="938" y1="216" x2="1250" y2="216" marker-end="url(#arrow)"/>
  <text x="946" y="206" class="junction">join</text>

  <!-- trunk stages -->
  <rect class="stroke" x="30"  y="186" width="110" height="60" rx="6"/>
  <rect class="stroke" x="166" y="178" width="110" height="76" rx="6"/>
  <text x="85"  y="168" class="stage">Trigger</text>
  <text x="221" y="168" class="stage">Maven release</text>
  <text x="85"  y="272" class="sub">guarded merge<tspan x="85" dy="13">or dispatch</tspan></text>
  <text x="221" y="272" class="sub">pushes the release tag</text>

  <!-- leg headers -->
  <text x="356" y="64" class="leg">linux/amd64 leg <tspan class="legsub">&#8212; on an amd64 runner</tspan></text>
  <text x="356" y="224" class="leg">linux/arm64 leg <tspan class="legsub">&#8212; on an arm64 runner</tspan></text>

  <!-- linux/amd64 leg stages -->
  <rect class="stroke" x="356" y="106" width="110" height="60" rx="6"/>
  <rect class="stroke" x="492" y="98"  width="110" height="76" rx="6"/>
  <path class="stroke" d="M628,136 L683,98 L738,136 L683,174 Z"/>
  <rect class="stroke" x="764" y="106" width="110" height="60" rx="6"/>
  <text x="411" y="88" class="stage">Check out tag</text>
  <text x="547" y="88" class="stage">IT suite</text>
  <text x="683" y="88" class="stage">SBOM + scan</text>
  <text x="819" y="88" class="stage">Push + smoke</text>
  <text x="411" y="192" class="sub">assert version match</text>
  <text x="547" y="192" class="sub">the leg's one image build</text>
  <text x="683" y="192" class="sub">gate: HIGH + CRITICAL</text>
  <text x="819" y="192" class="sub">leg tag only<tspan x="819" dy="13">pulled ID = tested ID</tspan></text>

  <!-- linux/arm64 leg stages -->
  <rect class="stroke" x="356" y="266" width="110" height="60" rx="6"/>
  <rect class="stroke" x="492" y="258" width="110" height="76" rx="6"/>
  <path class="stroke" d="M628,296 L683,258 L738,296 L683,334 Z"/>
  <rect class="stroke" x="764" y="266" width="110" height="60" rx="6"/>
  <text x="411" y="248" class="stage">Check out tag</text>
  <text x="547" y="248" class="stage">IT suite</text>
  <text x="683" y="248" class="stage">SBOM + scan</text>
  <text x="819" y="248" class="stage">Push + smoke</text>
  <text x="411" y="352" class="sub">assert version match</text>
  <text x="547" y="352" class="sub">the leg's one image build</text>
  <text x="683" y="352" class="sub">gate: HIGH + CRITICAL</text>
  <text x="819" y="352" class="sub">leg tag only<tspan x="819" dy="13">pulled ID = tested ID</tspan></text>

  <!-- join stages -->
  <rect class="stroke" x="980"  y="186" width="110" height="60" rx="6"/>
  <rect class="stroke" x="1116" y="186" width="110" height="60" rx="6"/>
  <text x="1035" y="168" class="stage">Assemble index</text>
  <text x="1171" y="168" class="stage">Cosign sign</text>
  <text x="1035" y="272" class="sub">two release tags<tspan x="1035" dy="13">exactly amd64 + arm64</tspan></text>
  <text x="1171" y="272" class="sub">index + both platforms<tspan x="1171" dy="13">keyless, verified</tspan></text>

  <!-- ======================= lane separator (never converge) ======================= -->
  <line class="dash" x1="20" y1="384" x2="1250" y2="384"/>

  <!-- ============================ pull-request lane ============================ -->
  <text x="20" y="408" class="lane">Pull-request lane</text>

  <circle cx="20" cy="484" r="4" class="stroke"/>
  <line class="track" x1="20" y1="484" x2="1000" y2="484" marker-end="url(#arrow)"/>

  <rect class="stroke" x="30"  y="456" width="110" height="56" rx="6"/>
  <rect class="stroke" x="302" y="456" width="110" height="56" rx="6"/>
  <rect class="stroke" x="574" y="456" width="110" height="56" rx="6"/>
  <rect class="stroke" x="846" y="456" width="110" height="56" rx="6"/>

  <text x="85"  y="440" class="stage">Every change</text>
  <text x="357" y="440" class="stage">Base image scan</text>
  <text x="629" y="440" class="stage">Filesystem scan</text>
  <text x="901" y="440" class="stage">Report only</text>

  <text x="85"  y="530" class="sub">no image build</text>
  <text x="357" y="530" class="sub">pinned digest, read from the Dockerfile</text>
  <text x="629" y="530" class="sub">where Java dependency CVEs surface</text>
  <text x="901" y="530" class="sub">exit-code 0 &#8212; never fails the check</text>

  <!-- footer caption: the load-bearing idea -->
  <text x="635" y="558" class="caption">Each leg publishes only what it tested; only the join, reached when both legs are green, writes a release tag. The pull-request track is an independent early signal. The two never converge.</text>
</svg>
