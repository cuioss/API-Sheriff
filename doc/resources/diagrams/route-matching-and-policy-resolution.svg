<?xml version="1.0" encoding="UTF-8"?>
<!--
  Route table matching order, verb gate, nearest-scope policy resolution and terminal action fan-out.
  theme-handling: A (theme-neutral)
  see  pm-documents:ref-svg-diagrams/standards/diagram-type-flow.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 364"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Route matching flow, verb gate, nearest-scope policy resolution and terminal action fan-out</title>
  <desc id="desc">A left-to-right decision flow diagram. An inbound request with canonical path, Host, method and headers enters the static route table (populated from enabled endpoints only). Step 1 evaluates exact match.path candidates first (un-normalized, trailing slash significant, ANDed with method, host and header matchers); on a miss, Step 2 evaluates path-prefix candidates longest-first on a segment boundary. If no candidate matches, the request exits downward to 404 NO_ROUTE_MATCHED (deny-by-default). A matched route carries its boot-resolved PolicyBlock descriptors (nearest declared scope in route, endpoint, anchor, gateway wins with whole-block replacement) and enters Stage 2b VerbGateStage (allowed_methods); a disallowed method exits downward to 405 METHOD_NOT_ALLOWED + Allow (rendered as uniform 404 when uniform_not_found is on). Permitted requests proceed to one of three terminal actions: upstream proxy (base_url required), asset (directory or upstream), or redirect (301/302/307/308).</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .stage      { font-size: 13px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .mono       { font-size: 11px; fill: #6e7681; text-anchor: middle; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      .sub        { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .caption    { font-size: 12px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .track      { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .dash       { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; fill: none; }
      .arrow-fill { fill: #6e7681; }
    </style>
  </defs>

  <!-- Step 0: Inbound Request -->
  <rect class="stroke" x="20" y="96" width="168" height="100" rx="6"/>
  <text x="104" y="120" class="stage">Inbound Request</text>
  <text x="104" y="140" class="mono">canonical path · Host</text>
  <text x="104" y="158" class="mono">method · headers</text>
  <text x="104" y="178" class="sub">enabled endpoints only</text>

  <line class="track" x1="188" y1="146" x2="224" y2="146" marker-end="url(#arrow)"/>

  <!-- Step 1: Exact Match Candidates -->
  <rect class="stroke" x="228" y="80" width="192" height="132" rx="6"/>
  <text x="324" y="102" class="stage">1 · Exact Match First</text>
  <text x="324" y="122" class="mono">exact match.path</text>
  <text x="324" y="140" class="sub">un-normalized; trailing '/'</text>
  <text x="324" y="156" class="sub">is significant</text>
  <line class="dash" x1="244" y1="168" x2="404" y2="168"/>
  <text x="324" y="186" class="mono">AND method · host · header</text>
  <text x="324" y="202" class="sub">first candidate wins</text>

  <!-- Exact match hit bypasses prefix step along top track -->
  <path class="track" d="M 324 80 L 324 44 L 680 44 L 680 126 L 700 126" marker-end="url(#arrow)"/>
  <text x="502" y="34" class="mono">exact match hit</text>

  <!-- Miss -> Step 2 Prefix Match -->
  <line class="track" x1="420" y1="146" x2="464" y2="146" marker-end="url(#arrow)"/>
  <text x="442" y="136" class="sub">miss</text>

  <!-- Step 2: Prefix Match Candidates -->
  <rect class="stroke" x="468" y="80" width="192" height="132" rx="6"/>
  <text x="564" y="102" class="stage">2 · Prefix Match Next</text>
  <text x="564" y="122" class="mono">longest prefix first</text>
  <text x="564" y="140" class="sub">segment-boundary match</text>
  <text x="564" y="156" class="sub">after all exact routes</text>
  <line class="dash" x1="484" y1="168" x2="644" y2="168"/>
  <text x="564" y="186" class="mono">AND method · host · header</text>
  <text x="564" y="202" class="sub">first candidate wins</text>

  <!-- Prefix hit -> Stage 2a & 2b -->
  <line class="track" x1="660" y1="146" x2="700" y2="146" marker-end="url(#arrow)"/>
  <text x="680" y="164" class="sub">hit</text>

  <!-- Prefix miss -> 404 NO_ROUTE_MATCHED -->
  <line class="track" x1="564" y1="212" x2="564" y2="256" marker-end="url(#arrow)"/>
  <text x="598" y="238" class="sub">no match</text>
  <rect class="stroke" x="456" y="260" width="216" height="64" rx="6"/>
  <text x="564" y="284" class="stage">404 NO_ROUTE_MATCHED</text>
  <text x="564" y="304" class="sub">deny-by-default · disabled endpoints</text>
  <text x="564" y="318" class="sub">also fall through here</text>

  <!-- Step 3: Stage 2a Policy Resolution + Stage 2b Verb Gate -->
  <rect class="stroke" x="704" y="72" width="216" height="148" rx="6"/>
  <text x="812" y="94"  class="stage">Stage 2a &amp; 2b · Route &amp; Verb</text>
  <text x="812" y="114" class="mono">PolicyBlock (boot-resolved):</text>
  <text x="812" y="132" class="mono">route → endpoint → anchor → gw</text>
  <text x="812" y="148" class="sub">nearest scope replaces wholesale</text>
  <line class="dash" x1="720" y1="160" x2="904" y2="160"/>
  <text x="812" y="180" class="mono">VerbGateStage: allowed_methods</text>
  <text x="812" y="198" class="sub">nearest scope replaces broader</text>
  <text x="812" y="212" class="sub">Stage 2a swaps route sec-headers</text>

  <!-- Verb gate reject -> 405 -->
  <line class="track" x1="812" y1="220" x2="812" y2="256" marker-end="url(#arrow)"/>
  <text x="858" y="240" class="sub">disallowed verb</text>
  <rect class="stroke" x="700" y="260" width="224" height="64" rx="6"/>
  <text x="812" y="284" class="stage">405 METHOD_NOT_ALLOWED</text>
  <text x="812" y="304" class="mono">+ Allow header</text>
  <text x="812" y="318" class="sub">rendered as 404 when uniform on</text>

  <!-- Fan-out to 3 Terminal Actions -->
  <line class="track" x1="920" y1="146" x2="946" y2="146"/>
  <circle cx="950" cy="146" r="4" class="stroke"/>
  <path class="track" d="M 950 142 L 950 76 L 976 76" marker-end="url(#arrow)"/>
  <line class="track" x1="954" y1="146" x2="976" y2="146" marker-end="url(#arrow)"/>
  <path class="track" d="M 950 150 L 950 216 L 976 216" marker-end="url(#arrow)"/>

  <text x="1060" y="34" class="stage">Terminal Action (Stage 6)</text>

  <rect class="stroke" x="980" y="48" width="160" height="56" rx="6"/>
  <text x="1060" y="72" class="stage">upstream (proxy)</text>
  <text x="1060" y="92" class="sub">base_url required</text>

  <rect class="stroke" x="980" y="118" width="160" height="56" rx="6"/>
  <text x="1060" y="142" class="stage">asset</text>
  <text x="1060" y="162" class="sub">directory | upstream</text>

  <rect class="stroke" x="980" y="188" width="160" height="56" rx="6"/>
  <text x="1060" y="212" class="stage">redirect</text>
  <text x="1060" y="232" class="sub">301 · 302 · 307 · 308</text>

  <!-- Footer caption -->
  <text x="580" y="348" class="caption">RouteTableBuilder and ConfigValidator share the PolicyBlock descriptors and the proxy base_url predicate at boot; the pipeline reads materialized state.</text>
</svg>
