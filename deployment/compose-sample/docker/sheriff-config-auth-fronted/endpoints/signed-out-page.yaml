# yaml-language-server: $schema=../../../../../api-sheriff/src/main/resources/schema/endpoint.schema.json
# The public page a browser lands on after it signed out through the BFF — /auth-fronted variant.
#
# A verbatim copy of docker/sheriff-config/endpoints/signed-out-page.yaml, kept here so this variant's
# configuration set is self-contained and validates on its own. Change both copies together.
#
# gateway.yaml's oidc.logout.final_redirect names /pages/signed-out.html: after the gateway ended the
# session and the IdP ended its own, the browser is sent here. It must be a PUBLIC page — sending a
# signed-out browser back into the session-protected /app would only start a new login.
#
# Served by the gateway itself from a directory, so the demo upstream stays a canned JSON responder
# and nothing new runs in the stack. The directory lies inside the read-only configuration mount
# (./docker/sheriff-config-auth-fronted -> /app/sheriff-config in docker-compose.auth-fronted.yml), so
# no further volume is needed. The gateway confines every request path under that root and sets the
# content type from the file extension.
endpoint:
  id: signed-out-page
  enabled: true
  # No base_url: every route here is an asset route that never proxies anywhere.
  anchor: pages
  # The `pages` anchor is access: public, so it carries no auth block and the endpoint declares the
  # posture itself.
  auth:
    require: none
  routes:
    - id: signed-out-page
      match:
        path_prefix: /pages
      asset:
        source: directory
        directory: /app/sheriff-config/pages
