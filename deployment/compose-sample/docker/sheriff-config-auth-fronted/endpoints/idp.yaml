# yaml-language-server: $schema=../../../../../api-sheriff/src/main/resources/schema/endpoint.schema.json
# The identity provider, fronted by the gateway under /auth — the endpoint this variant adds.
#
# AN ALLOWLIST OF THE LOGIN FLOW, NEVER A CATCH-ALL. Each route below names one path namespace the
# browser's login and logout need, and nothing else is routed:
#
#   /auth/realms/sample/protocol/openid-connect/auth     the authorization endpoint the BFF redirects to
#   /auth/realms/sample/login-actions                    the login form and its credential POST
#   /auth/realms/sample/protocol/openid-connect/logout   the end-session endpoint and its confirmation
#   /auth/resources                                      the login theme's static files
#
# There is deliberately no route for /auth itself, nor for the realm as a whole. A request for any
# other path under /auth answers the gateway's unrouted 404 and Keycloak never sees it: the admin
# console (/auth/admin/), the master realm (/auth/realms/master/), Keycloak's metrics and health
# paths, the server-level well-known namespace (/auth/.well-known/...), and — inside the sample realm
# itself — the account console (/auth/realms/sample/account), the token endpoint
# (.../protocol/openid-connect/token), the realm's discovery document
# (/auth/realms/sample/.well-known/openid-configuration) and its RFC 8414 metadata. None of those is
# a browser page of the login flow. The gateway's own discovery, token, refresh and revocation calls
# travel the back channel (oidc.back_channel_origin in gateway.yaml) and the JWKS URL names the
# internal keycloak:8443 address, so neither needs a front-side route, and the sample's browser
# client performs no OIDC or RFC 8414 discovery of its own. That holds by construction: no rule has
# to recognise a dangerous path, because a path nobody listed has no way in.
#
# Every request is canonicalised BEFORE route selection. A dot-segment, an encoded separator, a
# doubled slash or a backslash — /auth/realms/sample/login-actions/../../../admin/,
# /auth/realms/sample/login-actions/../account, /auth/%2e%2e/admin/ — is refused by the gateway's
# canonical-path guard or reduced to the path it really names before any route is chosen, so a
# relative spelling cannot ride a login route to the admin console or the account console.
# IdpFrontingCanonicalPathTest proves that against this file, and check-bff-login.sh
# --idp-prefix /auth against the running sample.
#
# THE PATH IS KEPT. Each route's upstream.path repeats its match key, so the request path reaches
# Keycloak unchanged: /auth/realms/sample/login-actions/... is forwarded to
# https://keycloak:8443/auth/realms/sample/login-actions/.... Keycloak serves under /auth
# (KC_HTTP_RELATIVE_PATH in docker-compose.auth-fronted.yml), so neither side rewrites a path and no
# Location header needs mapping back: every URL Keycloak emits already names https://localhost:8443/auth.
endpoint:
  id: idp
  enabled: true
  # Resolved through topology.properties to https://keycloak:8443. Never a literal address here.
  base_url: IDP
  anchor: auth
  # The `auth` anchor is access: public, so the endpoint declares the posture itself: the login flow is
  # necessarily unauthenticated. Every route inherits it.
  auth:
    require: none
  routes:
    # The authorization endpoint of the ONE realm the BFF signs users in to: the browser arrives here
    # from the gateway's pushed-authorization redirect, carrying only client_id and request_uri. The
    # prefix matches whole segments, so .../openid-connect/token beside it stays unrouted.
    #
    # The three login routes carry the same cookie block. Keycloak's login cookies, BY EXACT NAME — a
    # route without the block forwards no browser cookie and relays no upstream Set-Cookie line (the
    # omitted-block default is `allow: none`), and Keycloak could not hold the login session from the
    # authorization request through the form POST to the logout. The gateway's own cookies never cross
    # under any block, so the BFF's __Host-sample-session stays at the gateway whatever this list says.
    #
    # A list rather than `all`, so a cookie the browser holds for another application on this origin
    # never reaches the identity provider.
    #
    # The block decides WHICH cookies cross, not how long the Cookie header may be. The length is
    # checked before any route is selected, so it cannot be set here: gateway.yaml raises it for the
    # Cookie header alone (oidc.session.max_cookie_header_value_length), because the browser sends
    # these cookies together in one header, KC_RESTART beside Keycloak's session cookies, and that
    # header outgrows the strict header-value cap. The cap is measured against the whole header, the
    # gateway's own cookies included, not against the cookies this list lets cross.
    #
    # same_origin_check: a state-changing request that carries those cookies must come from this
    # gateway's own origin — which is where Keycloak's pages, served through these routes, post from. A
    # cross-site POST carrying a Keycloak cookie is refused before it reaches Keycloak. Stated although
    # `true` is the default, because these routes are where it matters.
    - id: idp-sample-authorization
      match:
        path_prefix: /auth/realms/sample/protocol/openid-connect/auth
      upstream:
        path: /auth/realms/sample/protocol/openid-connect/auth
      cookies:
        allow:
          - AUTH_SESSION_ID
          - KC_AUTH_SESSION_HASH
          - KC_RESTART
          - KEYCLOAK_IDENTITY
          - KEYCLOAK_SESSION
          - KEYCLOAK_LOCALE
          - KEYCLOAK_REMEMBER_ME
          - KC_STATE_CHECKER
        same_origin_check: true
    # The login form the authorization endpoint redirects into, and the credential POST it submits
    # (login-actions/authenticate), with the rest of Keycloak's login steps under the same namespace.
    - id: idp-sample-login-actions
      match:
        path_prefix: /auth/realms/sample/login-actions
      upstream:
        path: /auth/realms/sample/login-actions
      cookies:
        allow:
          - AUTH_SESSION_ID
          - KC_AUTH_SESSION_HASH
          - KC_RESTART
          - KEYCLOAK_IDENTITY
          - KEYCLOAK_SESSION
          - KEYCLOAK_LOCALE
          - KEYCLOAK_REMEMBER_ME
          - KC_STATE_CHECKER
        same_origin_check: true
    # The end-session endpoint the BFF's logout redirects the browser to, and the confirmation page
    # Keycloak may answer it with (its form posts to .../logout/logout-confirm, under this prefix).
    - id: idp-sample-logout
      match:
        path_prefix: /auth/realms/sample/protocol/openid-connect/logout
      upstream:
        path: /auth/realms/sample/protocol/openid-connect/logout
      cookies:
        allow:
          - AUTH_SESSION_ID
          - KC_AUTH_SESSION_HASH
          - KC_RESTART
          - KEYCLOAK_IDENTITY
          - KEYCLOAK_SESSION
          - KEYCLOAK_LOCALE
          - KEYCLOAK_REMEMBER_ME
          - KC_STATE_CHECKER
        same_origin_check: true
    # The login theme's static files (stylesheets, scripts, images) the login page references.
    - id: idp-resources
      match:
        path_prefix: /auth/resources
      upstream:
        path: /auth/resources
