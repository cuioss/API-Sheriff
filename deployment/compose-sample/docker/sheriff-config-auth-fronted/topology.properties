# Topology aliases for the /auth-fronted variant of the compose sample.
#
# An alias is the ONE place a backend address is written down. Endpoints reference the alias by name
# (endpoints/demo-api.yaml declares `base_url: UPSTREAM`, endpoints/idp.yaml `base_url: IDP`), so
# repointing the gateway at a different backend is a change here and nowhere else.
#
# The value uses the in-file placeholder form: only explicit ${VAR} / ${VAR:-default} placeholders
# written in this file are substituted. There is NO convention-named environment path — an
# environment variable binds if and only if this file names it, which is what keeps the set of
# externally-influenced values readable from the file itself.
#
# Both placeholders below are resolved against the GATEWAY CONTAINER's environment, so a variable
# reaches them only because docker-compose.yml (TOPOLOGY_UPSTREAM) and docker-compose.auth-fronted.yml
# (TOPOLOGY_IDP) forward it into the api-sheriff service. Unset on the host, each stays unset and the
# default here applies.
#
# UPSTREAM is the demo-api nginx responder, reached by the gateway on the internal compose network,
# exactly as in the base set (docker/sheriff-config/topology.properties). Override TOPOLOGY_UPSTREAM
# in the environment to aim the same route at a real backend without editing this file.
UPSTREAM=${TOPOLOGY_UPSTREAM:-http://demo-api:8080}
# IDP is Keycloak on the internal network: the address the `auth` anchor's routes proxy the browser's
# login requests to. It publishes no host port in this variant, so this address is the only way to it.
# The alias carries the origin only — Keycloak's /auth path is kept by each route's upstream.path.
#
# IT MUST EQUAL gateway.yaml's oidc.back_channel_origin (both https://keycloak:8443). The proxied /auth
# routes dial this alias; the gateway's own discovery, PAR, token and revocation calls dial the
# back-channel origin. Overriding TOPOLOGY_IDP alone would send the two to different places — change
# the back-channel origin with it.
IDP=${TOPOLOGY_IDP:-https://keycloak:8443}
