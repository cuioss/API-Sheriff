# yaml-language-server: $schema=../../../../api-sheriff/src/main/resources/schema/gateway.schema.json
# API Sheriff — global gateway document for the /auth-fronted variant of the compose sample.
#
# Mounted read-only at /app/sheriff-config by docker-compose.auth-fronted.yml, IN PLACE OF the base
# set in docker/sheriff-config. This set is self-contained: it validates and boots on its own, and the
# endpoints/, pages/ and topology.properties beside it are its own copies.
#
# It is the base document with four differences, each marked VARIANT below:
#
#   1. The IdP's identity moves to the gateway's origin plus the /auth prefix, so the issuer and the
#      JWKS address carry /auth.
#   2. A fourth anchor, `auth`, fronts Keycloak, and the method gate admits POST because Keycloak's
#      login form posts its credentials. The other three anchors keep GET and HEAD.
#   3. egress_tls names a trust profile for the proxied dial to Keycloak, which serves the sample's
#      self-signed certificate.
#   4. oidc.session raises the pre-route cap for Cookie header values alone, because Keycloak's own
#      login cookies now cross this gateway and outgrow the strict header-value cap.
#
# Everything else — the filter posture, the TLS policy, the BFF client — is the base document's, and
# the comments that explain it are kept so this file reads on its own.
version: 1
metadata:
  config_version: "compose-sample-auth-fronted"

# VARIANT. The methods this gateway will admit at all; anything outside this list is rejected before
# route selection. The base admits GET and HEAD only. POST joins here for exactly one reason: the
# identity provider's login form posts the credentials, and that request now reaches Keycloak through
# this gateway. The anchors below narrow the list back where POST has no business — api and app
# declare GET and HEAD for themselves, and pages already did — so POST is admitted under /auth alone.
allowed_methods: ["GET", "HEAD", "POST"]

# The gateway-wide inbound-filter baseline. Declared EXPLICITLY rather than left to the omitted-key
# default, so the posture is visible in the document an operator reads rather than inherited
# invisibly. `strict` is also the default — stating it is a statement of intent, not a change.
#
# strict caps a request at 1 MiB of body, 20 query parameters, 1024-character header values,
# parameter values and paths. Every route inherits it, the four anchors of this variant included. The
# one place this variant departs from it is the Cookie header alone, under oidc.session below; every
# other header, every parameter and every path stays at the strict cap.
security_defaults:
  profile: strict

# TLS POLICY for the terminated listener. The certificate and key themselves are NOT here — they are
# deployment-supplied through the environment (see docker-compose.yml) and this document stays free
# of key material and paths, so it is safe to commit and to copy between environments.
tls:
  # 1.2 is the floor, which enables TLS 1.2 and 1.3. Raise to "1.3" when every client can reach it.
  min_version: "1.2"
  cipher_suites:
    - TLS_AES_256_GCM_SHA384
    - TLS_AES_128_GCM_SHA256
    - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
    - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
  alpn: ["h2", "http/1.1"]

# WHOSE forwarding headers this gateway believes. Until a request's immediate TCP peer is inside this
# CIDR set, an inbound X-Forwarded-For is ignored and the peer's own address is what the upstream is
# told — so this list is the difference between a client that can state its own address and one that
# cannot. It is MANDATORY: declaring a `forwarded` block without it is refused at boot.
#
# The whole list arrives from ONE environment variable, comma-separated, because the trusted set is
# genuinely different in every environment while this document is meant to be copied unchanged
# (ADR-0032: the deployment supplies what it names). The BARE ${VAR} form is deliberate: an empty
# resolution fails the boot rather than starting with a trust set nobody chose. Write the value in
# docker-compose.yml, never here.
#
# This is the address the gateway tells Keycloak in X-Forwarded-For on the proxied /auth requests,
# which Keycloak believes because docker-compose.auth-fronted.yml trusts the gateway's static address.
forwarded:
  trusted_proxies: "${SHERIFF_TRUSTED_PROXIES}"

# Four namespaces. `type` + `access` are the two mandatory classification axes of every anchor.
anchors:
  # The public proxy namespace. A public anchor carries NO auth block — public IS the absence of auth,
  # so the require: none posture lives on the endpoint instead (endpoints/demo-api.yaml).
  #
  # VARIANT: the GET and HEAD the base admits gateway-wide are stated here, so the POST admitted for
  # the login form above does not reach the demo upstream.
  api:
    path_prefix: /api
    type: proxy
    access: public
    allowed_methods: ["GET", "HEAD"]
  # The BFF namespace: a browser that opens /app without a session is redirected to the IdP's login
  # page, and once signed in every request it sends here reaches the upstream carrying the access
  # token the gateway holds for that session — the browser itself only ever holds the session cookie.
  # type: bff forces access: authenticated, and the session floor is backed by the oidc block below
  # (a session floor with no oidc block is refused at boot). Every route under it inherits the floor
  # (endpoints/demo-app.yaml).
  #
  # VARIANT: narrowed back to GET and HEAD, for the same reason as `api`.
  app:
    path_prefix: /app
    type: bff
    access: authenticated
    allowed_methods: ["GET", "HEAD"]
    auth:
      require: session
  # The public page namespace, serving static files only — today the one page a signed-out browser
  # lands on (oidc.logout.final_redirect below, endpoints/signed-out-page.yaml). An asset anchor
  # serves nothing but GET and HEAD, so it says so.
  pages:
    path_prefix: /pages
    type: asset
    access: public
    allowed_methods: ["GET", "HEAD"]
  # VARIANT. The identity provider's namespace: the browser reaches Keycloak's login pages here, at
  # https://localhost:8443/auth/..., and Keycloak publishes no port of its own. Disjoint from the three
  # anchors above, as every anchor must be.
  #
  # Public, because the login flow is necessarily unauthenticated — the browser comes here precisely
  # because it has no session yet. What keeps the admin console and the master realm out is not this
  # anchor but the endpoint under it: endpoints/idp.yaml routes an ALLOWLIST of Keycloak's paths and
  # declares no catch-all, so every other path under /auth matches no route and answers the unrouted
  # 404 without Keycloak ever seeing the request.
  #
  # The method list is the gateway-wide one, restated so it is visible where it applies: GET and HEAD
  # for the pages, POST for the login form.
  auth:
    path_prefix: /auth
    type: proxy
    access: public
    allowed_methods: ["GET", "HEAD", "POST"]

# The issuers whose tokens this gateway will validate. The BFF needs this one: the tokens the realm
# mints for a browser session are validated against it, so the oidc block below and this issuer name
# the same identity.
token_validation:
  issuers:
    - name: sample-keycloak
      # VARIANT. The IdP's browser-facing identity is now https://localhost:8443/auth (KC_HOSTNAME in
      # docker-compose.auth-fronted.yml): the gateway's own origin plus the prefix the `auth` anchor
      # fronts Keycloak under. Every token this realm mints carries exactly this `iss` value. Any other
      # issuer value here would reject every token with a 401 that looks like a signature problem and
      # is not.
      issuer: https://localhost:8443/auth/realms/sample
      jwks:
        source: http
        # VARIANT. Still the internal address, never the gateway's own listener — the key set is
        # fetched from keycloak:8443 inside the bridge — and now under Keycloak's /auth path
        # (KC_HTTP_RELATIVE_PATH).
        url: https://keycloak:8443/auth/realms/sample/protocol/openid-connect/certs
        # The SSRF egress guard refuses a JWKS URL resolving to a private address, as `keycloak` does
        # here (a site-local bridge address), unless the host is allowed. Omitted, the host of url
        # above would be derived and allowed anyway; this list PINS it instead, so a later url edit to
        # another host fails closed rather than silently moving the exemption with it.
        allowed_egress_hosts: ["keycloak"]
        # WHICH trust anchors the JWKS fetch verifies Keycloak's certificate against. This sample's
        # Keycloak serves a SELF-SIGNED certificate (docker/certificates/generate-certificates.sh),
        # which no default trust store contains. This document names the LOGICAL profile only; the
        # deployment binds it (QUARKUS_CONFIG_LOCATIONS in docker-compose.yml points at
        # docker/certificates/sample-idp-trust.properties). A named profile REPLACES default trust for
        # this client rather than adding to it, so this line can only ever narrow what the fetch
        # accepts.
        tls_profile: sample-idp

# The BFF's OIDC client: the confidential client the gateway logs a browser in with, behind the
# require: session floor of the `app` anchor above. Server session mode, so the tokens stay in the
# gateway and the browser holds only an opaque session cookie.
#
# The client follows FAPI 2.0 rather than the simplest thing that works: there is no client_secret,
# so the gateway authenticates with a private_key_jwt assertion; every authorization request is
# pushed (PAR) and every access token is bound to the gateway's DPoP key. The realm's sample-client
# (docker/keycloak/sample-realm.json) requires all three.
oidc:
  # VARIANT. The IdP's ONE identity — the same value the token_validation issuer above carries. The
  # browser is redirected to the login page under it, which is this gateway's own /auth namespace.
  issuer: https://localhost:8443/auth/realms/sample
  # Where the gateway's own calls to the IdP go — discovery, the pushed authorization request, the
  # code exchange, refresh and revocation. UNCHANGED from the base, and more necessary here than
  # there: the issuer's origin is now this gateway's own, so without this mapping the gateway would
  # dial its own listener for discovery and go round through its own /auth route on every back-channel
  # call. The mapping swaps the origin and keeps the path, so
  # https://localhost:8443/auth/realms/sample/... is dialled as https://keycloak:8443/auth/realms/sample/...
  # — and every issuer check still compares against the identity above (ADR-0069). A bare https
  # origin: no path, no query, no user-info — the boot refuses anything else.
  back_channel_origin: https://keycloak:8443
  client_id: sample-client
  # NO client_secret, deliberately: its absence is what selects private_key_jwt. The assertion is
  # signed with the key below; Keycloak verifies it against the public half the gateway publishes at
  # /bff/jwks, which it fetches from the address the deployment names (SAMPLE_GATEWAY_JWKS_URL in
  # docker-compose.yml).
  #
  # Both key files are BARE placeholders: this document stays free of paths, and docker-compose.yml
  # supplies them. An unset variable fails the boot rather than starting a BFF with no key.
  client_authentication:
    key_file: "${SHERIFF_CLIENT_AUTH_KEY_FILE}"
  # The DPoP proof key every access token of this gateway is bound to. A token copied out of the
  # gateway is useless without it.
  sender_constraint:
    key_file: "${SHERIFF_DPOP_KEY_FILE}"
  scopes: ["openid", "profile", "email"]
  # The full browser-facing callback URL, registered as the client's ONLY redirect URI in the realm
  # (exact match, no wildcard). Unchanged from the base: the gateway's origin did not move, so the
  # realm needs no edit for this variant. The two paths the identity provider dials server-to-server,
  # the client JWKS (/bff/jwks) and the back-channel logout receiver, answer on every host, which is
  # why Keycloak can fetch https://api-sheriff:8443/bff/jwks.
  redirect_uri: https://localhost:8443/bff/callback
  login:
    path: /bff/login
  logout:
    path: /bff/logout
    # Where the IdP sends the browser after it ended its own session — registered in the realm as the
    # client's post-logout redirect URI.
    post_logout_redirect_uri: https://localhost:8443/bff/logout/return
    # Where the gateway sends the browser after that: a real public page (the `pages` anchor above)
    # rather than a namespace that would only redirect it straight back to the login page.
    final_redirect: /pages/signed-out.html
  session:
    mode: server
    # Sessions live in the gateway's memory, so a restart signs every browser out. That is the right
    # trade for a single-instance sample; a replicated deployment needs a shared store.
    store: memory
    # The session cookie's name. The __Host- prefix is required — it makes the browser enforce
    # Secure, Path=/ and no Domain. The login check (scripts/check-bff-login.sh) asserts the cookie by
    # this name.
    cookie_name: __Host-sample-session
    # VARIANT. The pre-route cap for Cookie header values, and for no other header. Keycloak's login
    # cookies reach it through the `auth` anchor now, and its KC_RESTART cookie alone runs to some 1650
    # characters — past the strict 1024 above, which the gateway applies to every header value BEFORE
    # it selects a route, so no endpoint-level setting could lift it for /auth. This key raises that
    # cap for the Cookie header only, to max(strict baseline, 2048); every other header stays at 1024.
    #
    # Server session mode only: a cookie-mode BFF derives its Cookie cap from max_cookie_size and
    # refuses this key. The boot also refuses a value below the resolved baseline or above 8192.
    # 2048 holds Keycloak's cookies with headroom and stays a quarter of that ceiling.
    max_cookie_header_value_length: 2048
    ttl_seconds: 3600
    # The gateway refreshes the access token it holds before it expires, so a long-lived browser
    # session never forwards an expired token upstream.
    refresh:
      enabled: true
      leeway_seconds: 30

egress_tls:
  # Which trust anchors the BFF's calls to the IdP verify Keycloak's certificate against — the same
  # self-signed certificate the JWKS fetch above trusts, so the same logical profile.
  oidc_tls_profile: sample-idp
  # VARIANT. The same anchors for the PROXIED dial: the `auth` anchor's endpoint reaches
  # https://keycloak:8443 over the gateway's data plane, which is a different client from the two
  # back channels above and keeps the JVM default trust store unless told otherwise. Hostname
  # verification stays on — the sample certificate's SAN already names keycloak.
  #
  # Gateway-wide, not per route: the profile replaces the anchors of every terminated upstream dial.
  # The demo upstream is plain http and opens no TLS connection, so nothing else in this sample is
  # affected. A deployment fronting its IdP beside https upstreams signed by another CA binds a
  # profile holding both sets of anchors.
  upstream_tls_profile: sample-idp
