# The TLS-terminating hop for the plain-HTTP variant of the compose sample.
#
# Mounted at /etc/nginx/conf.d/default.conf by docker-compose.plain-http.yml. It stands in for
# whatever terminates TLS in a real deployment — an ingress controller, a service mesh sidecar, a
# load balancer — and is deliberately the smallest thing that can play that part: terminate, add the
# forwarding headers, forward in cleartext. No caching, no rewriting, no filesystem access.
#
# It is the EDGE in this variant, so it owns the TLS posture the gateway's own listener owned in the
# base sample. That is the point of the deployment shape rather than a side effect: TLS is terminated
# exactly once, in the component that faces the network.
server {
    # 8443, not 443: the container runs as the unprivileged uid 101, and cap_drop: ALL has removed
    # CAP_NET_BIND_SERVICE, so a privileged port cannot be bound. This is also the port the base
    # sample published for the gateway's own TLS listener, so an operator's URL is unchanged —
    # https://localhost:8443/api reaches the stack in both variants.
    listen 8443 ssl;
    server_name localhost;

    # The SAME self-signed bundle the gateway terminated with in the base sample, mounted read-only.
    # Generated by docker/certificates/generate-certificates.sh and never committed, which is why
    # scripts/start-sample.sh checks for it before starting anything.
    ssl_certificate     /etc/nginx/certificates/localhost.crt;
    ssl_certificate_key /etc/nginx/certificates/localhost.key;

    # Mirrors the tls: posture the sample's gateway.yaml declares, because in this variant that block
    # no longer governs the public listener — the gateway is not terminating. Keeping the two in step
    # is what stops the variant from silently serving a weaker edge than the base sample does.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 10m;

    location / {
        # CLEARTEXT to the gateway's plain listener, over the internal bridge network only. 8080 is
        # the Quarkus default HTTP port, which is what the gateway serves on once
        # QUARKUS_HTTP_INSECURE_REQUESTS=enabled takes effect and its certificates are cleared.
        proxy_pass http://api-sheriff:8080;
        proxy_http_version 1.1;

        # The three headers the gateway's forwarded-header handling reads. They are only believed
        # because docker-compose.plain-http.yml names THIS container's static address in
        # SHERIFF_TRUSTED_PROXIES as an exact /32 — a header from any other peer on the network is
        # ignored, which is what stops a co-located container from stating its own client address.
        #
        # $proxy_add_x_forwarded_for appends the immediate peer to any inbound X-Forwarded-For rather
        # than replacing it, so a chain in front of this hop is preserved rather than flattened.
        # $http_host, NOT $host. nginx strips the port from $host, so the sample's own documented URL
        # https://localhost:8443 would reach the gateway as `Host: localhost` and the external
        # authority it resolves and regenerates would silently lose `:8443`. No X-Forwarded-Host and
        # no X-Forwarded-Port is set here, so Host is the ONLY port-bearing signal the gateway gets —
        # dropping the port is dropping the authority.
        #
        # This is not a trust decision and does not move the boundary: the value is client-controlled
        # under EITHER variable, because both are read off the request. What decides whether a
        # forwarding claim is BELIEVED is the gateway's own trusted-proxy /32 naming this container,
        # and that is unchanged.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # A LITERAL https, not $scheme. This is the value the gateway uses to decide the request
        # reached the edge over TLS, and this server block only ever serves TLS — so the literal
        # states the fact rather than reflecting back whatever the connection happened to be.
        proxy_set_header X-Forwarded-Proto https;
    }
}
