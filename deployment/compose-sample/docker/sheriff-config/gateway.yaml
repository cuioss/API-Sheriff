# yaml-language-server: $schema=../../../../api-sheriff/src/main/resources/schema/gateway.schema.json
# API Sheriff — global gateway document for the compose sample.
#
# Mounted read-only at /app/sheriff-config (SHERIFF_CONFIG_DIR). This is the whole of the gateway's
# own configuration language: what it listens for, how strictly it filters, which namespaces exist,
# and which token issuers it trusts. Endpoints live in endpoints/, topology aliases in
# topology.properties.
#
# The document is deliberately SMALL. It declares one public proxy namespace, one token issuer, and
# one server-session BFF — a session-protected namespace, the OIDC client behind it and the public
# page a signed-out browser lands on — which is the minimum that still demonstrates the shape of a
# real deployment. Everything the integration suite needs and an operator does not — passthrough SNI,
# mTLS — is absent rather than present-and-disabled: that is test scaffolding, not deployment shape.
version: 1
metadata:
  config_version: "compose-sample"

# The methods this gateway will admit at all. Anything outside this list is rejected before route
# selection. Narrow it further for a real deployment: this list is what the demo endpoints need. The
# BFF legs the sample drives — login, the callback, logout and the client JWKS — are all GET.
allowed_methods: ["GET", "HEAD"]

# The gateway-wide inbound-filter baseline. Declared EXPLICITLY rather than left to the omitted-key
# default, so the posture is visible in the document an operator reads rather than inherited
# invisibly. `strict` is also the default — stating it is a statement of intent, not a change.
#
# strict caps a request at 1 MiB of body, 20 query parameters, 1024-character header values,
# parameter values and paths. Every route below inherits it; none opts out.
security_defaults:
  profile: strict

# TLS POLICY for the terminated listener. The certificate and key themselves are NOT here — they are
# deployment-supplied through the environment (see docker-compose.yml) and this document stays free
# of key material and paths, so it is safe to commit and to copy between environments.
tls:
  # 1.2 is the floor, which enables TLS 1.2 and 1.3. Raise to "1.3" when every client can reach it.
  min_version: "1.2"
  cipher_suites:
    - TLS_AES_256_GCM_SHA384
    - TLS_AES_128_GCM_SHA256
    - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
    - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
  alpn: ["h2", "http/1.1"]

# WHOSE forwarding headers this gateway believes. Until a request's immediate TCP peer is inside this
# CIDR set, an inbound X-Forwarded-For is ignored and the peer's own address is what the upstream is
# told — so this list is the difference between a client that can state its own address and one that
# cannot. It is MANDATORY: declaring a `forwarded` block without it is refused at boot.
#
# The whole list arrives from ONE environment variable, comma-separated, because the trusted set is
# genuinely different in every environment while this document is meant to be copied unchanged
# (ADR-0032: the deployment supplies what it names). The loader types the placeholder from the
# `array` this key declares and splits it, so the number of proxies is fixed by the deployment rather
# than by this file.
#
# The BARE ${VAR} form is deliberate — the same rule oidc.client_secret follows. A `${VAR:-default}`
# would let the stack boot with a trust set nobody chose, which for an allow-list is the failure mode
# worth being loud about; an empty resolution fails the boot instead. Write the value in
# docker-compose.yml, never here.
forwarded:
  trusted_proxies: "${SHERIFF_TRUSTED_PROXIES}"

# Three namespaces. `type` + `access` are the two mandatory classification axes of every anchor.
anchors:
  # The public proxy namespace. A public anchor carries NO auth block — public IS the absence of auth,
  # so the require: none posture lives on the endpoint instead (endpoints/demo-api.yaml).
  api:
    path_prefix: /api
    type: proxy
    access: public
  # The BFF namespace: a browser that opens /app without a session is redirected to the IdP's login
  # page, and once signed in every request it sends here reaches the upstream carrying the access
  # token the gateway holds for that session — the browser itself only ever holds the session cookie.
  # type: bff forces access: authenticated, and the session floor is backed by the oidc block below
  # (a session floor with no oidc block is refused at boot). Every route under it inherits the floor
  # (endpoints/demo-app.yaml).
  app:
    path_prefix: /app
    type: bff
    access: authenticated
    auth:
      require: session
  # The public page namespace, serving static files only — today the one page a signed-out browser
  # lands on (oidc.logout.final_redirect below, endpoints/signed-out-page.yaml). An asset anchor
  # serves nothing but GET and HEAD, so it says so.
  pages:
    path_prefix: /pages
    type: asset
    access: public
    allowed_methods: ["GET", "HEAD"]

# The issuers whose tokens this gateway will validate. The BFF needs this one: the tokens the realm
# mints for a browser session are validated against it, so the oidc block below and this issuer name
# the same identity. It is also what an operator adapting this sample reaches for when they make the
# public /api route require a bearer token — and the issuer block is the part that is easy to get
# wrong.
token_validation:
  issuers:
    - name: sample-keycloak
      # The IdP's browser-facing identity, the published https://localhost:1443 (KC_HOSTNAME in
      # docker-compose.yml). Every token this realm mints carries exactly this `iss` value,
      # whichever address it was minted through. The JWKS fetch below does NOT dial this URL — it
      # stays on keycloak:8443 inside the bridge. Any other issuer value here would reject every
      # token with a 401 that looks like a signature problem and is not.
      issuer: https://localhost:1443/realms/sample
      jwks:
        source: http
        url: https://keycloak:8443/realms/sample/protocol/openid-connect/certs
        # The SSRF egress guard refuses a JWKS URL resolving to a private address, as `keycloak` does
        # here (a site-local bridge address), unless the host is allowed. Omitted, the host of url
        # above would be derived and allowed anyway; this list PINS it instead. A declared list is
        # authoritative, host-exact and never merged with the url host, so a later url edit to
        # another host fails closed rather than silently moving the exemption with it.
        allowed_egress_hosts: ["keycloak"]
        # WHICH trust anchors the JWKS fetch verifies Keycloak's certificate against. This sample's
        # Keycloak serves a SELF-SIGNED certificate (docker/certificates/generate-certificates.sh),
        # which no default trust store contains — so without a named profile the fetch fails PKIX
        # path building, the key set never loads, and readiness stays DOWN for the whole run.
        #
        # This document names the LOGICAL profile only, never the store path or its password. The
        # deployment binds it: docker-compose.yml points QUARKUS_CONFIG_LOCATIONS at
        # docker/certificates/sample-idp-trust.properties, which maps `sample-idp` to the generated
        # truststore holding exactly the sample certificate. A named profile REPLACES default trust
        # for this client rather than adding to it, and a profile left unbound, anchor-free or
        # trust-all is refused at boot — so this line can only ever narrow what the fetch accepts.
        #
        # For a real deployment keep the name (or pick your own) and bind it to your IdP's CA.
        tls_profile: sample-idp

# The BFF's OIDC client: the confidential client the gateway logs a browser in with, behind the
# require: session floor of the `app` anchor above. Server session mode, so the tokens stay in the
# gateway and the browser holds only an opaque session cookie.
#
# The client follows FAPI 2.0 rather than the simplest thing that works: there is no client_secret,
# so the gateway authenticates with a private_key_jwt assertion; every authorization request is
# pushed (PAR) and every access token is bound to the gateway's DPoP key. The realm's sample-client
# (docker/keycloak/sample-realm.json) requires all three, so a configuration that dropped one would be
# refused by the IdP rather than quietly downgraded.
oidc:
  # The IdP's ONE identity — the same value the token_validation issuer above carries, and the
  # authority the browser is redirected to for the login page (https://localhost:1443, published by
  # keycloak in docker-compose.yml).
  issuer: https://localhost:1443/realms/sample
  # Where the gateway's own calls to the IdP go — discovery, the pushed authorization request, the
  # code exchange, refresh and revocation. The browser-facing identity above is NOT reachable from
  # inside the bridge network, so these calls are dialled to keycloak:8443 instead; the identity is
  # untouched and every issuer check still compares against https://localhost:1443 (ADR-0069). A bare
  # https origin: no path, no query, no user-info — the boot refuses anything else.
  back_channel_origin: https://keycloak:8443
  client_id: sample-client
  # NO client_secret, deliberately: its absence is what selects private_key_jwt. The assertion is
  # signed with the key below; Keycloak verifies it against the public half the gateway publishes at
  # /bff/jwks (the default client JWKS path), which it fetches from the address the deployment names
  # (SAMPLE_GATEWAY_JWKS_URL in docker-compose.yml).
  #
  # Both key files are BARE placeholders. A key file is a location, not a secret, but it is still a
  # deployment fact: this document stays free of paths, as the TLS block above promises, and
  # docker-compose.yml supplies them. An unset variable fails the boot rather than starting a BFF
  # with no key.
  client_authentication:
    key_file: "${SHERIFF_CLIENT_AUTH_KEY_FILE}"
  # The DPoP proof key every access token of this gateway is bound to. A token copied out of the
  # gateway is useless without it.
  sender_constraint:
    key_file: "${SHERIFF_DPOP_KEY_FILE}"
  scopes: ["openid", "profile", "email"]
  # The full browser-facing callback URL, registered as the client's ONLY redirect URI in the realm
  # (exact match, no wildcard). Its host is the host the reserved /bff paths answer on, and its
  # origin is the one return URLs and the CSRF check are held to.
  redirect_uri: https://localhost:8443/bff/callback
  login:
    path: /bff/login
  logout:
    path: /bff/logout
    # Where the IdP sends the browser after it ended its own session — registered in the realm as the
    # client's post-logout redirect URI.
    post_logout_redirect_uri: https://localhost:8443/bff/logout/return
    # Where the gateway sends the browser after that: a real public page (the `pages` anchor above)
    # rather than a namespace that would only redirect it straight back to the login page.
    final_redirect: /pages/signed-out.html
  session:
    mode: server
    # Sessions live in the gateway's memory, so a restart signs every browser out. That is the right
    # trade for a single-instance sample; a replicated deployment needs a shared store.
    store: memory
    # The session cookie's name. The __Host- prefix is required — it makes the browser enforce
    # Secure, Path=/ and no Domain — and the name must differ from the gateway's own binding and
    # logout cookies. The login check (scripts/check-bff-login.sh) asserts the cookie by this name.
    cookie_name: __Host-sample-session
    ttl_seconds: 3600
    # The gateway refreshes the access token it holds before it expires, so a long-lived browser
    # session never forwards an expired token upstream.
    refresh:
      enabled: true
      leeway_seconds: 30

# Which trust anchors the BFF's calls to the IdP verify Keycloak's certificate against — the same
# self-signed certificate the JWKS fetch above trusts, so the same logical profile. Without it the
# back channel would fall back to default trust and fail PKIX path building on the first login.
egress_tls:
  oidc_tls_profile: sample-idp
