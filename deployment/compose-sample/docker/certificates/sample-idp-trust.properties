# Deployment-supplied trust material for the `sample-idp` TLS profile.
#
# gateway.yaml names only the LOGICAL profile (`jwks.tls_profile: sample-idp`); this file is where that
# name is bound to concrete trust material. It is the same binding the integration-test stack uses for
# its `benchmark-idp` profile (integration-tests/src/main/docker/certificates/benchmark-idp-trust.properties):
# raw Quarkus keys, loaded through QUARKUS_CONFIG_LOCATIONS in docker-compose.yml, living with the
# deployment rather than in the shipped api-sheriff artifact.
#
# It sits in the already-mounted certificates/ directory beside the store it references, so the sample
# adds no new volume. It is deliberately NOT under sheriff-config/, which is API Sheriff's own
# configuration-language directory; these are runtime keys, not gateway.yaml.
#
# The referenced store is GENERATED, never committed: docker/certificates/generate-certificates.sh
# writes it next to localhost.crt and it holds exactly that one self-signed certificate — the one
# Keycloak serves. So the JWKS fetch trusts the sample IdP and nothing else. The password below only
# guards the integrity of a store that contains no private key; it is sample material, like every
# other value in this directory, and a real deployment supplies its own store and password.
#
# The keys are UNPREFIXED: no %-profile branch is needed or wanted here.
quarkus.tls.sample-idp.trust-store.p12.path=/app/certificates/sample-idp-truststore.p12
quarkus.tls.sample-idp.trust-store.p12.password=sample-idp-trust
