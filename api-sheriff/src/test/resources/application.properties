# Test profile — use existing integration-test certificates for TLS.
#
# The certificate is supplied through quarkus.http.ssl.certificate.* — the SAME key family the
# deployment uses (QUARKUS_HTTP_SSL_CERTIFICATE_FILES / _KEY_FILES in integration-tests/docker-compose.yml
# and README.adoc). This is deliberate and load-bearing, not incidental: the two ways of supplying a
# server certificate select two DIFFERENT listener-construction paths in Quarkus.
#   - quarkus.tls.key-store.*   -> the default TLS-registry configuration carries KeyStoreOptions, so
#                                  the listener is built from the TLS registry.
#   - quarkus.http.ssl.certificate.* -> the registry guard fails and the listener is built from
#                                  quarkus.http.ssl.*, which is what this gateway actually ships.
# The test profile previously used the key-store form and therefore booted a listener that production
# never builds. That divergence is exactly what let the raw quarkus.tls.protocols / .cipher-suites
# policy keys sit inert in production while looking configured (ADR-0025). Terminated-listener TLS
# policy is now single-sourced from gateway.yaml and applied by tls/TlsServerCustomizer, an
# HttpServerOptionsCustomizer that runs against the quarkus.http.ssl.* listener — so the test boot has
# to construct that listener for the customizer to be exercised at all.
quarkus.http.ssl.certificate.files=../integration-tests/src/main/docker/certificates/localhost.crt
quarkus.http.ssl.certificate.key-files=../integration-tests/src/main/docker/certificates/localhost.key
quarkus.management.enabled=false
quarkus.log.file.enable=false

# Minimal valid boot config so ConfigProducer's fail-fast startup succeeds inside
# the full-container @QuarkusTest boot (see src/test/resources/config/testboot).
# The proxy edge under test sources its upstream from the RouteTable assembled from
# this directory (endpoints/proxy.yaml -> UPSTREAM topology alias), not from any
# static sheriff.proxy.* configuration.
sheriff.config.dir=target/test-classes/config/testboot
