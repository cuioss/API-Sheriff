# API Sheriff Application Configuration

# Application metadata
quarkus.application.name=api-sheriff

# HTTP/HTTPS Configuration
#
# quarkus.http.ssl-port and quarkus.http.insecure-requests stay here deliberately: they are
# deployment-bound PORT and EXPOSURE knobs, not TLS policy, and are therefore NOT promoted into
# gateway.yaml. ADR-0025 states the boundary rule — gateway.yaml names TLS *policy* in neutral terms,
# while ports and trust material stay deployment-supplied. The ADR-0017 SNI passthrough topology
# depends on exactly this: a deployment that enables tls.passthrough_sni overrides
# QUARKUS_HTTP_SSL_PORT to move the terminated listener to the internal loopback port (8444), which a
# gateway.yaml-owned port could not express.
quarkus.http.port=8080
quarkus.http.ssl-port=8443
quarkus.http.insecure-requests=redirect

# Framework body-size floor under the gateway's own per-route max_body_bytes caps.
# Without this key Vert.x applies the Quarkus default of 10 MiB and silently clips any route
# declaring a larger security_filter.max_body_bytes, so the gateway's own cap never fires.
# (i)   This is the FLOOR: the gateway still enforces the smaller per-route cap on top of it.
# (ii)  A deployment declaring a larger max_body_bytes must raise this key — ConfigProducer's
#       fail-closed boot check refuses to start when a declared cap exceeds this limit.
# (iii) At floor == largest declared cap, the Quarkus root handler's Content-Length pre-check
#       answers a breach with a bare 413 (Connection: close, empty body) BEFORE the gateway
#       pipeline runs, so the RFC 9457 problem+json envelope is rendered only for routes capped
#       below the floor. An operator who wants the gateway's own envelope on the largest-capped
#       route sets this floor ABOVE that cap rather than equal to it.
# (iv)  Chunked requests carry no Content-Length, so they pass the pre-check untouched and are
#       capped by the gateway's streaming byte counter instead.
# 64M == 67108864 bytes, matching the largest declared max_body_bytes in the shipped topology.
quarkus.http.limits.max-body-size=64M

# Management interface — health/metrics on a separate port (9000), served over HTTPS.
# Follows the Keycloak pattern of splitting operations off the application port: application on
# 8443, operations on 9000. Unlike quarkus.http, Quarkus' ManagementConfig declares NO ssl-port and
# NO insecure-requests key — the management interface has exactly ONE port, so supplying
# quarkus.management.ssl.certificate.* converts port 9000 itself to HTTPS. There is no simultaneous
# plain-HTTP management listener; every consumer of 9000 must speak TLS.
# The certificate paths are deliberately NOT set here: they are container paths
# (/app/certificates/...) that would break every non-container run. The deployment supplies them via
# QUARKUS_MANAGEMENT_SSL_CERTIFICATE_FILES / QUARKUS_MANAGEMENT_SSL_CERTIFICATE_KEY_FILES, exactly
# as it already does for the main listener.
quarkus.management.enabled=true

# Terminated-listener TLS policy is single-sourced from gateway.yaml's `tls` block (min_version,
# cipher_suites, alpn) and bound onto the listener by tls/TlsServerCustomizer — there is no raw
# quarkus.tls.* policy key here any more. The keys that used to sit in this block
# (quarkus.tls.protocols, quarkus.tls.cipher-suites, quarkus.tls.alpn) never reached the listener:
# Quarkus consults the default TLS-registry configuration only when it carries KeyStoreOptions, i.e.
# only when the certificate is supplied via quarkus.tls.key-store.*. This gateway supplies its
# certificate through quarkus.http.ssl.certificate.* instead, so that guard always failed and the
# listener was built from quarkus.http.ssl.* — where no protocols and no cipher suites were declared.
# The declared TLS floor and cipher allowlist were therefore inert; they are now in force through
# gateway.yaml (ADR-0025). The build-time GraalVM knob quarkus.ssl.native moved to api-sheriff/pom.xml's
# native profile, which is the only place it can take effect.

# Accept-time TLS edge — SNI passthrough split (tls/SniFrontListener, tls/TlsEdgeProducer).
# The Vert.x front listener is started ONLY when gateway.yaml declares tls.passthrough_sni; when it
# is empty the front is never created and the terminated Quarkus HTTPS listener (quarkus.http.ssl-port
# above) keeps the public port — the default single-listener topology is unchanged (zero overhead).
# A deployment that enables tls.passthrough_sni gives the public TLS port to the front listener and
# moves the terminated Quarkus HTTPS listener to the internal loopback port by additionally setting
#   quarkus.http.ssl-port=${sheriff.tls.internal-https-port}
# so the front owns sheriff.tls.public-port and opaquely L4-relays a matched SNI to the resolved
# backend, handing every other connection to the internal terminated listener.
sheriff.tls.public-port=8443
sheriff.tls.internal-https-port=8444

# mTLS on terminated connections (tls/MtlsServerCustomizer). Client-auth is bound PROGRAMMATICALLY
# from gateway.yaml's tls.mtls block: when tls.mtls.enabled is set the terminated HTTPS listener is
# switched to require-and-verify a client certificate against the configured client_ca trust anchor
# (no HTTP fallback, no optional/want mode). No quarkus.http.ssl.client-auth key is declared here: the
# customizer runs after createSslOptions and overwrites whatever that key had set, so gateway.yaml's
# tls.mtls is the single source — absent or disabled leaves client-auth off. Passthrough connections
# are split off at L4 and never mTLS-checked.

# Native Image Configuration
# The four BFF classes below each hold a `static final SecureRandom`. GraalVM initializes static
# state at BUILD time by default, which would bake a seeded SecureRandom into the image heap
# (a build failure — "instance of Random/SplittableRandom in the image heap" — AND a real security
# defect: predictable randomness from a cached seed). Force runtime initialization for each so the
# SecureRandom is seeded from the OS entropy source at process start. The list is comma-separated,
# so each class needs its own --initialize-at-run-time entry (a comma-joined class list inside a
# single flag would be split by the outer comma).
# The token-sheriff-client engine flow classes (PkceChallenge, FlowContext, and sibling
# refresh/step-up/end-session flows) likewise hold static SecureRandom fields. Deliverable 16 wired
# the engine into the live edge (BffRuntimeProducer -> AuthorizationCodeFlow -> FlowContext.create),
# so those static fields are now reachable in the image heap and hit the same build failure. A single
# package-prefix --initialize-at-run-time=de.cuioss.sheriff.token.client.flow covers the whole flow
# package (GraalVM treats a bare package name as a prefix over that package and its classes), so
# every current and future sibling flow class is forced to runtime initialization in one entry.
# CookieSessionBinding joins the list for the same reason: the cookie-mode per-session nonce is
# minted from a `static final SecureRandom` on the login path, so its class initializer would
# otherwise bake a seeded instance into the image heap.
quarkus.native.additional-build-args=--enable-url-protocols=https,--enable-http,--enable-https,-O2,--initialize-at-run-time=de.cuioss.sheriff.gateway.bff.pending.PendingAuthorizationRecord,--initialize-at-run-time=de.cuioss.sheriff.gateway.bff.session.SessionRecord,--initialize-at-run-time=de.cuioss.sheriff.gateway.bff.logout.RpInitiatedLogout,--initialize-at-run-time=de.cuioss.sheriff.gateway.bff.cookie.CookieSessionBinding,--initialize-at-run-time=de.cuioss.sheriff.token.client.flow
quarkus.native.resources.includes=**/*.p12,**/*.crt,**/*.key,schema/*.json
quarkus.native.monitoring=jfr
# Java 25 Mandrel builder image for JEP 491 (virtual threads without pinning) — see ADR-0001
quarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-25

# Virtual Threads Configuration
quarkus.virtual-threads.name-prefix=api-sheriff

# Configuration subsystem — the directory holding gateway.yaml, the endpoints/
# subdirectory, and topology.properties. Read once at startup by ConfigProducer,
# which validates the whole set and fails fast (non-zero exit) on any violation.
sheriff.config.dir=config

# Token-Sheriff validation issuer — integration-test profile only.
# The token-sheriff-validation-quarkus extension requires at least one enabled issuer,
# and its JWKS readiness check only reports UP once the issuer's key set has loaded.
# The shipped default profile configures no issuer (deployments supply their own).
# Under the "it" profile (QUARKUS_PROFILE=it, set by the integration-tests docker-compose)
# we use a static file JWKS: a file loader reaches OK synchronously at startup, so readiness
# is UP with no dependency on Keycloak reachability (the api-sheriff integration tests
# exercise gateway routing + health, not live token validation). The JWKS is mounted
# read-only into the container at /app/certificates/test-jwks.json; token-sheriff's
# jwks.file-path is a plain filesystem path (no classpath: support).
# Trust profile named by gateway.yaml's jwks.tls_profile — integration/benchmark profile only.
# gateway.yaml says only `tls_profile: benchmark-idp`; this is where that logical name is bound
# to concrete trust material, which is why no truststore path or password ever appears in the
# gateway document. The benchmark Keycloak serves a self-signed localhost certificate, so the
# JWKS client must trust the same store the rest of the stack already mounts — without it the
# fetch fails PKIX path building and every bearer request is rejected 401. Test-only material:
# the shipped default profile binds no such trust profile, and a deployment that names one
# supplies its own anchors.
%it.quarkus.tls.benchmark-idp.trust-store.p12.path=/app/certificates/localhost-truststore.p12
%it.quarkus.tls.benchmark-idp.trust-store.p12.password=localhost-trust

%it.sheriff.token.issuers.it-static.enabled=true
%it.sheriff.token.issuers.it-static.issuer-identifier=https://api-sheriff.test/it
%it.sheriff.token.issuers.it-static.jwks.file-path=/app/certificates/test-jwks.json
%it.sheriff.token.issuers.it-static.audience-validation-disabled=true
%it.sheriff.token.issuers.it-static.claim-sub-optional=true

# Logging
quarkus.log.level=INFO
quarkus.log.category."de.cuioss.sheriff".level=INFO

# File logging (enabled in Docker via LOG_FILE_PATH env var)
quarkus.log.file.enable=true
quarkus.log.file.path=${LOG_FILE_PATH:/quarkus.log}
quarkus.log.file.level=INFO
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS z} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.file.rotation.max-file-size=100M
quarkus.log.file.rotation.max-backup-index=5
%dev.quarkus.log.file.enable=false

# Development settings
quarkus.live-reload.instrumentation=false
