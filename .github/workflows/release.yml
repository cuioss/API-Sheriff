# Configuration is read from .github/project.yml - no inputs needed!
name: Release

# A merge can cut a release again — because the DECISION moved, not because the trigger was
# forgiven.
#
# THE INCIDENT THIS TRIGGER CAUSED ONCE. On 2026-07-12 a `pull_request: {types: [closed], paths:
# ['.github/project.yml']}` trigger of exactly this shape fired a real Maven Central release: merging
# a PR that touched .github/project.yml published de.cuioss.sheriff.api:*:1.0.0. Maven Central
# artifacts are superseded, never withdrawn, so that version was abandoned, relocation-stubbed at
# 1.0.1, the coordinates moved to de.cuioss.sheriff.gateway, and the version line restarted.
#
# WHAT HAD TO BE TRUE BEFORE IT COULD RETURN. That trigger fired on MERGED-NESS — every merge
# touching the file was a publication. The pinned cuioss-organization workflow below now owns a
# version-changed guard, so the release is decided CENTRALLY, on whether the declared version
# actually changed. That is precisely the discrimination the 2026-07-12 trigger lacked, and it is
# consumed here, never re-implemented locally.
#
# The decision itself is recorded in ADR-0035 (doc/adr/), which supersedes ADR-0034 — read it there
# rather than restating it here.
on:
  workflow_dispatch:
  # PREFILTER ONLY, NEVER THE DECISION. This path matches EVERY edit to .github/project.yml, not just
  # a version bump: the file's non-release keys today include name, description, maven-build, sonar,
  # pages and github-automation, and that list is open — a key added tomorrow matches too. So a merge
  # arriving here proves nothing about the version. The central guard is what decides; this only
  # keeps unrelated merges out.
  # `branches:` filters on the PR's BASE, so only a PR merging INTO main can reach the release job at
  # all. Without it a merge into any long-lived branch that touched .github/project.yml would enter
  # this workflow and be decided solely by the central guard's parent comparison against THAT
  # branch — a release cut from a non-main line. This is a base filter, not the version
  # discriminator; it narrows what may ask, never what is answered.
  pull_request:
    types: [closed]
    branches: [main]
    paths: ['.github/project.yml']

permissions:
  contents: read

# THE MANAGEMENT CONTEXT PATH THE SMOKE PROBE ADDRESSES, declared once rather than spelled into the
# probe URL. The path is a BUILD-TIME property of the image: quarkus.management.root-path is fixed at
# augmentation, so no environment variable can move it on an already-built container, and a probe URL
# carrying a literal would be a second copy of a value the image decided at build time.
#
# It MUST match the value the image below was built with. The "Run the integration-test suite" step
# drives a plain `./mvnw verify -Pintegration-tests` and passes no -Dsheriff.management-context-path,
# so api-sheriff/pom.xml's management-context-path profile stays inactive, the shipped
# application.properties declaration is the acting source, and that value is /q. A build that starts
# driving the seam property must change this value in the SAME commit — otherwise the probe 404s
# against a perfectly healthy image and the smoke fails for a reason that reads like a broken build.
#
# That obligation is ASSERTED rather than left to the comment: the "Assert the smoke-probe path
# matches the shipped management root path" step below compares this constant against the shipped
# declaration and fails the release, before the image is built, when the two disagree.
env:
  MANAGEMENT_CONTEXT_PATH: /q

jobs:
  release:
    # TWO OPERANDS DOING TWO DIFFERENT JOBS. Both are ANDed with the central version-changed guard
    # inside the called workflow, NEVER an alternative to it.
    #
    # THE DISPATCH OPERAND — `github.event_name != 'workflow_dispatch' || github.ref ==
    # 'refs/heads/main'`. `workflow_dispatch:` above takes no branch filter (GitHub offers none), so
    # a dispatch can be launched from any branch or tag. The signing-identity block on publish-image
    # below (§ "THE IDENTITY NAMES EXACTLY ONE REF") narrows the accepted Cosign identity to the
    # single ref refs/heads/main, resting that narrowing on the claim that both events able to reach
    # the lane yield refs/heads/main. On the merge path `branches: [main]` above ENFORCES that claim;
    # on the dispatch path nothing did — it was assumed. This operand is what makes it a checked
    # fact, and it sits on the release job so a non-main dispatch is refused BEFORE the Maven
    # publication rather than after it. The Cosign verify step is not the enforcement point: it
    # matches a certificate against an already-produced signature, which is long after the jars are
    # on Maven Central. Do not restate the certificate evidence here — it lives in that block.
    #
    # THE MERGE OPERAND — `github.event_name != 'pull_request' || github.event.pull_request.merged
    # == true`. Its merit is defence-in-depth plus not spending a runner on a close-without-merge —
    # it is NOT here because the central guard is blind to merged-ness; that guard checks
    # merged-ness too.
    #
    # Both operands are written event-first so each path still runs: the event a given operand does
    # not govern makes its first disjunct true and short-circuits the operand. This is the same shape
    # .github/workflows/benchmark.yml already ships.
    #
    # The main-ref test is DELIBERATELY dispatch-scoped. The merge path is already base-filtered by
    # `branches: [main]`, so extending the ref test to it would stake this project's primary release
    # path on an assumption about github.ref under a closed-merge event, buying no guarantee that the
    # base filter does not already provide.
    if: >-
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
      && (github.event_name != 'pull_request' || github.event.pull_request.merged == true)
    permissions:
      contents: write
    uses: cuioss/cuioss-organization/.github/workflows/reusable-maven-release.yml@f3b0586c485fa1f4ea8e004bd56f27f0a7d280df # v0.23.0
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      OSS_SONATYPE_USERNAME: ${{ secrets.OSS_SONATYPE_USERNAME }}
      OSS_SONATYPE_PASSWORD: ${{ secrets.OSS_SONATYPE_PASSWORD }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  # Publishes the container image at the SAME version the Maven release just cut.
  #
  # WHY `needs.release.outputs.released-version != ''` IS THE RUN/SKIP DISCRIMINATOR.
  # At the pinned 937fbcf (v0.18.0) the reusable workflow DOES declare an `on.workflow_call.outputs`
  # block, so `released-version` is genuinely readable here. It is EMPTY exactly when the central
  # guard declined to release — the declared version did not move, or a tag for it already exists —
  # so an empty string proves no release was produced, never which predicate refused. The caller
  # consumes it and derives nothing. Without this `if:`, a guard-skipped merge would still spend 90
  # minutes on a native build, then re-push and re-sign an already-released tag.
  #
  # The two obvious alternatives are both wrong. `needs.release.result` reports a non-failure for a
  # called workflow whose internal jobs all skipped, so it cannot tell a real release from a skipped
  # one. Re-deriving "the version changed" in this caller would re-implement centrally-owned logic —
  # the thing this design exists to avoid.
  #
  # SCOPE SPLIT — two separate questions, two separate answers. Do not merge them.
  #   * `needs.release.outputs.released-version` decides WHETHER this job runs (run/skip).
  #   * `steps.config.outputs.current-version` supplies THE VALUE PUBLISHED. It comes from the
  #     sparse checkout + `read-project-config` steps below, which are DELIBERATELY RETAINED rather
  #     than replaced by a `needs.` expression — the retention rests on keeping this lane's version
  #     lookup independent of the release job's output plumbing, not on that output being
  #     unavailable. It is not a leftover of the retired caveat.
  # Consuming the output for run/skip while retaining the re-read for the value is consistent, not
  # contradictory. Collapsing the two would delete this job's guard discriminator and re-open the
  # 90-minute no-op publish lane.
  #
  # The org workflow is NOT forked, and this job now runs only when the central guard let a release
  # through.
  #
  # LATENCY NOTE — `needs: [release]` waits for the whole called workflow, including its
  # wait-for-maven-central (30-minute timeout) and propagate-to-consumers jobs. Both are `if:`-gated
  # on a non-empty `consumers` output and .github/project.yml declares none, so both skip and add no
  # wall time. A long wait here is Maven Central, not a hang.
  publish-image:
    name: Publish the tested image to GHCR
    needs: [release]
    if: needs.release.outputs.released-version != ''
    runs-on: ubuntu-latest
    # The native compile inside the integration-test lifecycle is the dominant term; the scan, push
    # and smoke together are minutes.
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      # Required for Cosign keyless OIDC signing. Not a novel posture for this repository —
      # scorecards.yml, pr-agent.yml and claude.yml already declare it.
      id-token: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      # Checked out into a side directory so the release-tag checkout below owns the workspace root
      # untouched. Only .github/project.yml is needed here.
      #
      # sparse-checkout-cone-mode MUST be false. Cone mode — the action's default — matches
      # DIRECTORY entries only, so the single-file pattern below would match nothing and
      # .release-config/.github/project.yml would simply not exist; the next step would then fail on
      # a missing config for a reason that reads nothing like "sparse checkout mode". Non-cone mode
      # applies gitignore-style patterns, which is what a single-file checkout needs.
      - name: Check out the release configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: .release-config
          sparse-checkout: .github/project.yml
          sparse-checkout-cone-mode: false

      - name: Read the released version
        id: config
        uses: cuioss/cuioss-organization/.github/actions/read-project-config@f3b0586c485fa1f4ea8e004bd56f27f0a7d280df # v0.23.0
        with:
          config-path: .release-config/.github/project.yml

      # The RELEASE TAG, never the dispatching ref. cui-parent-pom configures maven-release-plugin
      # with <tagNameFormat>@{project.version}</tagNameFormat>, so the SCM tag is literally the
      # version string with no prefix, and the reusable workflow pushes it with `tags: true` before
      # the job ends. Checking out the dispatching ref would build a -SNAPSHOT tree and label it with
      # the release version — every step would still succeed, which is what makes it dangerous.
      # If a future parent bump changes tagNameFormat this checkout fails loudly on an unresolvable
      # ref: a red release rather than a wrong image.
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.config.outputs.current-version }}

      # The commit the `sha-` tag names: the release:prepare commit whose poms carry the released
      # version, NOT the main HEAD the release was dispatched from.
      - name: Resolve the release-tag commit
        id: commit
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Before the version assertion, because the assertion evaluates project.version through Maven.
      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # THE STRUCTURAL GUARD that makes "image version identical to Maven version" a checked fact
      # rather than an assumption. Fails loudly, before anything is built or pushed TO GHCR.
      #
      # Scope of "before anything is pushed", stated precisely: this job runs AFTER `needs: [release]`,
      # so the Maven Central publication has already happened by the time this assertion runs. It can
      # therefore prevent a wrong IMAGE from being published; it cannot un-publish a jar. A failure
      # anywhere in this job leaves a jars-only release — see release-process.adoc
      # § "If the image lane fails after the Maven release" for the recovery procedure. Ordering this
      # job before the release is not possible: the released version does not exist until the release
      # job has cut it.
      - name: Assert the checked-out project version matches the released version
        env:
          RELEASED_VERSION: ${{ steps.config.outputs.current-version }}
        run: |
          POM_VERSION="$(./mvnw --no-transfer-progress -q help:evaluate -Dexpression=project.version -DforceStdout)"
          if [ "$POM_VERSION" != "$RELEASED_VERSION" ]; then
            echo "::error::Version identity violated: checked-out project.version='${POM_VERSION}' but .github/project.yml current-version='${RELEASED_VERSION}'. Refusing to build or publish."
            exit 1
          fi
          echo "Version identity confirmed: ${POM_VERSION}"

      # THE SMOKE-PROBE PATH AND THE SHIPPED DECLARATION ARE TWO COPIES OF ONE VALUE, AND THIS STEP IS
      # WHAT KEEPS THEM EQUAL.
      #
      # MANAGEMENT_CONTEXT_PATH (declared at the top of this workflow) composes the published-image
      # smoke probe URL. It cannot be DERIVED here, and that is settled rather than unexamined: this
      # lane drives `docker run` against a pulled image, so there is no resolved Compose model to read
      # the de.cuioss.sheriff.management-root-path label from, and
      # api-sheriff/src/main/docker/Dockerfile.native declares no root-path OCI label to inspect. Where
      # derivation is structurally impossible the answer is an assertion — the same answer
      # ManagementRootPathLabelIT gives for the three hand-maintained literals under integration-tests/.
      #
      # application.properties is the right side to assert against, because the image this lane
      # publishes is built by the plain `./mvnw verify -Pintegration-tests` below, which passes no
      # -Dsheriff.management-context-path. api-sheriff/pom.xml's management-context-path profile
      # therefore stays inactive and the shipped declaration's inline default is the acting value.
      # Do NOT "fix" a failure here by passing the seam property into that build: activating a profile
      # the design deliberately keeps inactive, inside the release lane, is a far larger change than
      # correcting a constant, and it buys nothing this assertion does not already give.
      #
      # It runs BEFORE the image build and long before any push, so a mismatch costs seconds rather
      # than a 90-minute native build followed by a smoke failure that reads like a broken image.
      - name: Assert the smoke-probe path matches the shipped management root path
        env:
          SHIPPED_PROPERTIES: api-sheriff/src/main/resources/application.properties
        run: |
          if [ ! -f "$SHIPPED_PROPERTIES" ]; then
            echo "::error::${SHIPPED_PROPERTIES} is missing, so the smoke-probe path cannot be checked against the value the image is built with. Restore the file rather than removing this step."
            exit 1
          fi
          DECLARED="$(awk '/^quarkus\.management\.root-path=/ { sub(/^[^=]*=/, ""); print }' "$SHIPPED_PROPERTIES")"
          if [ -z "$DECLARED" ]; then
            echo "::error::No quarkus.management.root-path declaration in ${SHIPPED_PROPERTIES}. MANAGEMENT_CONTEXT_PATH='${MANAGEMENT_CONTEXT_PATH}' in .github/workflows/release.yml would then be an unchecked literal again. Restore the declaration rather than removing this step."
            exit 1
          fi
          # The declaration is an expression over a carrier key -- ${quarkus.sheriff-mgmt-path:/q} --
          # and with the seam property unset it is the inline default that acts. A plain literal is
          # accepted unchanged, so this keeps working if the carrier indirection is ever retired.
          EFFECTIVE="$DECLARED"
          # shellcheck disable=SC2016  # the ${...} here is a literal to match in $DECLARED, not an expansion
          case "$DECLARED" in
            \$\{*:*\})
              EFFECTIVE="${DECLARED#*:}"
              EFFECTIVE="${EFFECTIVE%\}}"
              ;;
          esac
          if [ "$EFFECTIVE" != "$MANAGEMENT_CONTEXT_PATH" ]; then
            echo "::error::Smoke-probe path disagrees with the image this lane publishes. .github/workflows/release.yml declares MANAGEMENT_CONTEXT_PATH='${MANAGEMENT_CONTEXT_PATH}', while ${SHIPPED_PROPERTIES} declares quarkus.management.root-path='${DECLARED}', which acts as '${EFFECTIVE}' for the unseamed build this lane runs. The probe would 404 against a perfectly healthy image. Change the workflow constant to match the shipped declaration; do NOT pass -Dsheriff.management-context-path into the integration-test build to make them agree."
            exit 1
          fi
          echo "Smoke-probe path confirmed: MANAGEMENT_CONTEXT_PATH='${MANAGEMENT_CONTEXT_PATH}' matches the acting quarkus.management.root-path in ${SHIPPED_PROPERTIES}."

      # THE ONE AND ONLY IMAGE BUILD IN THIS LANE.
      # integration-tests/pom.xml binds `docker compose build api-sheriff` to pre-integration-test,
      # so the harness always builds the image. Letting that build be authoritative is what makes
      # "push exactly what was tested" true BY CONSTRUCTION — there is only one build, so nothing can
      # drift. Do NOT add a second `docker build` here, and do NOT add a skip-guard to
      # integration-tests/pom.xml. APP_VERSION and APP_REVISION reach the image labels through the
      # Compose service's build.args (see integration-tests/docker-compose.yml) — that is the only
      # channel, because this lane performs no `docker build` of its own. APP_REVISION carries the
      # release-tag commit resolved above, so org.opencontainers.image.revision names the very commit
      # the `sha-` tag names.
      - name: Run the integration-test suite (builds the image)
        env:
          APP_VERSION: ${{ steps.config.outputs.current-version }}
          APP_REVISION: ${{ steps.commit.outputs.sha }}
        run: |
          ./mvnw --no-transfer-progress verify -Pintegration-tests -pl integration-tests -am

      # The local image store is TAG-keyed and can serve a stale image, so every later step addresses
      # the image by this content-derived ID rather than by the api-sheriff:distroless tag.
      # An unpushed local image has an empty .RepoDigests — the registry manifest digest does not
      # exist yet and must not be reached for here.
      - name: Resolve the tested image ID
        id: image
        run: |
          IMAGE_ID="$(docker image inspect --format '{{.Id}}' api-sheriff:distroless)"
          if [ -z "$IMAGE_ID" ]; then
            echo "::error::api-sheriff:distroless is absent from the local image store after the integration-test run."
            exit 1
          fi
          echo "id=${IMAGE_ID}" >> "$GITHUB_OUTPUT"
          echo "Tested image ID: ${IMAGE_ID}"

      # SBOM for the TESTED image, so it describes exactly what ships.
      - name: Generate the SPDX SBOM for the tested image
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.image.outputs.id }}
          format: spdx-json
          artifact-name: api-sheriff-${{ steps.config.outputs.current-version }}-sbom.spdx.json
          upload-artifact: true
          # The job holds `contents: read`; it must not attempt to attach assets to a GitHub release.
          upload-release-assets: false

      # THE GATE. A finding at HIGH **or** CRITICAL fails the job, and because this step sits ABOVE
      # the `docker login` below, nothing has been pushed TO GHCR when it fires. (The Maven artifacts
      # were already published by the `release` job this one depends on — see the version-assertion
      # step above for the partial-release scope and the recovery pointer.)
      #
      # `ignore-unfixed: 'false'` is deliberate, and it has a cost worth naming: an unfixed HIGH or
      # CRITICAL CVE in the pinned base image blocks EVERY release until the base is re-pinned to a
      # patched digest — including CVEs with no upstream fix available at all. There is deliberately
      # no `.trivyignore` in the tree today, because an empty suppression file invites silent
      # additions. The sanctioned escape hatch is documented in release-process.adoc
      # § "If the scan blocks on an unfixable base-image CVE"; take it there, with a recorded
      # justification, rather than relaxing this threshold.
      #
      # The HIGH+CRITICAL threshold is deliberate, not a default: API Sheriff is a security-focused
      # gateway, so the stricter posture is the point. Do not relax it to CRITICAL-only without an
      # explicit, recorded decision.
      #
      # SCOPE HONESTY — what this scan can and cannot see. The image is the pinned distroless base
      # plus exactly TWO layers: `WORKDIR /app` (~8 kB) and the GraalVM native executable
      # (`COPY --chmod=0755 target/*-runner /app/application`, ~95 MB). The executable is dynamically
      # linked — no --static and no --libc=musl is configured in quarkus.native.additional-build-args
      # — which is why the base is the glibc-bearing quarkus-distroless-image rather than scratch. The
      # load-bearing property is not how it is linked but that NEITHER LAYER CARRIES PACKAGE METADATA
      # OR JARS, so
      # Trivy's Java analyzer finds nothing and this is in substance a scan of the pinned base
      # image's OS packages. Java dependency CVEs are covered by the PR-lane filesystem scan in
      # maven.yml and by the Sonar and Dependabot lanes — NOT here. A clean result here is not
      # evidence of a clean dependency tree.
      #
      # ATTESTATION POSTURE, PINNED. This lane builds into the local image store (via the harness
      # `docker compose build`) and then `docker tag` + `docker push`. It must NOT switch to
      # `docker buildx build --push`: with buildx's default attestations a registry push produces a
      # manifest LIST wrapping the image alongside provenance/SBOM attestations, and the top-level
      # digest then addresses that list rather than the plain image manifest — which changes what the
      # pull-by-digest smoke pulls and what Cosign signs. The current shape sidesteps the problem
      # entirely rather than managing it.
      - name: Scan the tested image (gating, HIGH and CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.id }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: 'false'
          format: table

      # The registry path is HARDCODED LOWERCASE on purpose: ${{ github.repository }} yields
      # cuioss/API-Sheriff and GHCR rejects the uppercase, so deriving it from the context would fail
      # at push time.
      # Credentials reach the shell through the environment, never through `${{ }}` expansion inside
      # the script body — expression interpolation into a run block is a script-injection sink.
      - name: Log in to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Tag and push both release tags
        env:
          IMAGE_ID: ${{ steps.image.outputs.id }}
          RELEASED_VERSION: ${{ steps.config.outputs.current-version }}
          TAG_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          docker tag "$IMAGE_ID" "ghcr.io/cuioss/api-sheriff:${RELEASED_VERSION}"
          docker tag "$IMAGE_ID" "ghcr.io/cuioss/api-sheriff:sha-${TAG_SHA}"
          docker push "ghcr.io/cuioss/api-sheriff:${RELEASED_VERSION}"
          docker push "ghcr.io/cuioss/api-sheriff:sha-${TAG_SHA}"

      # Resolve the pushed registry manifest digest ONCE and assert both tags report the same one.
      # From here on the image is addressed by digest, never by tag.
      - name: Resolve the pushed manifest digest
        id: digest
        env:
          IMAGE_ID: ${{ steps.image.outputs.id }}
        run: |
          mapfile -t DIGESTS < <(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE_ID" \
            | grep '^ghcr\.io/cuioss/api-sheriff@' | sed 's|.*@||' | sort -u)
          if [ "${#DIGESTS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one ghcr.io/cuioss/api-sheriff manifest digest, found ${#DIGESTS[@]}: ${DIGESTS[*]}"
            exit 1
          fi
          echo "value=${DIGESTS[0]}" >> "$GITHUB_OUTPUT"
          echo "Published digest: ${DIGESTS[0]}"

      # SMOKE THE PUBLISHED ARTIFACT, not the local one. The identity assertion (pulled ID equals the
      # tested ID) is the LOAD-BEARING check and is independent of runtime configuration; the label
      # and liveness legs are additive. If a leg ever proves fragile, weaken THAT leg — never the
      # identity assertion.
      #
      # The run configuration is what the shipped artifact genuinely requires, not an idealised
      # one-liner: sheriff.config.dir is relative and resolves inside the image, so the container
      # FAILS FAST without a mounted configuration directory; the IT gateway.yaml declares
      # tls.passthrough_sni, so the SNI front listener owns 8443 and the terminated listener must be
      # moved to 8444 or the two collide; and management is HTTPS once the certificate pair is
      # supplied, so the probe speaks TLS. The mounted material is the workspace fixture the
      # integration-test run above already used — no new fixture is introduced.
      #
      # The probe is the management interface's /health/live, not its aggregate /health, and it is
      # composed beneath MANAGEMENT_CONTEXT_PATH (declared at the top of this workflow) so the
      # reasoning below survives an image built at a non-root management path rather than being tied
      # to the default spelling. The aggregate readiness endpoint includes JWKS readiness against the
      # IT Keycloak, which is not running in this single-container smoke. Liveness is what this step
      # can honestly assert — the published artifact boots and serves its management interface over
      # TLS.
      - name: Smoke the published image by digest
        env:
          IMAGE_ID: ${{ steps.image.outputs.id }}
          RELEASED_VERSION: ${{ steps.config.outputs.current-version }}
          DIGEST: ${{ steps.digest.outputs.value }}
          TAG_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          REF="ghcr.io/cuioss/api-sheriff@${DIGEST}"

          # Drop every local reference so the pull genuinely reaches the registry.
          docker rmi "ghcr.io/cuioss/api-sheriff:${RELEASED_VERSION}" "ghcr.io/cuioss/api-sheriff:sha-${TAG_SHA}"
          docker pull "$REF"

          PULLED_ID="$(docker image inspect --format '{{.Id}}' "$REF")"
          if [ "$PULLED_ID" != "$IMAGE_ID" ]; then
            echo "::error::Published image is not the tested image: pulled ${PULLED_ID}, tested ${IMAGE_ID}."
            exit 1
          fi

          PULLED_VERSION="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$REF")"
          if [ "$PULLED_VERSION" != "$RELEASED_VERSION" ]; then
            echo "::error::Published image label org.opencontainers.image.version='${PULLED_VERSION}' but the released version is '${RELEASED_VERSION}'."
            exit 1
          fi

          PULLED_REVISION="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$REF")"
          if [ "$PULLED_REVISION" != "$TAG_SHA" ]; then
            echo "::error::Published image label org.opencontainers.image.revision='${PULLED_REVISION}' but the release-tag commit is '${TAG_SHA}'."
            exit 1
          fi

          CERTS="${GITHUB_WORKSPACE}/integration-tests/src/main/docker/certificates"
          CONFIG="${GITHUB_WORKSPACE}/integration-tests/src/main/docker/sheriff-config"
          docker run -d --name api-sheriff-smoke -p 19000:9000 \
            -v "${CERTS}:/app/certificates:ro" \
            -v "${CONFIG}:/app/sheriff-config:ro" \
            -e QUARKUS_PROFILE=it \
            -e SHERIFF_CONFIG_DIR=/app/sheriff-config \
            -e QUARKUS_CONFIG_LOCATIONS=/app/certificates/benchmark-idp-trust.properties \
            -e QUARKUS_HTTP_SSL_PORT=8444 \
            -e QUARKUS_HTTP_SSL_CERTIFICATE_FILES=/app/certificates/localhost.crt \
            -e QUARKUS_HTTP_SSL_CERTIFICATE_KEY_FILES=/app/certificates/localhost.key \
            -e QUARKUS_MANAGEMENT_SSL_CERTIFICATE_FILES=/app/certificates/localhost.crt \
            -e QUARKUS_MANAGEMENT_SSL_CERTIFICATE_KEY_FILES=/app/certificates/localhost.key \
            -e QUARKUS_TLS_DEFAULT_TRUST__STORE_P12_PATH=/app/certificates/localhost-truststore.p12 \
            -e QUARKUS_TLS_DEFAULT_TRUST__STORE_P12_PASSWORD=localhost-trust \
            -e OIDC_CLIENT_SECRET=smoke \
            "$REF"

          for _ in $(seq 1 60); do
            if curl -fsSk "https://127.0.0.1:19000${MANAGEMENT_CONTEXT_PATH}/health/live" > /dev/null; then
              echo "Published image is live."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Published image did not become live within 120s."
          docker logs api-sheriff-smoke
          exit 1

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # KEYLESS OIDC SIGNING, BY DIGEST — the last act of the lane, after the push and after the
      # smoke, so the signed artifact is provably the tested and published one. Never sign a tag: a
      # tag is a mutable pointer, so signing one signs nothing durable. The signature is stored in
      # the registry alongside the image (the Sigstore sha256-<digest>.sig convention); there is no
      # key store, no COSIGN_PRIVATE_KEY and no new secret. `id-token: write` is declared on this job.
      #
      # A CONSUMER VERIFIES WITH EXACTLY THESE TWO VALUES:
      #
      #   --certificate-oidc-issuer      https://token.actions.githubusercontent.com
      #   --certificate-identity-regexp  ^https://github\.com/cuioss/API-Sheriff/\.github/workflows/release\.yml@refs/heads/main$
      #
      # THE IDENTITY NAMES EXACTLY ONE REF. Fulcio puts the OIDC `job_workflow_ref` claim in the
      # certificate SAN. publish-image is a CALLER-LOCAL job — it does not `uses:` a reusable
      # workflow — so that claim names release.yml ITSELF (never the org reusable workflow) at the ref
      # the run was triggered on, i.e. GITHUB_REF. Only two events can reach this job, and BOTH of
      # them yield refs/heads/main — each one because the release job's `if:` or the trigger's own
      # filter refuses the alternative, never because the alternative is merely unlikely:
      #
      #   * workflow_dispatch -> GITHUB_REF = refs/heads/main. `workflow_dispatch:` carries no branch
      #     filter, so this is not a property of the trigger; the `github.ref == 'refs/heads/main'`
      #     operand on the release job above is what refuses a dispatch from any other ref, and it
      #     refuses it before the Maven release runs.
      #   * a MERGED-close .github/project.yml PR -> GITHUB_REF = refs/heads/main, the base branch it
      #     was merged INTO, which `branches: [main]` on the trigger confines to main. A close
      #     WITHOUT a merge never reaches here at all: the `merged == true` gate on the release job
      #     above refuses it before anything runs.
      #
      # THIS IS NOT ARGUED FROM DOCUMENTATION — IT IS READ OFF OUR OWN CERTIFICATES. Both signed
      # digests this project has ever published carry the same single ref in their SAN:
      #
      #   * 0.1.0 (sha256:937b3995...) — github_workflow_trigger = workflow_dispatch,
      #                                  job_workflow_ref = .../release.yml@refs/heads/main
      #   * 0.1.1 (sha256:dbd73c2e...) — github_workflow_trigger = pull_request,
      #                                  job_workflow_ref = .../release.yml@refs/heads/main
      #
      # 0.1.1 is the decisive one: a MERGE-triggered run that signed at refs/heads/main. No release
      # this project has cut has ever carried a merge-ref identity, so an accepted set widened to
      # admit one was widened for a ref that has never been used. GitHub's
      # events-that-trigger-workflows reference agrees — on a close-by-merge GITHUB_REF is the base
      # branch — but it is corroboration here, not the premise the identity rests on.
      #
      # The regexp is TIGHTLY ANCHORED, not a wildcard: anchored at both ends, bound to this exact
      # repository and this exact workflow file, and it admits that one ref and nothing else. Do NOT
      # relax it to a `.*` — a loose identity would accept a signature from any workflow in any
      # repository and the check would prove nothing.
      #
      # doc/user/container-image.adoc publishes the same two strings to operators, and the verify step
      # below RUNS them — the lane proves its own signing identity rather than asserting it in prose.
      #
      # SLSA provenance and any further attestation are deliberately out of scope.
      - name: Sign the published digest (keyless)
        env:
          DIGEST: ${{ steps.digest.outputs.value }}
        run: |
          cosign sign --yes "ghcr.io/cuioss/api-sheriff@${DIGEST}"

      # PROVE WHAT WAS JUST SIGNED. This is the step whose absence let the identity drift ship: the
      # lane signed, went green, and NOTHING ever asserted that the signature it had just produced was
      # acceptable to the verification command this project publishes. A release that signs under an
      # identity no operator command accepts is a supply-chain break that stays invisible until a
      # consumer hits it.
      #
      # So this step runs EXACTLY the two values doc/user/container-image.adoc gives operators,
      # against the digest just signed. If an operator's verification would fail, this job fails
      # first — before the release is called done.
      #
      # The bounded retry covers Rekor/Fulcio propagation ONLY. A wrong identity fails identically on
      # every attempt, so the retry cannot launder one into a pass; it just delays the loud failure by
      # under a minute.
      - name: Verify the signature under the published identity
        env:
          DIGEST: ${{ steps.digest.outputs.value }}
          IDENTITY_REGEXP: '^https://github\.com/cuioss/API-Sheriff/\.github/workflows/release\.yml@refs/heads/main$'
        run: |
          set -euo pipefail
          REF="ghcr.io/cuioss/api-sheriff@${DIGEST}"
          ATTEMPTS=5
          for attempt in $(seq 1 "$ATTEMPTS"); do
            if cosign verify \
              --certificate-identity-regexp "$IDENTITY_REGEXP" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$REF"; then
              echo "Signature verified under the published operator identity."
              exit 0
            fi
            if [ "$attempt" -lt "$ATTEMPTS" ]; then
              echo "Verification attempt ${attempt} failed; retrying in 10s (signature propagation)."
              sleep 10
            fi
          done
          echo "::error::cosign verify failed for ${REF} using the identity published in doc/user/container-image.adoc. The lane signed under an identity operators cannot verify — treat this as a supply-chain failure, not a flake."
          exit 1

      # `|| true` is a deliberate guard, not sloppiness: this step runs on EVERY outcome, including
      # the paths where the smoke step failed before `docker run` and there is nothing to remove.
      # A teardown must never turn an otherwise-diagnosed failure into a second, misleading one.
      - name: Tear down the smoke container
        if: always()
        run: |
          docker rm -f api-sheriff-smoke || true
