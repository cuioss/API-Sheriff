# Runs integration/E2E tests via Maven with report deployment to cuioss.github.io.
name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-tests:
    uses: cuioss/cuioss-organization/.github/workflows/reusable-maven-integration-tests.yml@014db4eafdf4e9d32c74a1dd0a3f945c72437b00 # v0.25.1
    with:
      # This job's own history sits at ~16 minutes (15m33s - 16m39s over the last
      # four green runs), against the reusable workflow's 20-minute default. ~20%
      # headroom means ordinary variance in the native build or container pull
      # cancels the job, which reads as a test failure rather than a timeout.
      timeout-minutes: 35
      report-name: integration-tests
      maven-args-input: |
        verify -Pintegration-tests -pl integration-tests -am
      reports-folder: |
        integration-tests/target/failsafe-reports
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
