# Runs integration/E2E tests via Maven with report deployment to cuioss.github.io.
name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-tests:
    uses: cuioss/cuioss-organization/.github/workflows/reusable-maven-integration-tests.yml@73712a12fb5a2694a77de397d0816b1200c57fbe # v0.41.0
    with:
      # This job's own history reached 34m36s on its last green run under the
      # previous 35-minute limit, and the first run of a tree with more suites was
      # cancelled at 35 minutes with every finished suite green. A limit that close
      # to the run time means ordinary variance in the native build or container
      # pull cancels the job, which reads as a test failure rather than a timeout.
      timeout-minutes: 60
      report-name: integration-tests
      maven-args-input: |
        install -DskipTests -DskipITs -pl integration-tests -am
        verify -Pintegration-tests -pl integration-tests
      reports-folder: |
        integration-tests/target/failsafe-reports
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
