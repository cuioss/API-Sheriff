# Runs integration/E2E tests via Maven with report deployment to cuioss.github.io.
name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-tests:
    uses: cuioss/cuioss-organization/.github/workflows/reusable-maven-integration-tests.yml@5a641e5da90ae209472419a541b7566bf7f4172e # v0.44.0
    with:
      # This job's own history reached 34m36s on its last green run under the
      # previous 35-minute limit, and the first run of a tree with more suites was
      # cancelled at 35 minutes with every finished suite green. A limit that close
      # to the run time means ordinary variance in the native build or container
      # pull cancels the job, which reads as a test failure rather than a timeout.
      timeout-minutes: 60
      report-name: integration-tests
      # The third line runs the deployment compose sample end to end, including a real login
      # through its BFF (deployment/compose-sample/scripts/check-bff-login.sh). It runs after the
      # integration suite has torn its stack down, so the sample's host ports 8443,
      # 127.0.0.1:9000 and 127.0.0.1:1443 are free again, and it reuses the native
      # api-sheriff:distroless image the integration build produced from this pull request's
      # source rather than the released image the sample pins in its .env.
      #
      # The fourth line runs the sample's /auth-fronted variant against the same image: the
      # gateway fronts Keycloak under /auth, Keycloak publishes no host port, and the login check
      # signs in through the IdP pages the gateway proxies (--idp-prefix /auth). It runs after the
      # base lane, whose success-path teardown has freed the host ports again; the variant's
      # explicit-subnet network is created fresh because that teardown removed the base network.
      #
      # The 60-minute limit above keeps headroom over the ~35-minute suite plus two sample
      # bring-ups and logins, a few minutes each.
      maven-args-input: |
        install -DskipTests -DskipITs -pl integration-tests -am
        verify -Pintegration-tests -pl integration-tests
        verify -Pcompose-sample -pl deployment -Dcompose-sample.image=api-sheriff:distroless
        verify -Pcompose-sample -pl deployment -Dcompose-sample.image=api-sheriff:distroless -Dcompose-sample.variant=auth-fronted
      reports-folder: |
        integration-tests/target/failsafe-reports
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
