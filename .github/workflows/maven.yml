# Configuration is read from .github/project.yml - no inputs needed!
# Path filtering is handled inside the reusable workflow via project.yml settings.
name: Maven Build

on:
  push:
    branches: [main, "feature/*", "fix/*", "chore/*", "release/*", "dependabot/**"]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    uses: cuioss/cuioss-organization/.github/workflows/reusable-maven-build.yml@937fbcf44d34d826b3bcd66d49d7a7d32030f39a # v0.18.0
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      OSS_SONATYPE_USERNAME: ${{ secrets.OSS_SONATYPE_USERNAME }}
      OSS_SONATYPE_PASSWORD: ${{ secrets.OSS_SONATYPE_PASSWORD }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  # EARLY-WARNING SUPPLY-CHAIN SIGNAL — deliberately NON-GATING, and deliberately NOT redundant with
  # the release lane's scan.
  #
  # This lane and the authoritative gate in release.yml are two distinct guarantees and neither is a
  # simplification of the other: this one is an early signal on EVERY change, the release lane is the
  # authoritative gate on the exact tested artifact before it is published. Do not fold them together.
  #
  # No `needs:` — the job neither delays nor is delayed by `build`, and no trigger changed.
  #
  # SCOPE: the pinned base image (by digest, read out of the Dockerfile rather than restated here)
  # plus a filesystem scan of the repository. It deliberately does NOT build the application image:
  # that would put a GraalVM native compile on every pull request, which is exactly the cost this
  # arrangement avoids. The proxy is not as weak as it looks — the release image is the same pinned
  # base plus one native executable carrying no package metadata and no jars, so a full app-image
  # scan would report the same package findings, and the `fs` scan is what actually surfaces Java
  # dependency CVEs.
  supply-chain-scan:
    name: Supply-chain scan (non-gating)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Read the pinned base image out of the Dockerfile rather than restating the digest here, so
      # this lane cannot silently drift from what the production image is actually built on.
      - name: Resolve the pinned base image
        id: base
        run: |
          BASE="$(awk '/^FROM /{print $2; exit}' api-sheriff/src/main/docker/Dockerfile.native)"
          case "$BASE" in
            *@sha256:*) ;;
            *) echo "::error::Base image in Dockerfile.native is not digest-pinned: '${BASE}'"; exit 1 ;;
          esac
          echo "image=${BASE}" >> "$GITHUB_OUTPUT"
          echo "Scanning pinned base image: ${BASE}"

      - name: Generate the SPDX SBOM for the pinned base image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.base.outputs.image }}
          format: spdx-json
          artifact-name: base-image-sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

      # `exit-code: 0` on EVERY Trivy step below is what makes this lane non-gating.
      # `continue-on-error` is deliberately NOT used: it would also mask a genuine tool or network
      # failure, whereas `exit-code: 0` suppresses only the vulnerability verdict. A broken scan step
      # must still turn the check red.
      #
      # Each target is scanned twice, once for the human summary and once for the SARIF artifact.
      # The second pass is seconds: the action restores the Trivy DB from cache, so only the report
      # rendering is repeated.
      - name: Scan the pinned base image (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.base.outputs.image }}
          exit-code: '0'
          format: table
          output: trivy-base-image.txt

      - name: Scan the pinned base image (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.base.outputs.image }}
          exit-code: '0'
          format: sarif
          output: trivy-base-image.sarif

      - name: Scan the repository filesystem (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          exit-code: '0'
          format: table
          output: trivy-filesystem.txt

      - name: Scan the repository filesystem (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          exit-code: '0'
          format: sarif
          output: trivy-filesystem.sarif

      # The base image reaches the shell through the environment, never through `${{ }}` expansion
      # inside the script body — expression interpolation into a run block is a script-injection sink.
      - name: Publish the scan reports to the job summary
        env:
          BASE_IMAGE: ${{ steps.base.outputs.image }}
        run: |
          {
            echo "## Supply-chain scan (non-gating)"
            echo
            echo "Findings below never fail this check. The authoritative gate runs in the release"
            echo "lane against the exact tested image, at HIGH and CRITICAL."
            echo
            echo "### Pinned base image — \`${BASE_IMAGE}\`"
            echo '```'
            cat trivy-base-image.txt
            echo '```'
            echo
            echo "### Repository filesystem"
            echo '```'
            cat trivy-filesystem.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the SARIF reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-sarif
          path: |
            trivy-base-image.sarif
            trivy-filesystem.sarif
          retention-days: 30
          if-no-files-found: error

  # OPENREWRITE DIRTY-TREE REPORT — deliberately NON-GATING.
  #
  # Three mechanisms in this repository mutate the working tree while the gate exits 0, and all three
  # are invisible in the build result by construction. They are documented in
  # doc/development/build-gate-discipline.adoc; this job is the only part of that story a machine can
  # carry, so it PRINTS what the rewriting gate changed and which recipe changed it, and never judges.
  #
  # `-Ppre-commit` IS LOAD-BEARING. The recipe list that reaches all three mechanisms is the
  # pre-commit profile's `activeRecipes` override in the root pom.xml. Without the profile,
  # `rewrite:run` reports `Using active recipe(s) []`, changes nothing, and this job becomes a false
  # green that appears to exonerate OpenRewrite. Do not "simplify" the profile away.
  #
  # No CI lane runs the rewriting gate today, so this job has to invoke it before it has a dirty tree
  # to report. That is CI time this repository did not previously spend; the invocation is kept to the
  # narrowest form that still produces all three mutations.
  #
  # DELIBERATE DIVERGENCE FROM ADR-0030, which holds that a repository invariant asserted only by an
  # explanatory comment becomes a positively-phrased, machine-checked fitness function. This lane is
  # deliberately NOT that shape. The tree is observed clean at the active recipes' fixed point today,
  # but that is an observation about the current tree and not a guarantee: a hard fail-on-dirty gate
  # would block every pull request from the moment any drift lands, including the ones that did not
  # cause it. So this job reports the dirty set and the OpenRewrite recipe attribution and leaves the
  # disposition to the author. It could be upgraded to ADR-0030's shape once the fixed point is HELD
  # rather than merely observed — i.e. once drift is caught and corrected by the change that
  # introduces it, so that "the tree is clean after the rewriting gate" is an invariant rather than a
  # blanket blocker.
  #
  # No `needs:` — patterned on supply-chain-scan above; the job neither delays nor is delayed by
  # `build`. It commits nothing and pushes nothing: the mutated tree exists only inside the runner.
  rewrite-report:
    name: OpenRewrite dirty-tree report (non-gating)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # `shell: bash` is required, not decorative: it selects `-eo pipefail`, whereas the default
      # `bash -e` leaves pipefail OFF and the `| tee` below would swallow a Maven failure. A genuine
      # gate or tooling failure must still turn this check red — only the DIRTY VERDICT is non-gating,
      # which is why `continue-on-error` is deliberately not used on this job or any of its steps.
      - name: Run the rewriting gate
        shell: bash
        run: |
          ./mvnw -B -ntp -Ppre-commit rewrite:run -DskipTests 2>&1 | tee rewrite-run.log

      # Report, without a verdict. Nothing here asserts cleanliness, so there is no `exit 1` path:
      # a dirty tree produces a longer summary and a green check, which is the whole point.
      - name: Publish the dirty-tree report to the job summary
        shell: bash
        run: |
          {
            echo "## OpenRewrite dirty-tree report (non-gating)"
            echo
            echo "The findings below NEVER fail this check. They record what the rewriting gate"
            echo "changed in the runner's working tree while exiting 0. See"
            echo "\`doc/development/build-gate-discipline.adoc\` for what to do about them."
            echo
            echo "### Working tree after the gate"
            echo '```'
            git status --porcelain
            echo '```'
            echo
            echo "### Recipe attribution"
            echo '```'
            awk '
              /Changes have been made to /            { show = 1; print; next }
              show && /^\[INFO\][[:space:]][[:space:]]+/ { print; next }
              show && /^[[:space:]][[:space:]]+/      { print; next }
                                                      { show = 0 }
            ' rewrite-run.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
