# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 1
    ignore:
      # Maven 3.10.0 produces a Central bundle that the Central Portal rejects for modules
      # excluded from publishing (it failed the cui-http 3.2 release, cuioss/cui-http#270). Stay on
      # 3.9.x until https://github.com/mavenplugins/central-publishing-maven-plugin/issues/78
      # is resolved.
      - dependency-name: "org.apache.maven:apache-maven"
        versions: [">= 3.10.0"]

  # Every `uses:` in .github/workflows is pinned to a full commit SHA — which is the right posture,
  # and is exactly why this entry is required rather than optional. A SHA pin is immutable, so it
  # does NOT pick up upstream security fixes the way a moving tag would: without an update lane the
  # pins silently rot, and the ones that rot are security-critical (harden-runner, trivy-action,
  # checkout, cosign-installer). Dependabot rewrites the SHA and the trailing `# vX.Y.Z` comment
  # together, so the pin stays readable.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3

  # The production image's base is digest-pinned in Dockerfile.native, and release.yml GATES every
  # release on a Trivy scan of it at HIGH+CRITICAL with `ignore-unfixed: false`. Without an update
  # lane the first unfixed CVE in that base blocks releases with no automation to relieve it, and
  # re-pinning becomes a manual scramble under time pressure. This entry keeps the base moving
  # ahead of the gate instead of behind it.
  - package-ecosystem: docker
    directory: "/api-sheriff/src/main/docker"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3

  # Keycloak, pinned by tag AND digest in both compose files, and only Keycloak: every other compose
  # image stays manually pinned. The integration-test stack and the compose sample each import a realm
  # into the same Keycloak, so the two pins must agree — one group moves both in a single PR, and
  # KeycloakImagePinWiringTest fails the build when they drift apart or this entry loses a directory.
  # The bump PR runs the integration suite, and that run is what verifies the new release.
  #
  # Who merges: a minor or patch bump is auto-merged by the org sweeper, and only once the required
  # `integration-tests / conclusion` check is green; a major bump is never auto-merged and needs a
  # human. Only `default-days`: the `semver-*-days` keys are rejected for the docker ecosystems, and
  # one rejected key invalidates the whole file and disables every update lane above.
  - package-ecosystem: docker-compose
    directories:
      - "/integration-tests"
      - "/deployment/compose-sample"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "quay.io/keycloak/keycloak"
    groups:
      keycloak:
        group-by: dependency-name
        patterns:
          - "quay.io/keycloak/keycloak"
    cooldown:
      default-days: 3
