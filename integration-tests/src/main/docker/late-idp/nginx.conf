# The LATE identity provider for JwksLateIdpReadinessIT (AS-10): a TLS proxy of the integration
# realm's JWKS path to the compose Keycloak.
#
# The test mounts this file as /etc/nginx/conf.d/default.conf of a one-off nginx container that it
# CREATES before the late gateway boots but STARTS only after it has observed the gateway's readiness
# DOWN. Until then the proxy's network alias does not resolve, every JWKS load attempt of the late
# gateway fails, and the gateway must report DOWN; once the proxy starts, the gateway's fast retry
# must load the key set and turn readiness UP without waiting for a refresh interval.
#
# Two networks, two names. On the test's dedicated network the container carries the alias
# `api-sheriff` — one of the three names the IT certificate's SAN list covers — and that is the host
# the late gateway's jwks.url names. The container is ALSO attached to the compose network, where
# `keycloak` resolves to the real compose Keycloak and to nothing else; the proxy deliberately does
# not carry a `keycloak` alias of its own, which could make it resolve its own upstream to itself.
#
# Nothing but the one JWKS path is proxied: the late gateway fetches exactly this document, and every
# other request is refused rather than handed to the IdP.
server {
    listen 8443 ssl;
    server_name api-sheriff;

    # The IT's self-signed localhost certificate (SAN: localhost, keycloak, api-sheriff), mounted
    # read-only from the committed certificates/ directory — the same material the gateways and
    # Keycloak serve, trusted by the gateway's benchmark-idp trust profile. No key material is minted
    # for this fixture.
    ssl_certificate     /etc/nginx/certificates/localhost.crt;
    ssl_certificate_key /etc/nginx/certificates/localhost.key;

    location = /realms/integration/protocol/openid-connect/certs {
        # Keycloak serves the same self-signed bundle; the upstream leg stays inside the test's own
        # networks, and what the test asserts is the GATEWAY's trust decision on the proxy leg.
        proxy_ssl_verify off;
        proxy_set_header Host keycloak:8443;
        proxy_pass https://keycloak:8443;
    }

    location / {
        return 404;
    }
}
