# yaml-language-server: $schema=../../../../../../api-sheriff/src/main/resources/schema/endpoint.schema.json
# The require:session protected upstream the server-mode BFF mediation suite targets.
# Anchored to the 'bff-session' anchor (type: bff, access: authenticated,
# auth: require: session) declared in gateway.yaml, so every route here inherits the
# session floor. It routes to the same go-httpbin echo backend the proxy suite uses
# (the UPSTREAM topology alias) so BffSessionMediationIT can observe exactly what the
# gateway forwarded: the mediated bearer the SessionAuthenticationStage injects from the
# stored session, and the ABSENCE of the browser session cookie upstream.
#
# FORWARD MODE — headers_allow is declared, so the header dimension resolves a POSITIVE-LIST
# (ADR-0036): only the named entries cross. The values are unchanged by the three-mode model
# and this route's effective posture is exactly what it always was.
#
# Authorization is listed to re-admit the CLIENT's inbound Authorization past the never-forward
# set — it is NOT what makes the mediated bearer reach the upstream, and the echo does not depend
# on it. ForwardPolicyStage merges the mediated bearer LAST, unconditionally and without
# consulting any forward list, overwriting whatever the mode copy forwarded; go-httpbin would
# echo it back with this entry absent. The entry is kept because it exercises the single
# re-admittable member of the never-forward set (ADR-0037) and pins that the mediated bearer
# still wins over a re-admitted client value. Cookie
# is NOT listed — but note that its absence from this list is not what withholds it. Cookie is
# an absolute member of the gateway-owned never-forward set (ADR-0037): no mode and no list
# re-admits it, so the browser session cookie would be stripped even on a route that named it
# or on one with no forward block at all. The two halves of the mediation proof therefore rest
# on the gateway's own set rather than on this route's diligence, which is the stronger claim.
endpoint:
  id: bff-session
  enabled: true
  base_url: UPSTREAM
  anchor: bff-session
  routes:
    - id: bff-session-mediated
      match:
        path_prefix: /bff-session
      forward:
        headers_allow: ["Authorization", "Content-Type"]
    # token_relay OPT-OUT (auth.token_relay: false). The login is still enforced exactly as on
    # bff-session-mediated — a navigation without a session is redirected to login, an XHR gets 401,
    # a live session is resolved and refreshed — but the gateway sets NO Authorization header
    # upstream, so the echo proves the origin never receives the session's access token.
    # BffSessionMediationIT asserts both halves against this route.
    #
    # The route-level auth block REPLACES the anchor's wholesale, so it restates require: session
    # (the anchor's session floor is kept, not weakened) and adds token_relay: false.
    #
    # headers_allow deliberately does NOT name Authorization, and cannot: ConfigValidator refuses at
    # boot a route whose effective token_relay is false while its forward.headers_allow names
    # Authorization (any letter case), because that list would re-admit the browser's own
    # Authorization header to an origin the route promises no token. The prefix nests under
    # /bff-session and is disjoint from bff-session-mediated by specificity.
    - id: bff-session-norelay
      match:
        path_prefix: /bff-session/norelay
      auth:
        require: session
        token_relay: false
      forward:
        headers_allow: ["Content-Type"]
