# yaml-language-server: $schema=../../../../../../api-sheriff/src/main/resources/schema/endpoint.schema.json
# Response-path acceptance endpoint exercised by RoutingAndResponseHeadersIT (and, for the
# origin-status route, HtmlErrorPageIT). Its proxy routes
# reach go-httpbin through the HTTPBIN_ROOT alias, which — unlike UPSTREAM — carries NO base path, so
# each route's upstream.path is the whole effective upstream base (ADR-0004 Amendment A2: alias base
# path + upstream.path + remainder-after-match-key, with an empty alias base).
#
# All routes ride the 'api' anchor (/proxy), so every response on them carries the anchor's
# security_headers block rather than the global one (ADR-0007 Amendment A1). The endpoint declares the
# require: none posture itself because the 'api' anchor is access: public and carries no auth block
# (ADR-0013).
#
# FORWARD POSTURE — no route declares a forward block, so all resolve forward-all on both
# dimensions: the query parameters that drive go-httpbin must cross unfiltered.
endpoint:
  id: origin-headers
  enabled: true
  base_url: HTTPBIN_ROOT
  anchor: api
  auth:
    require: none
  routes:
    # AS-8 precedence. go-httpbin's /response-headers echoes every query parameter back as a
    # RESPONSE header, so the IT makes the origin send its own X-Frame-Options and
    # Content-Security-Policy on demand and observes what survives the relay: the 'api' anchor
    # declares frame_deny in header_modes default (the origin value is kept) and
    # content_security_policy in the default set mode (the origin value is overwritten).
    - id: origin-headers
      match:
        path_prefix: /proxy/origin-headers
      upstream:
        path: /response-headers

    # AS-11 Location rewrite. go-httpbin's /redirect-to answers 302 with the Location named by its
    # `url` query parameter, so the IT drives both legs of the rewrite rule from one route: a Location
    # inside the effective upstream base (http://go-httpbin:8080/redirect-to/...) is mapped onto this
    # route's match key, a foreign absolute Location is relayed untouched.
    #
    # `url` carries a URL, and the strict baseline's url-parameter pipeline refuses a '/' inside a
    # parameter value, so this route opts into `profile: minimal` — the PARTIAL disable of exactly that
    # pipeline (ADR-0024). Every other control still applies: the pre-route floor (encoded separators,
    # the query-parameter count cap), the resolved body cap, and authentication. The route is public
    # and effectively unauthenticated, which is the only posture `minimal` boots under.
    - id: origin-location-rewrite
      match:
        path_prefix: /proxy/location-rewrite
      upstream:
        path: /redirect-to
        rewrite_location: true
      security_filter:
        profile: minimal

    # Relayed-origin-error control (HtmlErrorPageIT). go-httpbin's /status/{code} answers with the
    # status it is asked for, so /proxy/origin-status/503 reaches /status/503 and the origin itself
    # says 503. The IT asserts that such an ORIGIN error is relayed unchanged even to a browser
    # navigation: the status and body pass through, the 'api' anchor's policy (not the portal's) is
    # applied, and the error page's no-store is never imposed. The route must live here rather than on
    # httpbin.yaml's /proxy prefix route, whose UPSTREAM alias carries the /anything echo base and would
    # turn the same address into a 200 echo of /anything/status/503.
    - id: origin-status
      match:
        path_prefix: /proxy/origin-status
      upstream:
        path: /status

    # Header-discriminated route pairs (RoutingAndResponseHeadersIT). Each pair splits one prefix on
    # X-Sheriff-Variant: the present: true route answers requests carrying the header, the
    # present: false route answers requests without it. The validator certifies each pair as disjoint,
    # so the selected route must never depend on declaration order — and one prefix can hold only one
    # declaration order, hence two prefixes: present-first declares the present: true route first,
    # absent-first declares the present: false route first. The matcher name is written in mixed case
    # while the IT sends the header in a different letter case, so the pair also proves header names
    # match case-insensitively. Both routes reach go-httpbin's /anything echo, whose echoed url names
    # the upstream path and so reveals which route was selected.
    - id: header-order-present-first-with
      match:
        path_prefix: /proxy/header-order/present-first
        headers:
          - name: X-Sheriff-Variant
            present: true
      upstream:
        path: /anything/header-with

    - id: header-order-present-first-without
      match:
        path_prefix: /proxy/header-order/present-first
        headers:
          - name: X-Sheriff-Variant
            present: false
      upstream:
        path: /anything/header-without

    - id: header-order-absent-first-without
      match:
        path_prefix: /proxy/header-order/absent-first
        headers:
          - name: X-Sheriff-Variant
            present: false
      upstream:
        path: /anything/header-without

    - id: header-order-absent-first-with
      match:
        path_prefix: /proxy/header-order/absent-first
        headers:
          - name: X-Sheriff-Variant
            present: true
      upstream:
        path: /anything/header-with
