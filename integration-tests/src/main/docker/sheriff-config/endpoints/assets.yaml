# yaml-language-server: $schema=../../../../../../api-sheriff/src/main/resources/schema/endpoint.schema.json
# Public asset endpoint (ADR-0014) exercised by DirectoryAssetServingIT and
# UpstreamAssetServingIT. It carries three asset terminal-action routes under the
# 'assets-public' anchor (/assets, access: public):
#
#   * /assets/static/*  -> source: directory, root /app/assets (the read-only
#     volume mount). The gateway confines the request sub-path under the root and
#     serves the file through the response envelope.
#   * /assets/cdn/*     -> source: upstream, alias ASSET_ORIGIN (the secondary
#     static server 'asset-origin'). The gateway fetches the confined remainder over
#     the same SSRF-controlled egress the proxy uses and re-serves it under
#     gateway-owned response governance.
#   * /assets/demo/*    -> source: directory, root /app/demo (the read-only bind
#     mount of demo-client/src/main/resources/spa). Serves the demo SPA and its
#     post-logout landing page same-origin with the reserved /auth paths, which is
#     what makes the browser-facing BFF contract observable at all.
#
# This file is mounted into ALL SIX gateway instances, four of which overlay only
# gateway.yaml. The demo route therefore reuses the EXISTING 'assets-public' anchor
# rather than declaring a new one: a new anchor would have to be added to all four
# gateway.yaml documents or those overlays would boot-fail on a route resolving to an
# undeclared anchor. The four instances that do not mount /app/demo are unaffected --
# ConfigValidator.validateAssetSource requires only that 'directory' be PRESENT and
# performs no filesystem existence check, so they boot unchanged and DirectoryAssetSource
# answers 404 on that path.
#
# base_url is mandatory on every endpoint; an asset route never proxies to it, so it
# points at the same resolvable UPSTREAM alias the proxy endpoints use and is unused.
# The endpoint declares require: none because the 'assets-public' anchor is
# access: public and carries no auth block (ADR-0013).
endpoint:
  id: assets
  enabled: true
  base_url: UPSTREAM
  anchor: assets-public
  auth:
    require: none
  routes:
    - id: assets-directory
      anchor: assets-public
      match:
        path_prefix: /assets/static
      asset:
        source: directory
        directory: /app/assets
    - id: assets-upstream
      anchor: assets-public
      match:
        path_prefix: /assets/cdn
      asset:
        source: upstream
        upstream: ASSET_ORIGIN
    # The demo SPA (demo-client module, authored by plan-11 deliverable 4). The same route
    # also serves the post-logout landing page at /assets/demo/landing.html, so the landing
    # target needs no second route, no second anchor and no second mount. Note that
    # DirectoryAssetSource performs NO directory-index resolution: /assets/demo/ without a
    # filename returns 404, which is why every entry point names a concrete file.
    - id: assets-demo
      anchor: assets-public
      match:
        path_prefix: /assets/demo
      asset:
        source: directory
        directory: /app/demo
