# Topology aliases for the mounted integration configuration.
#
# UPSTREAM is the go-httpbin echo backend, reached by the gateway on the internal
# compose network. Its /anything/* endpoint echoes the received request as JSON so
# the proxy ITs can assert exactly what was forwarded.
#
# The value uses the ADR-0004 Amendment A1 in-file placeholder form: EnvSecretResolver
# substitutes only explicit ${VAR} / ${VAR:-default} placeholders written here — there is
# NO convention-named TOPOLOGY_<ALIAS> environment precedence path, so an env variable
# binds if and only if this file names it. The default keeps the IT stack on go-httpbin
# (it sets no TOPOLOGY_UPSTREAM, and the proxy ITs assert go-httpbin's JSON echo); the
# benchmark overlay sets TOPOLOGY_UPSTREAM=http://nginx-static:8080 to repoint it.
UPSTREAM=${TOPOLOGY_UPSTREAM:-http://go-httpbin:8080/anything}

# ASSET_ORIGIN is the secondary static server ('asset-origin', nginx) that backs the
# source: upstream asset route (/assets/cdn). The gateway fetches confined assets from
# it over the fixed-topology, SSRF-controlled egress and re-serves them under the
# gateway-owned response envelope. Reached on the internal compose network by service
# name; it publishes no host port.
ASSET_ORIGIN=http://asset-origin:80

# WS_UPSTREAM is the go-httpbin WebSocket echo endpoint, reached by the gateway on the
# internal compose network. go-httpbin serves a bidirectional echo at /websocket/echo, so
# every WebSocket integration-test route relays to this one upstream path — the alias carries
# the full /websocket/echo base path and each WS route's match prefix maps to the empty
# remainder, so the relay dials ws://go-httpbin:8080/websocket/echo. WebSocketProxyIT exercises
# the opaque relay (echo round-trip, Origin gate, idle reclaim) against it.
WS_UPSTREAM=http://go-httpbin:8080/websocket/echo

# PASSTHROUGH_BACKEND / PASSTHROUGH_FAULT back the accept-time SNI passthrough split
# (tls.passthrough_sni in gateway.yaml). The opaque L4 relay dials these targets over plain
# TCP — it never speaks TLS itself — so only host:port is used; the https scheme keeps the
# URL well-formed and the origin base-path-free (ConfigValidator.validatePassthroughAliasResolvable
# rejects a passthrough alias that resolves to a non-root base path).
#   - PASSTHROUGH_BACKEND: the TLS-enabled passthrough-backend (nginx, CN=passthrough-backend)
#     reached directly on the compose network; TlsPassthroughIT asserts the peer certificate it
#     negotiates through the relay is the backend's, proving the gateway never terminated it.
#   - PASSTHROUGH_FAULT: the same backend reached via Toxiproxy's listen endpoint (toxiproxy:8666);
#     PassthroughFaultIT creates that proxy at test time and injects a reset_peer toxic to prove
#     the relay tears the client leg down promptly (abort) rather than hanging.
PASSTHROUGH_BACKEND=https://passthrough-backend:8443
PASSTHROUGH_FAULT=https://toxiproxy:8666

# GRPC_ECHO is the in-repo Quarkus gRPC echo upstream (grpc-echo:9000, plaintext h2c —
# the gateway's forced-h2 client speaks prior-knowledge h2c to the http-scheme target). The
# alias carries no base path: each gRPC route matches a bare service path
# (/{package}.Echo for the public route, /{package}.SecureEcho for the bearer route) and sets an
# identical upstream.path, so the full gRPC method path (/{package}.{Service}/{Method}) is preserved
# end-to-end to the upstream. GrpcProxyIT relays unary / server-streaming / failing calls through
# the gateway against it (and drives the bearer route's rejection path, which never reaches upstream).
GRPC_ECHO=http://grpc-echo:9000
