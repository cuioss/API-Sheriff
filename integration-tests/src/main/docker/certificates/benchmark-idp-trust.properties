# Deployment-supplied trust material for the `benchmark-idp` TLS profile.
#
# gateway.yaml names only the LOGICAL profile, through two keys: `jwks.tls_profile: benchmark-idp`
# selects it for the JWKS fetch and `egress_tls.oidc_tls_profile: benchmark-idp` selects it for the
# BFF OIDC back-channel. This file is where that name is bound to concrete trust material. It lives
# with the deployment, not in the shipped api-sheriff artifact: the benchmark/integration Keycloak
# serves a self-signed localhost certificate, so both clients must trust the same store the rest of
# this stack mounts. Without the binding the JWKS fetch fails PKIX path building and every bearer
# request is rejected 401; the back-channel fails the same way and every BFF login fails.
#
# It sits in the already-mounted certificates/ directory beside the material it references, so the
# integration-test topology adds no new volume — the mounted-material set is still exactly three
# (certificates, sheriff-config, assets). It is deliberately NOT under sheriff-config/, which is API
# Sheriff's own configuration-language directory; these are raw Quarkus keys, not gateway.yaml.
#
# The keys are UNPREFIXED. They are loaded by QUARKUS_CONFIG_LOCATIONS on the twelve QUARKUS_PROFILE=it
# gateway services, so no %-profile branch is needed here and none may be added — the shipped
# artifact carries no benchmark-idp key at all, in any profile, and production names no such profile.
quarkus.tls.benchmark-idp.trust-store.p12.path=/app/certificates/localhost-truststore.p12
quarkus.tls.benchmark-idp.trust-store.p12.password=localhost-trust
