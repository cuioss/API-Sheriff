# Deployment-supplied trust material for the `it-upstream` TLS profile.
#
# gateway.yaml names only the LOGICAL profile (`egress_tls.upstream_tls_profile: it-upstream`); this
# file is where that name is bound to concrete trust material, exactly as benchmark-idp-trust.properties
# does for the JWKS side. ADR-0011's boundary rule is the same on both surfaces: the gateway document
# names intent, the deployment supplies the material.
#
# The bound store holds ONLY the hostname-mismatched upstream certificate, and that narrowness is the
# point rather than an economy. A named profile's anchors REPLACE a client's trust rather than adding
# to it, so this store is exactly the set the egress clients may verify terminated upstreams against.
# Because the mismatched-tls-backend certificate IS in it, chain trust succeeds on both legs of the
# egress control — which leaves the hostname check as the only variable between the verify-on and
# verify-off instances. Were the chain untrusted, the verify-on leg would fail for two reasons at once
# and would prove neither.
#
# It sits in the already-mounted certificates/ directory beside the material it references, so the
# integration-test topology adds no new volume — the mounted-material set is still exactly three
# (certificates, sheriff-config, assets). It is deliberately NOT under sheriff-config/, which is API
# Sheriff's own configuration-language directory; these are raw Quarkus keys, not gateway.yaml.
#
# The keys are UNPREFIXED, on the same reasoning as benchmark-idp-trust.properties: they are loaded by
# QUARKUS_CONFIG_LOCATIONS on the two QUARKUS_PROFILE=it gateway services that name this profile, so no
# %-profile branch is needed here and none may be added — the shipped artifact carries no it-upstream
# key at all, in any profile, and production names no such profile.
#
# Unlike benchmark-idp-trust.properties, this file is loaded by only TWO of the nine gateway instances
# (api-sheriff-egress-verify-on and api-sheriff-egress-verify-off). The other seven name no
# upstream_tls_profile, so they never reach the resolver and keep the JVM default trust store.
quarkus.tls.it-upstream.trust-store.p12.path=/app/certificates/upstream-truststore.p12
quarkus.tls.it-upstream.trust-store.p12.password=upstream-trust
