# yaml-language-server: $schema=../../../../../api-sheriff/src/main/resources/schema/gateway.schema.json
# Global gateway document for the DEDICATED mTLS integration-test instance (api-sheriff-mtls in
# docker-compose.yml). It is overlay-mounted on top of the shared sheriff-config directory so it
# replaces ONLY gateway.yaml — the endpoints/ subdirectory and topology.properties are shared with
# the primary instance, keeping the two documents in lockstep except for their tls block.
#
# This instance exists because mTLS is a property of the single terminated Quarkus HTTPS listener:
# switching it to require-and-verify would break every existing terminated IT on the primary
# instance (they make plain HTTPS calls with no client cert). So the require-client-cert behaviour
# (GW-06 / D2) is proven on this separate listener, published on host port 10444, while the primary
# instance (10443) stays terminated-without-mtls for the rest of the suite.
#
# The anchors and token_validation block are a faithful copy of the primary gateway.yaml so the
# shared endpoints/ resolve identically and the offline it-static JWKS issuer reaches readiness
# without Keycloak. The ONLY intentional difference is the tls block: no passthrough_sni here (the
# SNI front never starts, so Quarkus terminates directly on the public port), and tls.mtls enabled.
version: 1
metadata:
  config_version: "integration-test-mtls"
allowed_methods: ["GET", "POST", "PUT", "DELETE"]
tls:
  alpn: ["h2", "http/1.1"]
  # Require-and-verify client certificates on the terminated listener (tls/MtlsServerCustomizer).
  # client_ca is the PEM trust anchor the client certificate must chain to; it is mounted read-only
  # into the container at /app/certificates/mtls-client-ca.crt (see the certificates volume). A
  # client presenting no certificate, or one signed by a CA this anchor does not trust, is rejected
  # at the TLS handshake — never as an HTTP status. The anchor deliberately trusts ONLY the
  # mtls-client CA, so MtlsHandshakeIT's wrong-CA identity (mtls-wrong.p12) is rejected.
  mtls:
    enabled: true
    client_ca: /app/certificates/mtls-client-ca.crt
anchors:
  api:
    path_prefix: /proxy
    type: proxy
    access: public
  web:
    path_prefix: /web
    type: proxy
    access: public
  # Server-mode BFF session namespace exercised by the Bff*IT suite. A require:session
  # route lives here so an authenticated browser session mediates a bearer to the
  # go-httpbin echo upstream (BffSessionMediationIT). type: bff forces access:
  # authenticated (ADR-0013), and the session floor is backed by the global oidc block
  # below (ConfigValidator rejects a session floor with no oidc block). The reserved
  # OIDC endpoints themselves are carved out of the route table on the oidc host and
  # live under /bff (see the oidc block), disjoint from this /app proxy prefix.
  app:
    path_prefix: /app
    type: bff
    access: authenticated
    auth:
      require: session
  secure:
    path_prefix: /secure
    type: proxy
    access: authenticated
    auth:
      require: bearer
  graphql:
    path_prefix: /graphql
    type: proxy
    access: public
    allowed_methods: ["POST"]
  upload:
    path_prefix: /upload
    type: proxy
    access: public
    allowed_methods: ["POST"]
    security_filter:
      max_body_bytes: 67108864
  ws:
    path_prefix: /ws
    type: proxy
    access: public
  grpc:
    path_prefix: /grpc
    type: proxy
    access: public
  assets-public:
    path_prefix: /assets
    type: asset
    access: public
    allowed_methods: ["GET", "HEAD"]
  assets-secure:
    path_prefix: /secure-assets
    type: asset
    access: authenticated
    allowed_methods: ["GET", "HEAD"]
    auth:
      require: bearer
token_validation:
  issuers:
    - name: it-static
      issuer: https://api-sheriff.test/it
      jwks:
        source: file
        file: /app/certificates/test-jwks.json
    - name: benchmark-keycloak
      issuer: https://localhost:1443/realms/benchmark
      jwks:
        source: http
        url: https://keycloak:8443/realms/benchmark/protocol/openid-connect/certs
        allowed_egress_hosts: ["keycloak"]
        tls_profile: benchmark-idp
    # The server-mode BFF (oidc block below) validates the id/access tokens the
    # 'integration' realm mints for the browser session. The gateway's shared
    # @GatewayValidator TokenValidator is built from THIS token_validation block — not
    # from the token-sheriff extension's own sheriff.token.issuers.* property surface,
    # which this gateway leaves unconfigured and whose health probes it excludes — so the
    # integration issuer MUST be declared here or every mediated session token is rejected.
    # The issuer is the browser-facing identity https://localhost:1443 every realm token
    # carries; its key set is reached over the back channel, keycloak:8443 on the shared
    # api-sheriff network. It declares no egress list and relies on the allowance derived
    # from its jwks.url host, and uses the same self-signed trust profile as the benchmark issuer.
    - name: integration-keycloak
      issuer: https://localhost:1443/realms/integration
      jwks:
        source: http
        url: https://keycloak:8443/realms/integration/protocol/openid-connect/certs
        # allowed_egress_hosts omitted: the allowance is derived from the jwks.url host
        tls_profile: benchmark-idp
# --- Server-mode BFF confidential-client block (BFF-* integration suite) -----------
# Activates the server-mode BffRuntime (BffRuntimeProducer builds the active runtime
# only when a global oidc block declares session.mode=server AND a redirect_uri). The
# reserved OIDC endpoints are carved out of the route table exactly on the oidc host —
# the host of redirect_uri, i.e. 'localhost' — and matched by exact path, so they live
# under /bff and never collide with the /app proxy anchor above. Confidential client
# integration-client of the 'integration' realm, authenticated with private_key_jwt. The
# issuer is Keycloak's browser-facing identity (published port 1443); the gateway's own
# discovery, token and JWKS calls dial the same server over back_channel_origin, keycloak:8443
# on the compose network. OIDC discovery is lazy (first engine use), so boot needs no live IdP;
# the browser reaches this mTLS instance on its own published host port 10444.
oidc:
  issuer: https://localhost:1443/realms/integration
  back_channel_origin: https://keycloak:8443
  client_id: integration-client
  # The same two key files as the primary gateway.yaml, which carries the explanation: the
  # client-authentication key by literal path, the DPoP proof key through ${OIDC_DPOP_KEY_FILE}.
  # This instance holds the key the primary instance publishes at /bff/jwks, so the realm
  # client's one jwks.url covers it.
  client_authentication:
    key_file: /app/signing-keys/client-auth-rsa.pem
  sender_constraint:
    key_file: ${OIDC_DPOP_KEY_FILE}
  scopes: ["openid", "profile", "email"]
  # Full browser-facing callback URL. Its host ('localhost') is the oidc host every
  # reserved path binds to; its origin ('https://localhost:10444') is the gateway
  # origin used for same-origin return-URL validation and the default CSRF trusted origin.
  redirect_uri: https://localhost:10444/bff/callback
  logout:
    path: /bff/logout
    post_logout_redirect_uri: https://localhost:10444/bff/logout/return
    final_redirect: /
    backchannel_path: /bff/backchannel
  session:
    mode: server
    store: memory
    ttl_seconds: 3600
    refresh:
      enabled: true
      leeway_seconds: 30
    csrf:
      trusted_origins: ["https://localhost:10444"]
  user_info:
    path: /bff/session
    allowed_claims: ["sub", "preferred_username", "email", "groups"]
    default_view: ["sub", "preferred_username"]
  login:
    path: /bff/login
# --- Trust for the BFF OIDC back-channel -------------------------------------------------------
# Binds the BFF back-channel — the calls the oidc block above makes to Keycloak — to the trust
# profile the JWKS issuers already name through jwks.tls_profile. Last block of the document on
# purpose: declared-limit-assertion-coverage.adoc cites keys of this file by line number, and a
# block inserted above them would shift every citation.
egress_tls:
  oidc_tls_profile: benchmark-idp
