# yaml-language-server: $schema=../../../../../api-sheriff/src/main/resources/schema/gateway.schema.json
# Global gateway document of the TLS-RELAXATION fixture, mounted by BffTlsRelaxationIT over the shared
# sheriff-config directory of a one-off gateway. No compose service loads it.
#
# THIS IS THE SINGLE DESCRIPTOR OF THE STACK THAT DECLARES A HOSTNAME RELAXATION, AND THE SINGLE ONE
# EXEMPT FROM THE TRUST-PROFILE GUARD. It declares egress_tls.oidc_verify_hostname: false and
# egress_tls.jwks_verify_hostname: false, and it names NO trust profile on either leg — no
# egress_tls.oidc_tls_profile and no jwks.tls_profile on any issuer — because the gateway refuses a
# hostname relaxation together with a named profile at boot (ADR-0041, ADR-0045). Both legs therefore
# verify the identity provider's chain against the JVM default trust store, which the test supplies on
# the gateway's command line.
#
# ItProfileConfigBindingWiringTest is the guard that exempts it: everyBffDescriptorNamesTheOidcTrustProfile
# skips exactly this file, after asserting that it exists, declares an oidc block, declares
# oidc_verify_hostname: false and names no oidc_tls_profile. Every other descriptor stays under that
# guard unchanged. Do not copy this posture into another descriptor.
#
# It is built on the shape of sheriff-config-refresh/gateway.yaml — server mode, refresh-client
# authenticating with its client secret, refresh enabled — and differs from it in exactly this:
#   * the egress_tls block, as described above;
#   * no jwks.tls_profile on the two http-sourced issuers;
#   * the gateway origin, on the fixed host port 10463;
#   * security_defaults does not declare allow_get_with_content_length_body. Only the enumerated base
#     copies activate that opt-in (GetWithBodyActivationWiringTest), and this fixture exercises no GET
#     body, so it keeps the strict default;
#   * metadata.config_version, a label.
# The blocks it shares with that document carry their explanation there and in the base document.
version: 1
metadata:
  config_version: "integration-test-tls-relaxation"
allowed_methods: ["GET", "POST", "PUT", "DELETE"]
# `max_authorization_header_value_length` is kept at the base document's value: a Keycloak-minted
# access token plus the `Bearer ` prefix measures above the strict preset's 1024-character header-value
# cap, and this fixture drives both a presented and a mediated bearer through the pre-route floor.
security_defaults:
  profile: strict
  max_authorization_header_value_length: 8192
tls:
  min_version: "1.2"
  cipher_suites:
    - TLS_AES_256_GCM_SHA384
    - TLS_AES_128_GCM_SHA256
    - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
    - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
  alpn: ["h2", "http/1.1"]
asset_defaults:
  content_types:
    webmanifest: application/manifest+json
security_headers:
  hsts:
    max_age: 31536000
    include_subdomains: true
  cors:
    enabled: true
    allowed_origins: ["https://sheriff.test"]
    allowed_methods: ["GET", "POST"]
    allowed_headers: ["authorization", "content-type"]
    allow_credentials: false
# The anchor set of the base document, unchanged: the shared endpoints directory this descriptor is
# mounted beside names every one of these anchors.
anchors:
  api:
    path_prefix: /proxy
    type: proxy
    access: public
    security_headers:
      frame_deny: true
      content_security_policy: "default-src 'self'"
      header_modes:
        frame_deny: default
  bff:
    path_prefix: /bff
    type: proxy
    access: public
  bff-session:
    path_prefix: /bff-session
    type: bff
    access: authenticated
    auth:
      require: session
  secure:
    path_prefix: /secure
    type: proxy
    access: authenticated
    auth:
      require: bearer
  graphql:
    path_prefix: /graphql
    type: proxy
    access: public
    allowed_methods: ["POST"]
  upload:
    path_prefix: /upload
    type: proxy
    access: public
    allowed_methods: ["POST"]
    security_filter:
      max_body_bytes: 67108864
  ws:
    path_prefix: /ws
    type: proxy
    access: public
  grpc:
    path_prefix: /grpc
    type: proxy
    access: public
  assets-public:
    path_prefix: /assets
    type: asset
    access: public
    allowed_methods: ["GET", "HEAD"]
  assets-secure:
    path_prefix: /secure-assets
    type: asset
    access: authenticated
    allowed_methods: ["GET", "HEAD"]
    auth:
      require: bearer
token_validation:
  issuers:
    - name: it-static
      issuer: https://api-sheriff.test/it
      jwks:
        source: file
        file: /app/certificates/test-jwks.json
    # NO jwks.tls_profile on either http-sourced issuer below: with egress_tls.jwks_verify_hostname
    # false, a named profile is refused at boot. The key set is fetched over the JVM default trust
    # store. 'keycloak' is the name the test's TLS proxy answers under on its dedicated network.
    - name: benchmark-keycloak
      issuer: https://keycloak:8443/realms/benchmark
      jwks:
        source: http
        url: https://keycloak:8443/realms/benchmark/protocol/openid-connect/certs
        # The explicit-list-wins form, as in the base document: exactly the host of jwks.url.
        allowed_egress_hosts: ["keycloak"]
    - name: integration-keycloak
      issuer: https://keycloak:8443/realms/integration
      jwks:
        source: http
        url: https://keycloak:8443/realms/integration/protocol/openid-connect/certs
        # allowed_egress_hosts omitted: the allowance is derived from the jwks.url host
oidc:
  issuer: https://keycloak:8443/realms/integration
  client_id: refresh-client
  client_secret: ${OIDC_CLIENT_SECRET}
  sender_constraint:
    key_file: ${OIDC_DPOP_KEY_FILE}
  scopes: ["openid", "profile", "email"]
  redirect_uri: https://localhost:10463/auth/callback
  logout:
    path: /auth/logout
    post_logout_redirect_uri: https://localhost:10463/auth/logout/return
    final_redirect: /assets/demo/landing.html
    backchannel_path: /auth/backchannel
  session:
    mode: server
    store: memory
    ttl_seconds: 3600
    refresh:
      enabled: true
      leeway_seconds: 30
    csrf:
      trusted_origins: ["https://localhost:10463"]
  user_info:
    path: /auth/userinfo
    allowed_claims: ["sub", "preferred_username", "email", "groups"]
    default_view: ["sub", "preferred_username"]
  login:
    path: /auth/login
# --- The relaxation this fixture exists for ----------------------------------------------------
# Hostname MATCHING is switched off on the two back-channel legs to the identity provider: the JWKS
# fetch and the BFF OIDC back-channel (discovery, the pushed authorization request, the code exchange,
# refresh, revocation). Chain trust is NOT relaxed by either key — a certificate the JVM default trust
# store does not hold is still refused, which BffTlsRelaxationIT pins as its own leg.
# upstream_verify_hostname is not declared and keeps its default, true. Last block of the document,
# as in every sibling descriptor.
egress_tls:
  oidc_verify_hostname: false
  jwks_verify_hostname: false
