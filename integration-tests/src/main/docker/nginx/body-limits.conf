# Body-size and lingering-close settings for the static benchmark backend
# (nginx-static), included into nginx's http context via /etc/nginx/conf.d/.
#
# Contract: this backend must NEVER be the component that rejects or severs a
# benchmark upload. The gateway's per-route max_body_bytes is the only cap under
# measurement — a backend-side rejection would measure a failure path (which is
# faster than a transfer path) and report flatteringly good numbers.
#
# client_max_body_size 0 removes any nginx-side ceiling. Note it is INERT for the
# current `return 200` location: nginx evaluates the directive inside its request-body
# reader, which a return-handled location never invokes. It is declared anyway so the
# contract stays correct if that location ever gains a body-reading handler.
#
# The lingering settings are the operative half. Because the backend answers before the
# transfer completes, nginx drains the remaining body under lingering_close; the defaults
# (5s timeout, 16k) are sized for small bodies and would reset a 50 MB uploadLarge aspect
# mid-transfer. The values below give that aspect room to drain cleanly.
client_max_body_size 0;

lingering_close always;
lingering_time 120s;
lingering_timeout 30s;
