# Body-size and lingering-close settings for the static benchmark backend
# (nginx-static), included into nginx's http context via /etc/nginx/conf.d/. The same
# file is mounted into early-answer-backend, which shares nginx-static.conf.
#
# Contract: this backend must NEVER be the component that rejects or severs a
# benchmark upload. The gateway's per-route max_body_bytes is the only cap under
# measurement — a backend-side rejection would measure a failure path (which is
# faster than a transfer path) and report flatteringly good numbers.
#
# client_max_body_size 0 removes any nginx-side ceiling. It is OPERATIVE for the upload
# location in nginx-static.conf: that location reads the whole body before it answers, and
# nginx evaluates the directive inside its request-body reader, so without this line a 50 MB
# uploadLarge body would be refused with 413 at the default 1 MB ceiling. It is still INERT
# for the remaining `return 200` location, which never invokes the body reader.
#
# The lingering settings cover the paths that answer before the transfer completes: every
# path except the two upload paths, which is what early-answer-backend serves. There nginx
# drains the unread remainder under lingering_close; the defaults (5s timeout, 16k) are sized
# for small bodies and would reset a large body mid-transfer. The values below give such a
# body room to drain cleanly. The upload paths answer only after the last body byte has
# arrived, so they leave nothing to drain.
client_max_body_size 0;

lingering_close always;
lingering_time 120s;
lingering_timeout 30s;
