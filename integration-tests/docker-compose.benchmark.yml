# Benchmark-only overlay (merged on top of docker-compose.yml).
# Adds the fast static nginx backend and repoints the gateway's proxy upstream
# at it, so the proxied-static benchmark measures proxy overhead without a
# JSON-serializing backend (go-httpbin) polluting the numbers.
services:
  nginx-static:
    # Pinned by CONTENT DIGEST, not by tag. This is the FAIRNESS BACKEND the cross-gateway
    # comparison rides, so the baseline the benchmark measures against has to be byte-identical
    # between runs; an upstream image that changes underneath makes two runs incomparable without
    # anything announcing it. A minor-line tag like `1.27-alpine` does NOT deliver that — it stays
    # mutable, and every 1.27.x patch republish silently moves it. The digest below is the
    # multi-platform manifest-list (index) digest, so amd64 and arm64 runners both resolve from it.
    # The tag is kept alongside purely for human readability; the digest is what binds.
    #
    # deployment/compose-sample/docker-compose.yml deliberately stays on the readable minor tag and
    # is expected to differ from this file: an operator sample wants readability and automatic
    # patch pickup, a fairness backend wants reproducibility. The two are different on purpose.
    #
    # To move the pin: `docker buildx imagetools inspect nginx:<tag>` and copy the top-level Digest.
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    ports:
      - "18081:8080"  # published only for the host-side readiness probe
    volumes:
      - ./nginx/nginx-static.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src/main/docker/nginx/body-limits.conf:/etc/nginx/conf.d/00-body-limits.conf:ro
    networks:
      - api-sheriff
    restart: unless-stopped

  api-sheriff:
    environment:
      # Repoint the UPSTREAM topology alias (go-httpbin) at the static backend for
      # benchmarks. This binds to the explicit ${TOPOLOGY_UPSTREAM:-...} placeholder
      # written in topology.properties — EnvSecretResolver substitutes only in-file
      # placeholders, and there is no TOPOLOGY_<ALIAS> precedence mechanism. The
      # mounted config is reused unchanged; unset, the placeholder's default keeps
      # the IT stack on go-httpbin.
      - TOPOLOGY_UPSTREAM=http://nginx-static:8080
    depends_on:
      - nginx-static

  # The empty-passthrough_sni arm is compared against the primary instance's proxiedStatic baseline,
  # so it must be repointed at the SAME static backend. This is the ADR-0012 "identical upstreams"
  # parity precondition: leaving this instance on go-httpbin while the primary serves from
  # nginx-static would fold the JSON-serializing backend's cost into one side of the comparison only,
  # and the resulting difference would be read as passthrough overhead.
  api-sheriff-passthrough-empty:
    environment:
      - TOPOLOGY_UPSTREAM=http://nginx-static:8080
    depends_on:
      - nginx-static
