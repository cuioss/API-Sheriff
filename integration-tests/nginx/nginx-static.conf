# Static backend for proxy benchmarks: returns a fixed minimal payload with
# access logging disabled, so the backend saturates far above the gateway and
# never pollutes the proxy-overhead measurement.
#
# This file is mounted by two services, and the two depend on different halves of it:
#
#   - nginx-static (docker-compose.benchmark.yml) is the fairness backend every benchmark aspect
#     targets on both gateways. Its two upload aspects need a backend that reads the whole request
#     body before it answers, so a 200 means the upload was actually transferred.
#   - early-answer-backend (docker-compose.yml) backs Http2EarlyResponseResetIT, which needs a
#     backend that answers BEFORE it reads the body. It is dialled at its alias base path, which is
#     not an upload path, so it only ever reaches the `location /` below.
#
# Only the upload location reads the body. Every other path keeps answering before it reads one.

# Loopback-only sink the upload location proxies to. It never sees the client's body: the upload
# location reads and keeps the body itself and forwards a bodiless request, so keepalive is safe and
# no connection is opened per upload.
upstream upload_body_sink {
    server 127.0.0.1:8081;
    keepalive 16;
}

server {
    listen 127.0.0.1:8081;
    access_log off;

    location / {
        default_type text/plain;
        return 200 "OK\n";
    }
}

server {
    listen 8080;
    access_log off;

    # The two upload aspects. API Sheriff forwards /upload-small and /upload-large (httpbin.yaml's
    # upstream.path under the UPSTREAM alias, which the benchmark overlay repoints at this backend
    # with no base path); APISIX rewrites to /anything/upload-small and /anything/upload-large
    # (apisix.yaml). Both forms match, so both gateways get the same backend behaviour.
    #
    # nginx reads the complete request body before it contacts a proxied upstream
    # (proxy_request_buffering on), so the 200 is sent only after the last body byte has arrived.
    # proxy_pass_request_body off then keeps the body here instead of copying it to the sink, and the
    # cleared Content-Length matches the bodiless request that is forwarded.
    location ~ ^(/anything)?/upload-(small|large)$ {
        # A 1 MB uploadSmall body stays in memory. A 50 MB uploadLarge body is spooled to a
        # temporary file, which is cheaper than holding it in memory for every concurrent upload.
        client_body_buffer_size 1m;
        proxy_request_buffering on;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://upload_body_sink;
    }

    location / {
        default_type text/plain;
        return 200 "OK\n";
    }
}
