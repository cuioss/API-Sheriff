  # need thousands of sequential upgrades. This instance reuses the SAME native image and overlays a
  # gateway.yaml whose edge_hardening block shrinks the caps to single digits (admission_cap 8,
  # websocket_relay_cap 2), turning that proof into a handful of connections. It is separate because
  # an 8-request admission budget cannot serve the rest of the IT suite; published on 10447.
