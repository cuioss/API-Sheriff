  # The deliberate plain-HTTP-management exception (ADR-0025).
  #
  # Every other gateway instance serves its management port over HTTPS, and that lockstep is what the
  # host-side readiness loop relies on. This one instance proves the supported downgrade path, and it
  # is the ONLY instance allowed to break the lockstep — hence its own readiness gate, its own port,
  # and this comment.
  #
  # The downgrade is Quarkus-native, not bespoke: QUARKUS_MANAGEMENT_TLS_CONFIGURATION_NAME selects
  # the `plain-management` TLS bucket that application.properties declares with NO key material. The
  # named lookup resolves, the key material is null-guarded, and the recorder swaps in the plain
  # options because getKeyCertOptions() is null. Because it is runtime configuration, the SAME native
  # image every other instance runs is reused unchanged — no rebuild, no variant image, and no config
  # overlay: this service mounts the shared sheriff-config directory exactly as shipped.
  #
  # QUARKUS_MANAGEMENT_ENABLED=false would NOT be an equivalent shortcut: it is fixed at build time
  # (baked into the native image, so it could not be set here at all) and it moves health and metrics
  # onto the MAIN TLS-terminated router, producing an HTTPS probe endpoint rather than a plain one.
  api-sheriff-plain-mgmt:
    image: "api-sheriff:distroless"
    # Same JVM-default-truststore trust as every other instance — see the primary api-sheriff
    # service's command comment for the mechanism (token-sheriff-client#597).
    command:
      - -Djavax.net.ssl.trustStore=/app/certificates/localhost-truststore.p12
      - -Djavax.net.ssl.trustStorePassword=localhost-trust
      - -Djavax.net.ssl.trustStoreType=PKCS12
    # This instance's whole purpose is that its management interface is PLAIN HTTP: it selects the
    # key-less `plain-management` TLS bucket via QUARKUS_MANAGEMENT_TLS_CONFIGURATION_NAME. The label
    # is what lets the host-side readiness probe use http:// here and https:// everywhere else from
    # ONE loop — the scheme difference is data, not a special case in the script. The probe must never
    # need -k against this port: if it ever does, the plain-management opt-out has silently stopped
    # working and THAT is the bug, not the probe.
    labels:
      de.cuioss.sheriff.management-scheme: "http"
      de.cuioss.sheriff.management-root-path: "/q"

    ports:
      - "10448:8443"  # External test port for the plain-management opt-out (test.plain.mgmt.port)
      - "19005:9000"  # Management interface — PLAIN HTTP on this instance only, deliberately
    environment:
      - QUARKUS_PROFILE=it
      # Deployment-supplied benchmark-idp trust bucket, in lockstep with the primary api-sheriff
      # service — see that service's comment for the mechanism.
      - QUARKUS_CONFIG_LOCATIONS=/app/certificates/benchmark-idp-trust.properties
      # ManagementPlainHttpOptOutIT reads this container's log FILE for the ApiSheriff-115 downgrade
      # warning, so the enable flag is load-bearing here, not decorative.
      - QUARKUS_LOG_FILE_ENABLED=true
      - LOG_FILE_PATH=/logs/quarkus-plain-mgmt.log
      - QUARKUS_HTTP_SSL_CERTIFICATE_FILES=/app/certificates/localhost.crt
      - QUARKUS_HTTP_SSL_CERTIFICATE_KEY_FILES=/app/certificates/localhost.key
      # This instance mounts the SHARED sheriff-config, whose gateway.yaml declares a non-empty
      # passthrough_sni — so the SNI front listener claims the public port 8443 exactly as on the
      # primary api-sheriff service, and the terminated HTTPS listener MUST be moved to the internal
      # port or the two collide and boot fails with "Port 8443 seems to be in use by another
      # process". The five other gateway instances escape this only because each overlays
      # gateway.yaml with a variant declaring no passthrough_sni; this one deliberately does not
      # overlay, so that the management opt-out is the single variable under test. Keep in lockstep
      # with the primary service's identical setting — the invariant is documented at the
      # passthrough_sni block in sheriff-config/gateway.yaml.
      - QUARKUS_HTTP_SSL_PORT=8444
      # THE OPT-OUT. Selecting the key-less `plain-management` bucket takes the management interface
      # to plain HTTP; boot still succeeds and emits WARN ApiSheriff-115 naming the port.
      - QUARKUS_MANAGEMENT_TLS_CONFIGURATION_NAME=plain-management
      # The QUARKUS_MANAGEMENT_SSL_CERTIFICATE_FILES / _KEY_FILES pair every other instance sets is
      # deliberately ABSENT here. Its absence is not what produces the downgrade — the selected
      # key-less bucket is — but leaving it set would only be misleading noise.
      - SHERIFF_CONFIG_DIR=/app/sheriff-config
      # Container-side value the bare ${OIDC_CLIENT_SECRET} reference in the shared gateway.yaml
      # (oidc.client_secret) resolves to via EnvSecretResolver.
      - OIDC_CLIENT_SECRET=integration-secret
    depends_on:
      keycloak:
        condition: service_started
      go-httpbin:
        condition: service_started
      asset-origin:
        condition: service_started
      grpc-echo:
        condition: service_healthy
    volumes:
      - ./src/main/docker/certificates:/app/certificates:ro
      # Shared config dir, unmodified: the opt-out is an environment variable, so this instance needs
      # no gateway.yaml overlay at all.
      - ./src/main/docker/sheriff-config:/app/sheriff-config:ro
      - ./src/main/docker/assets:/app/assets:ro
      - ${LOG_TARGET_DIR:-./target/quarkus-logs}:/logs:rw
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=100m
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '4.0'
        reservations:
          memory: 256M
          cpus: '1.0'
    # Health check: inherited from the image — the exec-form probe baked into Dockerfile.native. No
    # healthcheck: key here; the image carries exactly one executable, so only the exec form is
    # available and only the image can carry it. The baked probe is a bare TCP accept on the management
    # port, so it is unaffected by this instance's plain-HTTP management scheme; the host-side readiness
    # assertion still derives its http:// scheme from this service's management-scheme label above,
    # not from a branch on its name.
    networks:
      - api-sheriff
    restart: unless-stopped

  # --- The genuinely empty-passthrough_sni instance backing the benchmark's empty-mode arm --------
  # `passthrough_sni` is a property of the whole gateway process: declaring it non-empty is what
  # STARTS the accept-time Vert.x SNI front listener on the public TLS port, and the primary instance
  # declares two entries for its whole lifetime. So the `passthroughRelayEmpty` benchmark arm — whose
  # entire claim is that it measures D1's zero-overhead default, where that front listener is NEVER
  # created — could not be run against the primary instance without measuring the exact opposite of
  # what it names. Before this instance existed it was pointed at the primary anyway, so both arms of
  # the no-regression gate issued the identical request to the identical listener stack on ONE
  # gateway: the gate was comparing a configuration against itself and could neither pass nor fail
  # for the reason it existed.
  #
  # This instance reuses the SAME native image and overlays a gateway.yaml that is byte-identical to
  # the shared one except for the removed `tls.passthrough_sni` block; published on 10449. It is
  # separate rather than a mode of the primary because the two configurations must run CONCURRENTLY
  # for the benchmark lane to measure both arms in one run.
  #
  # It sets NO QUARKUS_HTTP_SSL_PORT, and that absence is load-bearing rather than an omission: with
  # no passthrough_sni there is no front listener to claim 8443, so the terminated Quarkus HTTPS
  # listener keeps the public port directly. Setting the loopback relocation here would move the
  # terminated listener off 8443 with nothing left listening on it.
  api-sheriff-passthrough-empty:
    image: "api-sheriff:distroless"
    # Same JVM-default-truststore trust as every other instance — see the primary api-sheriff
    # service's command comment for the mechanism (token-sheriff-client#597).
    command:
      - -Djavax.net.ssl.trustStore=/app/certificates/localhost-truststore.p12
      - -Djavax.net.ssl.trustStorePassword=localhost-trust
      - -Djavax.net.ssl.trustStoreType=PKCS12
    # Management-interface scheme for host-side readiness discovery (see the api-sheriff service).
    labels:
      de.cuioss.sheriff.management-scheme: "https"
      de.cuioss.sheriff.management-root-path: "/q"

    ports:
      - "10449:8443"  # External test port for the empty-passthrough_sni benchmark arm
      - "19006:9000"  # Management interface (health/metrics, HTTPS — single port, see below)
    environment:
      - QUARKUS_PROFILE=it
      # Deployment-supplied benchmark-idp trust bucket, in lockstep with the primary api-sheriff
      # service — see that service's comment for the mechanism.
      - QUARKUS_CONFIG_LOCATIONS=/app/certificates/benchmark-idp-trust.properties
      - QUARKUS_LOG_FILE_ENABLED=true
      - LOG_FILE_PATH=/logs/quarkus-passthrough-empty.log
      # NO QUARKUS_HTTP_SSL_PORT here — see the service comment. The overlaid gateway.yaml declares no
      # passthrough_sni, so no front listener is created and the terminated listener owns 8443.
      - QUARKUS_HTTP_SSL_CERTIFICATE_FILES=/app/certificates/localhost.crt
      - QUARKUS_HTTP_SSL_CERTIFICATE_KEY_FILES=/app/certificates/localhost.key
      # Management-interface certificate, kept in lockstep with every other instance — see the
      # primary api-sheriff service's comment for the single-port mechanism. Without it this
      # instance's management port 19006 stays plain HTTP while the others are HTTPS, and the
      # host-side readiness wait in start-integration-container.sh (https + -k for 19000-19004 and
      # 19006-19009) would hang. api-sheriff-plain-mgmt on 19005 is the one deliberate exception.
      - QUARKUS_MANAGEMENT_SSL_CERTIFICATE_FILES=/app/certificates/localhost.crt
      - QUARKUS_MANAGEMENT_SSL_CERTIFICATE_KEY_FILES=/app/certificates/localhost.key
      - SHERIFF_CONFIG_DIR=/app/sheriff-config
      # Container-side value the bare ${OIDC_CLIENT_SECRET} reference in the overlaid gateway.yaml
      # (oidc.client_secret) resolves to via EnvSecretResolver — kept in lockstep with the primary
      # api-sheriff service, whose gateway.yaml carries the same oidc block.
      - OIDC_CLIENT_SECRET=integration-secret
    depends_on:
      keycloak:
        condition: service_started
      go-httpbin:
        condition: service_started
      asset-origin:
        condition: service_started
      grpc-echo:
        condition: service_healthy
    volumes:
      - ./src/main/docker/certificates:/app/certificates:ro
      # Shared config dir, then overlay ONLY gateway.yaml with the no-passthrough_sni variant.
      - ./src/main/docker/sheriff-config:/app/sheriff-config:ro
      - ./src/main/docker/sheriff-config-passthrough-empty/gateway.yaml:/app/sheriff-config/gateway.yaml:ro
      - ./src/main/docker/assets:/app/assets:ro
      - ${LOG_TARGET_DIR:-./target/quarkus-logs}:/logs:rw
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=100m
    # Identical to the primary instance's budget, per ADR-0012: the empty-mode arm is compared
    # against the primary's proxiedStatic baseline, so a different CPU or memory limit here would
    # make the comparison measure the budget difference rather than the passthrough configuration.
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '4.0'
        reservations:
          memory: 256M
          cpus: '1.0'
    # Health check: inherited from the image — the exec-form probe baked into Dockerfile.native. No
    # healthcheck: key here; the image carries exactly one executable, so only the exec form is
    # available and only the image can carry it.
    networks:
      - api-sheriff
    restart: unless-stopped

  # --- The explicit plain-HTTP opt-in instance ------------------------------------------------------
  # The ONE instance in this stack that supplies NO server key material for the terminated main
  # listener. All four QUARKUS_HTTP_SSL_CERTIFICATE_* variables are absent, and that absence IS half
  # the configuration under test — do not "fix" it by copying the pair every sibling instance carries.
  #
  # The other half is QUARKUS_HTTP_INSECURE_REQUESTS=enabled below, and the two belong together. A
  # certificate-less deployment that does NOT declare that variable is REFUSED at boot: plain HTTP is
  # something an operator declares, never something the gateway infers from a missing certificate,
  # because absence cannot tell "deliberately behind a TLS terminator" apart from "the certificate
  # failed to mount". This instance is the deliberate deployment, spelled out. Removing the variable
  # does not make it serve cleartext quietly — it makes the container refuse to start, which is the
  # matched negative leg NoCertificatePlainHttpOptInIT drives itself with a one-off `docker run`
  # rather than as a permanently-failing service here (an api-sheriff* service that never becomes
  # healthy would break the stack's own readiness gate).
  #
  # It overlays the no-passthrough_sni gateway.yaml for the same reason api-sheriff-passthrough-empty
  # does, and here the reason is load-bearing for the test rather than for a benchmark: the shared
  # gateway.yaml declares passthrough_sni, which STARTS the accept-time SNI front listener on 8443.
  # That front listener terminates nothing and needs no certificate, so it would happily accept on the
  # published HTTPS port — and the IT's "the HTTPS port does not answer" assertion would be asserting
  # the front listener's presence rather than the absence of a terminated HTTPS listener. With the
  # overlay there is no front listener, nothing supplies key material, and 8443 is genuinely dead.
  #
  # It sets NO QUARKUS_HTTP_SSL_PORT, for the same reason as api-sheriff-passthrough-empty: with no
  # passthrough_sni there is no front listener to move the terminated listener out of the way of.
  api-sheriff-no-certificate:
    image: "api-sheriff:distroless"
    # Same JVM-default-truststore trust as every other instance — see the primary api-sheriff
    # service's command comment for the mechanism (token-sheriff-client#597).
    command:
      - -Djavax.net.ssl.trustStore=/app/certificates/localhost-truststore.p12
      - -Djavax.net.ssl.trustStorePassword=localhost-trust
      - -Djavax.net.ssl.trustStoreType=PKCS12
    # Management-interface scheme for host-side readiness discovery (see the api-sheriff service).
    # It stays HTTPS: the management interface takes its certificate from the SEPARATE
    # quarkus.management.ssl.certificate.* keys below, which the main-listener declaration gate does
    # not read, so this instance's management port behaves exactly like every other one's. Only the
    # MAIN listener is certificate-less here.
    labels:
      de.cuioss.sheriff.management-scheme: "https"
      de.cuioss.sheriff.management-root-path: "/q"

    ports:
      # The PLAIN HTTP port is the one under test — every other gateway instance publishes 8443 here.
      - "10453:8080"  # Plain HTTP, served by the declared opt-in (test.no.certificate.plain.port)
      # Published deliberately with NOTHING behind it. The IT asserts that a TLS dial to this port
      # fails, and it can only assert that against a published port; the matched positive control is
      # the plain port above answering 200, so "it failed" cannot pass for the wrong reason.
      - "10454:8443"  # Terminated HTTPS — deliberately dead (test.no.certificate.https.port)
      - "19010:9000"  # Management interface (health/metrics, HTTPS — single port, see below)
    environment:
      - QUARKUS_PROFILE=it
      # Deployment-supplied benchmark-idp trust bucket, in lockstep with the primary api-sheriff
      # service — see that service's comment for the mechanism.
      - QUARKUS_CONFIG_LOCATIONS=/app/certificates/benchmark-idp-trust.properties
      # NoCertificatePlainHttpOptInIT reads this container's log FILE for the ApiSheriff-121
      # resolved-plain-HTTP warning and for the framework's own "started in" line, so the enable flag
      # is load-bearing here, not decorative.
      - QUARKUS_LOG_FILE_ENABLED=true
      - LOG_FILE_PATH=/logs/quarkus-no-certificate.log
      # THE CONFIGURATION UNDER TEST, expressed as an absence: no QUARKUS_HTTP_SSL_CERTIFICATE_FILES,
      # no _KEY_FILES, no _KEY_STORE_FILE, no _CREDENTIALS_PROVIDER, and no
      # QUARKUS_HTTP_TLS_CONFIGURATION_NAME. Nothing declares server key material for the main
      # listener.
      #
      # …and THE OPT-IN that makes that absence a supported deployment rather than a refused one.
      # This is the whole point of the pairing: the gateway serves cleartext because this variable
      # says so, not because a certificate happened to be missing. Deleting it turns this service
      # into a boot refusal naming both remedies — it does NOT turn it into a silent downgrade.
      - QUARKUS_HTTP_INSECURE_REQUESTS=enabled
      #
      # Management-interface certificate, kept in lockstep with every other instance — see the
      # primary api-sheriff service's comment for the single-port mechanism. It is a DIFFERENT key
      # family from the main listener's and the declaration gate never reads it, so supplying it here does not
      # weaken the state under test.
      - QUARKUS_MANAGEMENT_SSL_CERTIFICATE_FILES=/app/certificates/localhost.crt
      - QUARKUS_MANAGEMENT_SSL_CERTIFICATE_KEY_FILES=/app/certificates/localhost.key
      - SHERIFF_CONFIG_DIR=/app/sheriff-config
      # Container-side value the bare ${OIDC_CLIENT_SECRET} reference in the overlaid gateway.yaml
      # (oidc.client_secret) resolves to via EnvSecretResolver.
      - OIDC_CLIENT_SECRET=integration-secret
    depends_on:
      keycloak:
        condition: service_started
      go-httpbin:
        condition: service_started
      asset-origin:
        condition: service_started
      grpc-echo:
        condition: service_healthy
    volumes:
      - ./src/main/docker/certificates:/app/certificates:ro
      # Shared config dir, then overlay ONLY gateway.yaml with the no-passthrough_sni variant — see
      # the service comment for why the overlay is what makes the dead-HTTPS-port assertion honest.
      - ./src/main/docker/sheriff-config:/app/sheriff-config:ro
      - ./src/main/docker/sheriff-config-passthrough-empty/gateway.yaml:/app/sheriff-config/gateway.yaml:ro
      # The /assets/static route the IT's positive control fetches is served from this directory.
      - ./src/main/docker/assets:/app/assets:ro
      - ${LOG_TARGET_DIR:-./target/quarkus-logs}:/logs:rw
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=100m
    # 256M rather than the suite-serving instances' 512M: this instance serves four assertions against
    # one static asset and its own log, never the IT suite, and it is never benchmarked — so ADR-0012's
    # equal-budget rule, which binds the benchmark-compared instances, does not reach it.
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '2.0'
        reservations:
          memory: 128M
          cpus: '0.5'
    # Health check: inherited from the image — the exec-form probe baked into Dockerfile.native. It is
    # a bare TCP accept on the MANAGEMENT port, so it is unaffected by the main listener having no
    # certificate.
    networks:
      - api-sheriff
    restart: unless-stopped

  # --- The egress hostname-verification matched control, positive leg ------------------------------
  # egress_tls.upstream_verify_hostname is bound at Vert.x client construction, so it is a property of
  # the whole gateway process (ADR-0040) — one instance can only ever exhibit one side of the control.
  # This pair is therefore two instances rather than two routes on one, published on 10450/10451.
  #
  # Both dial the SAME mismatched-tls-backend, whose certificate names upstream-mismatch and not the
  # dialled name, and both bind the it-upstream trust profile that holds that certificate — so chain
  # trust SUCCEEDS on both legs and the hostname check is the only variable left. This leg must refuse
  # the upstream; the verify-off leg below must reach it.
  #
  # TOPOLOGY_UPSTREAM is what repoints the shared /proxy route at that backend. The overlay
  # gateway.yaml cannot do it: endpoints/ and topology.properties are shared with the primary
  # instance, and topology.properties resolves UPSTREAM through an in-file ${TOPOLOGY_UPSTREAM:-...}
  # placeholder (ADR-0004 Amendment A1) precisely so a deployment can repoint it without a second
  # copy of the endpoint descriptor.
  #
  # QUARKUS_CONFIG_LOCATIONS carries TWO files here, comma-separated, where every other instance
  # carries one: this pair is the only consumer of it-upstream-trust.properties. Dropping the second
  # entry leaves upstream_tls_profile: it-upstream naming an unbound profile, which is a hard boot
  # failure by the resolver's fail-closed contract — not a silent fallback to default trust.
  #
  # The memory limit is 256M rather than the 512M the suite-serving instances carry. These two serve
  # exactly one assertion each against a fixed 200-byte upstream response, never the IT suite, so the
  # larger budget would only reserve host memory the pair cannot use. ADR-0012's equal-budget rule
  # binds the benchmark-compared instances (the primary and passthrough-empty arms); it does not reach
  # a pair that is never benchmarked and is compared only against each other, on equal budgets.
  api-sheriff-egress-verify-on:
    image: "api-sheriff:distroless"
    # Same JVM-default-truststore trust as every other instance — see the primary api-sheriff
    # service's command comment for the mechanism (token-sheriff-client#597). This is the JVM DEFAULT
    # store and is unrelated to the it-upstream profile below, which binds the Vert.x egress clients'
    # anchors: the resolved profile REPLACES those clients' trust and never consults this one.
    command:
      - -Djavax.net.ssl.trustStore=/app/certificates/localhost-truststore.p12
      - -Djavax.net.ssl.trustStorePassword=localhost-trust
      - -Djavax.net.ssl.trustStoreType=PKCS12
    # Management-interface scheme for host-side readiness discovery (see the api-sheriff service).
    labels:
      de.cuioss.sheriff.management-scheme: "https"
      de.cuioss.sheriff.management-root-path: "/q"

    ports:
      - "10450:8443"  # External test port for the verify-on leg (test.egress.verify.on.port)
      - "19007:9000"  # Management interface (health/metrics, HTTPS — single port, see below)
    environment:
      - QUARKUS_PROFILE=it
      # Two config locations, not one — see the service comment. The first is the benchmark-idp trust
      # bucket every it-profile instance carries; the second binds the it-upstream profile this
      # instance's overlay names.
      - QUARKUS_CONFIG_LOCATIONS=/app/certificates/benchmark-idp-trust.properties,/app/certificates/it-upstream-trust.properties
      - QUARKUS_LOG_FILE_ENABLED=true
      - LOG_FILE_PATH=/logs/quarkus-egress-verify-on.log
      # Repoint the shared /proxy route at the hostname-mismatched TLS upstream — see the service
      # comment for why this is an environment variable rather than an overlay concern. Identical on
      # both legs of the pair: the upstream is the constant, the knob is the variable.
      - TOPOLOGY_UPSTREAM=https://mismatched-tls-backend:8443
      # The chain-trust control's dial target (endpoints/untrusted.yaml, route /proxy/untrusted).
      # passthrough-backend generates a self-signed certificate at container start, so it chains to
      # nothing the it-upstream profile trusts, while its SAN DOES cover the dialled name — hostname
      # matching succeeds and chain trust is the only thing left to fail. That is what distinguishes
      # "the knob relaxed hostname matching" from "the knob disabled verification wholesale", which
      # the mismatched-upstream legs alone cannot tell apart. Pinned explicitly on both instances
      # even though topology.properties carries the same default: this pair is the only consumer
      # that asserts against the alias, so its target is stated where the assertion can see it.
      - TOPOLOGY_UNTRUSTED=https://passthrough-backend:8443
      # Terminate directly on the public port (no passthrough front on this instance).
      - QUARKUS_HTTP_SSL_CERTIFICATE_FILES=/app/certificates/localhost.crt
      - QUARKUS_HTTP_SSL_CERTIFICATE_KEY_FILES=/app/certificates/localhost.key
      # Management-interface certificate, kept in lockstep with every other instance — see the
      # primary api-sheriff service's comment for the single-port mechanism. Without it this
      # instance's management port 19007 stays plain HTTP while the others are HTTPS, and the
      # host-side readiness wait in start-integration-container.sh would hang.
      # api-sheriff-plain-mgmt on 19005 is the one deliberate exception.
      - QUARKUS_MANAGEMENT_SSL_CERTIFICATE_FILES=/app/certificates/localhost.crt
      - QUARKUS_MANAGEMENT_SSL_CERTIFICATE_KEY_FILES=/app/certificates/localhost.key
      - SHERIFF_CONFIG_DIR=/app/sheriff-config
      # Container-side value the bare ${OIDC_CLIENT_SECRET} reference in the overlaid gateway.yaml
      # (oidc.client_secret) resolves to via EnvSecretResolver — kept in lockstep with the primary
      # api-sheriff service, whose gateway.yaml carries the same oidc block.
      - OIDC_CLIENT_SECRET=integration-secret
    depends_on:
      keycloak:
        condition: service_started
      go-httpbin:
        condition: service_started
      asset-origin:
        condition: service_started
      grpc-echo:
        condition: service_healthy
      # The only instances that gate on this backend. Its listener must be up before the assertion
      # runs, or a connection refusal would be indistinguishable from the hostname refusal under test.
      mismatched-tls-backend:
        condition: service_healthy
      # The chain-trust control's origin (TOPOLOGY_UNTRUSTED). Gated for the same reason as the
      # backend above: a refusal from a listener that is not up yet would be read as the chain-trust
      # refusal the third leg asserts, and the control would pass without ever having dialled.
      passthrough-backend:
        condition: service_healthy
    volumes:
      - ./src/main/docker/certificates:/app/certificates:ro
      # Shared config dir, then overlay ONLY gateway.yaml with the verify-on variant.
      - ./src/main/docker/sheriff-config:/app/sheriff-config:ro
      - ./src/main/docker/sheriff-config-egress-verify-on/gateway.yaml:/app/sheriff-config/gateway.yaml:ro
      - ./src/main/docker/assets:/app/assets:ro
      - ${LOG_TARGET_DIR:-./target/quarkus-logs}:/logs:rw
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=100m
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '2.0'
        reservations:
          memory: 128M
          cpus: '0.5'
    # Health check: inherited from the image — the exec-form probe baked into Dockerfile.native. No
    # healthcheck: key here; the image carries exactly one executable, so only the exec form is
    # available and only the image can carry it.
    networks:
      - api-sheriff
    restart: unless-stopped

  # --- The egress hostname-verification matched control, negative leg ------------------------------
  # Byte-identical to api-sheriff-egress-verify-on above apart from the overlay path, the two published
  # ports, the log file name and the container name. The behavioural difference lives entirely in the
  # overlaid gateway.yaml, which differs from its sibling in exactly one scalar
  # (egress_tls.upstream_verify_hostname: false).
  #
  # It keeps the it-upstream trust profile rather than dropping it, and that is load-bearing: the
  # relaxation is HOSTNAME MATCHING ONLY, so this instance still refuses an untrusted chain. Dropping
  # the profile would make this leg fail on chain trust instead, and the pair would then read as a
  # working control while the knob under test was never exercised.
  api-sheriff-egress-verify-off:
    image: "api-sheriff:distroless"
    # Same JVM-default-truststore trust as every other instance — see the primary api-sheriff
    # service's command comment for the mechanism (token-sheriff-client#597).
    command:
      - -Djavax.net.ssl.trustStore=/app/certificates/localhost-truststore.p12
      - -Djavax.net.ssl.trustStorePassword=localhost-trust
      - -Djavax.net.ssl.trustStoreType=PKCS12
    # Management-interface scheme for host-side readiness discovery (see the api-sheriff service).
    labels:
      de.cuioss.sheriff.management-scheme: "https"
      de.cuioss.sheriff.management-root-path: "/q"

    ports:
      - "10451:8443"  # External test port for the verify-off leg (test.egress.verify.off.port)
      - "19008:9000"  # Management interface (health/metrics, HTTPS — single port, see below)
    environment:
      - QUARKUS_PROFILE=it
      # Two config locations, in lockstep with the verify-on leg — see that service's comment.
      - QUARKUS_CONFIG_LOCATIONS=/app/certificates/benchmark-idp-trust.properties,/app/certificates/it-upstream-trust.properties
      - QUARKUS_LOG_FILE_ENABLED=true
      - LOG_FILE_PATH=/logs/quarkus-egress-verify-off.log
      # Identical to the verify-on leg: the upstream is the constant of this control, the
      # hostname-verification knob is the variable.
      - TOPOLOGY_UPSTREAM=https://mismatched-tls-backend:8443
      # The chain-trust control's dial target, identical to the verify-on leg — see that service's
      # comment. This instance is the one the third IT leg drives: with hostname matching relaxed it
      # must STILL refuse this origin, which is what proves the relaxation did not reach chain trust.
      - TOPOLOGY_UNTRUSTED=https://passthrough-backend:8443
      # Terminate directly on the public port (no passthrough front on this instance).
      - QUARKUS_HTTP_SSL_CERTIFICATE_FILES=/app/certificates/localhost.crt
      - QUARKUS_HTTP_SSL_CERTIFICATE_KEY_FILES=/app/certificates/localhost.key
      # Management-interface certificate, kept in lockstep with every other instance — see the
      # primary api-sheriff service's comment for the single-port mechanism. Without it this
      # instance's management port 19008 stays plain HTTP while the others are HTTPS, and the
      # host-side readiness wait in start-integration-container.sh would hang.
      # api-sheriff-plain-mgmt on 19005 is the one deliberate exception.
      - QUARKUS_MANAGEMENT_SSL_CERTIFICATE_FILES=/app/certificates/localhost.crt
      - QUARKUS_MANAGEMENT_SSL_CERTIFICATE_KEY_FILES=/app/certificates/localhost.key
      - SHERIFF_CONFIG_DIR=/app/sheriff-config
      # Container-side value the bare ${OIDC_CLIENT_SECRET} reference in the overlaid gateway.yaml
      # (oidc.client_secret) resolves to via EnvSecretResolver.
      - OIDC_CLIENT_SECRET=integration-secret
    depends_on:
      keycloak:
        condition: service_started
      go-httpbin:
        condition: service_started
      asset-origin:
        condition: service_started
      grpc-echo:
        condition: service_healthy
      mismatched-tls-backend:
        condition: service_healthy
      # The chain-trust control's origin — gated in lockstep with the verify-on leg.
      passthrough-backend:
        condition: service_healthy
    volumes:
      - ./src/main/docker/certificates:/app/certificates:ro
      # Shared config dir, then overlay ONLY gateway.yaml with the verify-off variant.
      - ./src/main/docker/sheriff-config:/app/sheriff-config:ro
      - ./src/main/docker/sheriff-config-egress-verify-off/gateway.yaml:/app/sheriff-config/gateway.yaml:ro
      - ./src/main/docker/assets:/app/assets:ro
      - ${LOG_TARGET_DIR:-./target/quarkus-logs}:/logs:rw
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=100m
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '2.0'
        reservations:
          memory: 128M
          cpus: '0.5'
    # Health check: inherited from the image — the exec-form probe baked into Dockerfile.native. No
    # healthcheck: key here; the image carries exactly one executable, so only the exec form is
    # available and only the image can carry it.
    networks:
      - api-sheriff
    restart: unless-stopped

  # --- The short-token-lifespan instance backing the BFF refresh coverage suite -------------------
  # The near-expiry refresh window is a function of the ACCESS TOKEN's lifespan, which is a property
  # of the OIDC client that minted it — so it cannot be varied per request on an existing instance.
  # The shared realm's accessTokenLifespan is 900s, which would make the refresh path unreachable in
  # a test: with session.refresh.leeway_seconds 30, the window opens 30s before expiry, i.e. 870s
  # into the session. This instance therefore authenticates as `refresh-client`, whose client-level
  # access.token.lifespan attribute is 45 — putting the near-expiry window at 15s..45s, inside a
  # test's patience.
  #
  # It reuses the SAME native image and overlays sheriff-config-refresh/gateway.yaml, which differs
  # from the shared document only in oidc.client_id, the gateway origin (10452), and the removed
  # tls.passthrough_sni block. Session mode stays `server` — the refresh path under test is the
  # server-mode one — so no SESSION_ENCRYPTION_KEY is set; that key is cookie-mode material.
  #
  # It sets NO QUARKUS_HTTP_SSL_PORT, and that absence is load-bearing rather than an omission: the
  # overlay declares no passthrough_sni, so no SNI front listener is created and the terminated
  # Quarkus HTTPS listener keeps the public port 8443 directly. Setting the loopback relocation here
  # would move the terminated listener off 8443 with nothing left listening on it.
  api-sheriff-refresh:
    image: "api-sheriff:distroless"
    # Same JVM-default-truststore trust as every other instance — see the primary api-sheriff
    # service's command comment for the mechanism (token-sheriff-client#597). Load-bearing here in
    # particular: this instance's whole purpose is to drive the confidential-client REFRESH call
    # against the self-signed IT Keycloak, and that call uses only the JVM default TrustManager.
    command:
      - -Djavax.net.ssl.trustStore=/app/certificates/localhost-truststore.p12
      - -Djavax.net.ssl.trustStorePassword=localhost-trust
      - -Djavax.net.ssl.trustStoreType=PKCS12
    # Management-interface scheme for host-side readiness discovery (see the api-sheriff service).
    labels:
      de.cuioss.sheriff.management-scheme: "https"
      de.cuioss.sheriff.management-root-path: "/q"

    ports:
      - "10452:8443"  # External test port for BffTokenRefreshIT (test.refresh.port)
      - "19009:9000"  # Management interface (health/metrics, HTTPS — single port, see below)
    environment:
      - QUARKUS_PROFILE=it
      # Deployment-supplied benchmark-idp trust bucket, in lockstep with the primary api-sheriff
      # service — see that service's comment for the mechanism.
      - QUARKUS_CONFIG_LOCATIONS=/app/certificates/benchmark-idp-trust.properties
      - QUARKUS_LOG_FILE_ENABLED=true
      - LOG_FILE_PATH=/logs/quarkus-refresh.log
      # Terminate directly on the public port (no passthrough front on this instance).
      - QUARKUS_HTTP_SSL_CERTIFICATE_FILES=/app/certificates/localhost.crt
      - QUARKUS_HTTP_SSL_CERTIFICATE_KEY_FILES=/app/certificates/localhost.key
      # Management-interface certificate, kept in lockstep with every other instance — see the
      # primary api-sheriff service's comment for the single-port mechanism. Without it this
      # instance's management port 19009 stays plain HTTP while the others are HTTPS, and the
      # host-side readiness wait in start-integration-container.sh (https + -k for 19000-19004 and
      # 19006-19009) would hang. api-sheriff-plain-mgmt on 19005 is the one deliberate exception.
      - QUARKUS_MANAGEMENT_SSL_CERTIFICATE_FILES=/app/certificates/localhost.crt
      - QUARKUS_MANAGEMENT_SSL_CERTIFICATE_KEY_FILES=/app/certificates/localhost.key
      - SHERIFF_CONFIG_DIR=/app/sheriff-config
      # Container-side value the bare ${OIDC_CLIENT_SECRET} reference in the overlaid refresh
      # gateway.yaml (oidc.client_secret) resolves to via EnvSecretResolver. This is the ONE
      # instance that does NOT carry integration-secret: its overlay names client_id
      # refresh-client, so it must present that client's own secret or every token call is
      # rejected invalid_client.
      - OIDC_CLIENT_SECRET=refresh-secret
    depends_on:
      keycloak:
        condition: service_started
      go-httpbin:
        condition: service_started
      asset-origin:
        condition: service_started
      grpc-echo:
        condition: service_healthy
    volumes:
      - ./src/main/docker/certificates:/app/certificates:ro
      # Shared config dir, then overlay ONLY gateway.yaml with the short-lifespan refresh variant.
      - ./src/main/docker/sheriff-config:/app/sheriff-config:ro
      - ./src/main/docker/sheriff-config-refresh/gateway.yaml:/app/sheriff-config/gateway.yaml:ro
      - ./src/main/docker/assets:/app/assets:ro
      # The demo SPA, same read-only mount as the other server-mode instances. The overlay keeps
      # final_redirect: /assets/demo/landing.html, which the /assets/demo directory asset route
      # serves from this mount — without it a post-logout return would 404.
      - ../demo-client/src/main/resources/spa:/app/demo:ro
      - ${LOG_TARGET_DIR:-./target/quarkus-logs}:/logs:rw
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=100m
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '4.0'
        reservations:
          memory: 256M
          cpus: '1.0'
    # Health check: inherited from the image — the exec-form probe baked into Dockerfile.native. No
    # healthcheck: key here; the image carries exactly one executable, so only the exec form is
    # available and only the image can carry it.
    networks:
      - api-sheriff
    restart: unless-stopped

  # --- The cookie-mode-WITH-REFRESH proof rig ----------------------------------------------------
  # The one combination no other instance can carry. Session mode, the refresh switch and the
  # minting client are each process-wide, so this instance cannot be folded into either sibling:
  # api-sheriff-cookie holds refresh OFF and api-sheriff-refresh holds session mode SERVER. Flipping
  # either would destroy the contract that instance exists to prove, so the combination gets its own
  # process, published on 10455 with management port 19011.
  #
  # Those two numbers are NOT the next ones after api-sheriff-refresh's 10452/19009, and the skip is
  # deliberate: api-sheriff-no-certificate above already publishes 10453, 10454 and 19010.
  # Allocate host ports against THIS file, never against the topology document.
  #
  # It is a whole-block mirror of api-sheriff-cookie above, with five per-instance values and
  # nothing else: the two published ports, LOG_FILE_PATH, the overlay it mounts, OIDC_CLIENT_SECRET,
  # and SESSION_ENCRYPTION_KEY. The last two are not cosmetic and neither is mirrored from the
  # sibling; the paragraph below states why the key differs. As for the secret: the
  # overlay names client_id refresh-client (whose 45-second access.token.lifespan is what brings the
  # near-expiry window within a test's reach), so it must present refresh-client's own secret or
  # every token call — including the refresh call this rig exists to drive — is rejected
  # invalid_client. api-sheriff-refresh carries the same value for the same reason.
  #
  # SESSION_ENCRYPTION_KEY is deliberately a DIFFERENT value from the one api-sheriff-cookie and
  # api-sheriff-cookie-2 share. Their byte-identical key is the statelessness experiment; this
  # instance takes no part in it and shares no state with anything, so giving it its own key keeps
  # key equality meaning exactly what BffCookieActivationWiringTest asserts it means — a property of
  # that pair, not of every cookie-mode instance.
  api-sheriff-cookie-refresh:
    image: "api-sheriff:distroless"
    # Same JVM-default-truststore trust as every other instance — see the primary api-sheriff
    # service's command comment for the mechanism (token-sheriff-client#597). Load-bearing here in
    # particular, as on api-sheriff-refresh: this instance drives the confidential-client REFRESH
    # call against the self-signed IT Keycloak, and that call uses only the JVM default TrustManager.
    command:
      - -Djavax.net.ssl.trustStore=/app/certificates/localhost-truststore.p12
      - -Djavax.net.ssl.trustStorePassword=localhost-trust
      - -Djavax.net.ssl.trustStoreType=PKCS12
    # Management-interface scheme for host-side readiness discovery (see the api-sheriff service).
    labels:
      de.cuioss.sheriff.management-scheme: "https"
      de.cuioss.sheriff.management-root-path: "/q"

    ports:
      - "10455:8443"  # External test port for BffCookieRefreshIT, hard-coded in
                      # BffKeycloakLoginFlow.COOKIE_REFRESH_GATEWAY_ORIGIN — no system property
                      # carries it, so this literal and that constant must move together
      - "19011:9000"  # Management interface (health/metrics, HTTPS — single port, see below)
    environment:
      - QUARKUS_PROFILE=it
      # Deployment-supplied benchmark-idp trust bucket, in lockstep with the primary api-sheriff
      # service — see that service's comment for the mechanism.
      - QUARKUS_CONFIG_LOCATIONS=/app/certificates/benchmark-idp-trust.properties
      - QUARKUS_LOG_FILE_ENABLED=true
      # Unique to this instance. All instances share ONE /logs mount, so a path mirrored verbatim
      # from a sibling would have two processes writing the same file and neither log readable.
      - LOG_FILE_PATH=/logs/quarkus-cookie-refresh.log
      # Terminate directly on the public port (no passthrough front on this instance).
      - QUARKUS_HTTP_SSL_CERTIFICATE_FILES=/app/certificates/localhost.crt
      - QUARKUS_HTTP_SSL_CERTIFICATE_KEY_FILES=/app/certificates/localhost.key
      # Management-interface certificate, kept in lockstep with every other instance — see the
      # primary api-sheriff service's comment for the single-port mechanism. Without it this
      # instance's management port 19011 stays plain HTTP while the others are HTTPS, and the
      # host-side readiness assertion (which adds -k only where the management-scheme label says
      # https) would fail closed against it. api-sheriff-plain-mgmt is the one deliberate exception.
      - QUARKUS_MANAGEMENT_SSL_CERTIFICATE_FILES=/app/certificates/localhost.crt
      - QUARKUS_MANAGEMENT_SSL_CERTIFICATE_KEY_FILES=/app/certificates/localhost.key
      - SHERIFF_CONFIG_DIR=/app/sheriff-config
      # Container-side value the bare ${OIDC_CLIENT_SECRET} reference in the overlaid
      # cookie-refresh gateway.yaml resolves to via EnvSecretResolver. refresh-secret, NOT
      # integration-secret — see the block comment above.
      - OIDC_CLIENT_SECRET=refresh-secret
      # The AES-256-GCM sealing key (base64 of 32 bytes) the overlaid gateway.yaml references as
      # ${SESSION_ENCRYPTION_KEY}. A fixed test value, distinct from the cookie pair's shared key
      # (see the block comment above); it seals only throwaway integration-realm sessions and is
      # never a production key.
      - SESSION_ENCRYPTION_KEY=Y29va2llLXJlZnJlc2gtc2VhbGluZy1rZXktMDEyMzQ=
    depends_on:
      keycloak:
        condition: service_started
      go-httpbin:
        condition: service_started
      asset-origin:
        condition: service_started
      grpc-echo:
        condition: service_healthy
    volumes:
      - ./src/main/docker/certificates:/app/certificates:ro
      # Shared config dir, then overlay ONLY gateway.yaml with the cookie-mode-with-refresh variant.
      - ./src/main/docker/sheriff-config:/app/sheriff-config:ro
      - ./src/main/docker/sheriff-config-cookie-refresh/gateway.yaml:/app/sheriff-config/gateway.yaml:ro
      - ./src/main/docker/assets:/app/assets:ro
      # The demo SPA, same read-only mount as the other login-driving instances. The overlay keeps
      # final_redirect: /assets/demo/landing.html, which the /assets/demo directory asset route
      # serves from this mount — without it a post-logout return would 404.
      - ../demo-client/src/main/resources/spa:/app/demo:ro
      - ${LOG_TARGET_DIR:-./target/quarkus-logs}:/logs:rw
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=100m
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '4.0'
        reservations:
          memory: 256M
          cpus: '1.0'
    # Health check: inherited from the image — the exec-form probe baked into Dockerfile.native. No
    # healthcheck: key here; the image carries exactly one executable, so only the exec form is
    # available and only the image can carry it.
    networks:
      - api-sheriff
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.6.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=1h'
      # --web.enable-lifecycle is deliberately NOT set. It exposes unauthenticated POST /-/reload and
      # POST /-/quit on port 9090, which the block above publishes to the host — a remote-shutdown
      # control on a service that needs none. Nothing in this repository calls either endpoint.
      # The :ro flag stops the CONTAINER from writing the scrape config; it does not stop a host user
      # editing ./prometheus.yml while the stack runs, so a host-side edit is a real possibility —
      # it simply requires a restart to take effect. Do not add lifecycle back to "make reloading
      # easier": bring the service down and up, which is what an ephemeral test stack does anyway.
    networks:
      - api-sheriff

  k6:
    build:
      context: ..
      dockerfile: benchmarks/Dockerfile.k6
    networks:
      - api-sheriff
    profiles:
      - benchmark
    restart: "no"
    # k6's handleSummary() writes one summary document per run into /results, which the
    # K6ResultPostProcessor reads back from the host. K6_OUTPUT_DIR is set by the Maven
    # benchmark executions; the default keeps a bare `docker compose run k6` working.
    volumes:
      - ${K6_OUTPUT_DIR:-../benchmarks/target/benchmark-results/k6}:/results
    # The stock grafana/k6 image runs as an unprivileged uid that does not exist on the host,
    # so it cannot write into the host-owned bind mount above. This is an ephemeral load
    # generator on a local benchmark network with no published ports; running it as the host
    # user is not an option because the uid is not known to compose, so it runs as root and
    # the result files stay removable by `mvn clean` (the parent directory is host-owned).
    user: "0:0"
    # Value-less entries pass the host variable through only when it is set, so an unset
    # variable stays unset in the container rather than becoming an empty string. PASSTHROUGH_SNI
    # selects the passthrough_relay.js mode (mapped | empty) and is set per benchmark execution in
    # benchmarks/pom.xml; without it here the selector never reaches k6 and both executions would
    # run the same mode.
    environment:
      - BENCHMARK_VUS
      - BENCHMARK_DURATION
      - BENCHMARK_MAX_ERROR_RATE
      - GATEWAY_TARGET
      - PASSTHROUGH_SNI

networks:
  api-sheriff:
    driver: bridge
