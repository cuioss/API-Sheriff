# API Sheriff Integration Tests - Production-Grade Configuration
# Purpose: Test with production-equivalent settings to catch issues early

services:
  keycloak:
    # NOTE: Dependabot cannot automatically update this image version.
    # Manual updates required. Check: https://quay.io/keycloak/keycloak
    image: quay.io/keycloak/keycloak:26.5.7@sha256:45ae20191531eb608ddb0b775d012b40d3e4f942697f3214694887dd7c108d13
    command:
      - start-dev
      - --import-realm
      - --https-certificate-file=/opt/keycloak/certificates/localhost.crt
      - --https-certificate-key-file=/opt/keycloak/certificates/localhost.key
      - --https-port=8443
    # Declares the scheme this service's MANAGEMENT interface speaks, exactly as every api-sheriff*
    # instance does. Keycloak's management port is HTTPS because KC_HTTP_ENABLED=false below leaves
    # TLS as its only listener. The label exists so a host-side readiness probe can derive the whole
    # probe URL — scheme AND published port — from this model instead of restating either;
    # demo-client/scripts/start-dev-environment.sh consumes it for all three demo services in ONE
    # loop rather than carrying a keycloak-shaped special case. It is inert for the landed
    # integration-tests bring-up, whose discovery filters on the api-sheriff* name prefix.
    labels:
      de.cuioss.sheriff.management-scheme: "https"

    ports:
      - "1443:8443"  # External HTTPS port for Keycloak admin
      - "1090:9000"  # External port for Keycloak management (health checks)
    volumes:
      - ./src/main/docker/keycloak:/opt/keycloak/data/import:ro
      - ./src/main/docker/certificates:/opt/keycloak/certificates:ro
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
      - KC_LOG_LEVEL=INFO
      # Hostname configuration v2 for well-known discovery endpoint (research-based)
      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_ENABLED=false
      - KC_HTTPS_PORT=8443
      - KC_HOSTNAME=localhost
      # External hostname for Docker container well-known discovery
    networks:
      - api-sheriff

  # Toxiproxy sits in front of the TLS passthrough backend so PassthroughFaultIT can inject a
  # mid-stream reset and prove the opaque L4 relay surfaces the fault as a connection abort rather
  # than a hang (GW passthrough resilience). Pinned image with a healthcheck; the admin API (8474)
  # is published to the host so the Failsafe-side IT creates the proxy and adds the reset_peer toxic
  # at test time — no static proxy config file is mounted. Added beside keycloak as a purely
  # additive service; the existing services are untouched.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    ports:
      - "8474:8474"  # Toxiproxy admin/control API, driven by PassthroughFaultIT from the host
    networks:
      - api-sheriff
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # TLS-enabled passthrough target backing the accept-time SNI split's opaque L4 relay. It serves
  # HTTPS on 8443 with its OWN self-signed certificate (CN=passthrough-backend), so TlsPassthroughIT
  # can assert the peer certificate identity it observes through the relay is the backend's — proof
  # the gateway relayed the encrypted stream opaquely and never terminated it. Reached by the gateway
  # on the internal network as passthrough-backend:8443 (direct path), or via toxiproxy for the
  # mid-stream fault test. No host port is published — it is reached only inside the compose network.
  # The cert is generated at container start (least infrastructure: no pre-provisioned key material),
  # mirroring the self-signed convention the certificates/ scripts use for the terminated listener.
  passthrough-backend:
    image: nginx:1.27-alpine
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        apk add --no-cache openssl >/dev/null 2>&1
        openssl req -x509 -newkey rsa:2048 -nodes -days 730 \
          -keyout /etc/nginx/passthrough-backend.key \
          -out /etc/nginx/passthrough-backend.crt \
          -subj "/CN=passthrough-backend/OU=Integration Testing/O=API-Sheriff/L=Berlin/ST=Berlin/C=DE" \
          -addext "subjectAltName=DNS:passthrough-backend,DNS:passthrough.test.example,IP:127.0.0.1"
        cat > /etc/nginx/conf.d/default.conf <<'NGINX'
        server {
          listen 8443 ssl;
          server_name passthrough-backend;
          ssl_certificate     /etc/nginx/passthrough-backend.crt;
          ssl_certificate_key /etc/nginx/passthrough-backend.key;
          location / {
            add_header Content-Type text/plain always;
            return 200 "passthrough-backend\n";
          }
        }
        NGINX
        exec nginx -g 'daemon off;'
    networks:
      - api-sheriff
    restart: unless-stopped
    healthcheck:
      # /dev/tcp readiness probe on the TLS port; nginx:alpine ships /bin/sh but the ssl handshake
      # is not exercised here — a TCP accept is sufficient to gate dependents on listener readiness.
      test: ["CMD-SHELL", "test -f /etc/nginx/passthrough-backend.crt && nginx -t"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  # Routable upstream backend for the proxy: /anything/* echoes the complete
  # received request as JSON, so integration tests can assert exactly what the
  # gateway forwarded. Reached by the gateway on the internal network as
  # http://go-httpbin:8080; port 18080 is published only for the host-side
  # readiness probe and local debugging.
  go-httpbin:
    image: ghcr.io/mccutchen/go-httpbin:2.23.1
    # go-httpbin caps request bodies at 1 MiB by default, well below the upload anchor's declared
    # 64 MiB max_body_bytes. Without this raise the upstream — not the gateway — would reject
    # LargeBodyIT's 11 MiB positive body, turning a test about the framework body-size floor into a
    # test about go-httpbin's own default. The value matches the upload anchor's cap exactly, so a
    # body the gateway forwards is a body this upstream accepts.
    command: ["-max-body-size", "67108864"]
    ports:
      - "18080:8080"
    networks:
      - api-sheriff
    restart: unless-stopped

  # Secondary static origin backing the source: upstream asset route (/assets/cdn).
  # nginx serves the mounted static content at http://asset-origin:80 on the internal
  # network; the gateway fetches confined assets from it over the fixed-topology,
  # SSRF-controlled egress and re-serves them under the response envelope. No host
  # port is published — it is reached only by the gateway on the compose network.
  asset-origin:
    image: nginx:1.27-alpine
    volumes:
      - ./src/main/docker/asset-origin:/usr/share/nginx/html:ro
    networks:
      - api-sheriff
    restart: unless-stopped

  # In-repo Quarkus gRPC echo upstream backing the gRPC integration-test matrix.
  # Exposes unary echo, server-streaming echo, and a deliberately-failing method
  # (non-OK grpc-status) so GrpcProxyIT can assert echo, streaming, and trailer/status
  # relay through the gateway. Reached by the gateway on the internal network as
  # grpc-echo:9000 (separate gRPC server); no host port is published. Built from the
  # integration-tests module via the grpc-echo Maven profile (repo-root build context).
  grpc-echo:
    build:
      context: ..
      dockerfile: integration-tests/src/main/docker/grpc-echo/Dockerfile
    networks:
      - api-sheriff
    restart: unless-stopped
    # /dev/tcp readiness probe on the gRPC port — the eclipse-temurin runtime image
    # ships bash, so no extra probe binary is required.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo -n > /dev/tcp/127.0.0.1/9000'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  api-sheriff:
    image: "api-sheriff:distroless"
    build:
      context: ../api-sheriff
      dockerfile: src/main/docker/Dockerfile.native
      # The harness build is the ONE image build in this project — the release lane runs this very
      # compose build and pushes exactly the digest it produced — so this is the single supply point
      # for the image's org.opencontainers.image.version label. The release lane exports
      # APP_VERSION=<released version> into the Maven step's environment; locally it stays `dev`.
      args:
        APP_VERSION: ${APP_VERSION:-dev}
      cache_from:
        - quay.io/quarkus/quarkus-distroless-image:2.0
        - quay.io/quarkus/ubi9-quarkus-micro-image:2.0

    # Point the JVM DEFAULT truststore at the mounted private-CA PKCS12. The confidential-client
    # OIDC engine (token-sheriff-client) performs its outbound OIDC discovery/token/refresh/logout
    # calls with ONLY the JVM default TrustManager (TrustManagerFactory.init((KeyStore) null)) — it
    # exposes no per-client TLS-trust seam (token-sheriff-client#597) — so the per-issuer tls_profile
    # that already validates JWKS does NOT cover these calls. Against the self-signed IT Keycloak the
    # login flows otherwise fail PKIX/500. The Dockerfile's ENTRYPOINT is exec-form with no CMD, so
    # this command list appends as runtime -D args on the native runner's command line; a
    # GraalVM/Mandrel native executable honors runtime -Djavax.net.ssl.trustStore* for the default
    # TrustManager (JAVA_TOOL_OPTIONS is NOT honored by a native runner — command-line -D is).
    command:
      - -Djavax.net.ssl.trustStore=/app/certificates/localhost-truststore.p12
      - -Djavax.net.ssl.trustStorePassword=localhost-trust
      - -Djavax.net.ssl.trustStoreType=PKCS12

    # Declares the scheme this instance's MANAGEMENT interface speaks. start-integration-container.sh
    # discovers every api-sheriff* service from the resolved Compose model and builds its readiness
    # probe URL from this label plus the host port published against container port 9000 — so the
    # readiness gate restates no service name and no port number, and adding, removing or renumbering
    # an instance here needs no script edit. The label is the single source of truth for the scheme:
    # the script must never infer it from the service name.
    labels:
      de.cuioss.sheriff.management-scheme: "https"

    ports:
      - "10443:8443"  # External test port for integration tests
      - "19000:9000"  # Management interface (health/metrics, HTTPS — single port, see below)

    environment:
      # Selects the "it" Quarkus profile. It switches NO shipped configuration on: application.properties
      # carries no %it entry at all any more, and the request-path issuer comes from the mounted
      # gateway.yaml token_validation block rather than from a profile branch. What the flag still does
      # is mark this container as an it-profile instance — the deployment-supplied entries below are
      # what actually configure it, and ItProfileConfigBindingWiringTest derives the set of instances
      # that must carry them from exactly this entry, which is why it stays in KEY=value form.
      - QUARKUS_PROFILE=it
      # Deployment-supplied trust material for the `benchmark-idp` TLS profile. gateway.yaml names
      # only the logical profile (jwks.tls_profile: benchmark-idp); this mounted file binds it to a
      # concrete store, so the shipped artifact carries no benchmark-idp key and no trust password in
      # any profile. Loaded from the already-mounted certificates/ volume — no new volume is added.
      # Every QUARKUS_PROFILE=it gateway instance sets this; the value is identical across all seven.
      - QUARKUS_CONFIG_LOCATIONS=/app/certificates/benchmark-idp-trust.properties
      # File logging to mounted target directory. The shipped artifact ships file logging OFF, so a
      # deployment that wants a log file switches it on here — the enable flag and the path are one
      # decision and travel together. Every QUARKUS_PROFILE=it gateway instance sets both.
      - QUARKUS_LOG_FILE_ENABLE=true
      - LOG_FILE_PATH=/logs/quarkus.log
      # Accept-time SNI passthrough split: gateway.yaml declares tls.passthrough_sni, so the Vert.x
      # SNI front listener owns the public TLS port (sheriff.tls.public-port=8443) and the terminated
      # Quarkus HTTPS listener must move to the internal loopback port to avoid a bind conflict. This
      # override moves it to sheriff.tls.internal-https-port (8444); the front L4-relays a matched
      # passthrough SNI to the resolved backend and hands every other connection to localhost:8444.
      - QUARKUS_HTTP_SSL_PORT=8444
      # Raise the framework body-size floor ABOVE the upload anchor's declared 64 MiB
      # max_body_bytes for this instance only. application.properties ships the floor at exactly
      # 64M, where the Quarkus root handler's Content-Length pre-check answers an oversize request
      # with a bare 413 (Connection: close, empty body) before the gateway pipeline runs — so the
      # RFC 9457 problem+json envelope would never be rendered for the largest-capped route. Lifting
      # the floor to 128M puts LargeBodyIT's 68 MiB negative-case body under the framework limit and
      # over the gateway's own cap, which is what makes the gateway (not the framework) the rejecting
      # component. BodyLimitActivationWiringTest asserts this override stays strictly above that body
      # size; dropping or lowering it silently turns LargeBodyIT into a test of the framework.
      - QUARKUS_HTTP_LIMITS_MAX_BODY_SIZE=128M
      # Certificate paths (runtime override)
      - QUARKUS_HTTP_SSL_CERTIFICATE_FILES=/app/certificates/localhost.crt
      - QUARKUS_HTTP_SSL_CERTIFICATE_KEY_FILES=/app/certificates/localhost.key
      # Management-interface certificate, symmetric with the main-listener pair above and reusing
      # the already-mounted ./src/main/docker/certificates volume (no new key material, no new
      # mount). Quarkus' management interface has exactly ONE port — it declares no ssl-port and no
      # insecure-requests — so supplying these two keys converts port 9000 itself to HTTPS. Every
      # consumer of 9000 (host readiness probes, Prometheus, the k6 health benchmarks) must speak
      # TLS with -k / insecure_skip_verify, because the certificate is the self-signed localhost
      # bundle. Six of the seven gateway instances carry this pair; api-sheriff-plain-mgmt is the one
      # deliberate exception, documented at its own service definition.
      - QUARKUS_MANAGEMENT_SSL_CERTIFICATE_FILES=/app/certificates/localhost.crt
      - QUARKUS_MANAGEMENT_SSL_CERTIFICATE_KEY_FILES=/app/certificates/localhost.key
      - QUARKUS_TLS_DEFAULT_TRUST__STORE_P12_PATH=/app/certificates/localhost-truststore.p12
      - QUARKUS_TLS_DEFAULT_TRUST__STORE_P12_PASSWORD=localhost-trust
      # File-based configuration mounted at /app/sheriff-config: the proxy edge
      # sources its routes and upstreams from the assembled RouteTable, and the
      # UPSTREAM topology alias resolves to the go-httpbin echo backend.
      - SHERIFF_CONFIG_DIR=/app/sheriff-config
      # Container-side value the bare ${OIDC_CLIENT_SECRET} reference in
      # gateway.yaml (oidc.client_secret) resolves to via EnvSecretResolver.
      - OIDC_CLIENT_SECRET=integration-secret

    # Map form so grpc-echo can gate on service_healthy — the gateway must not start
    # until the gRPC echo upstream is accepting connections, otherwise the first
    # streaming IT can race the upstream's boot. The other upstreams retain the prior
    # service_started semantics.
    depends_on:
      keycloak:
        condition: service_started
      go-httpbin:
        condition: service_started
      asset-origin:
        condition: service_started
      grpc-echo:
        condition: service_healthy

    volumes:
      # Read-only certificate mount (production pattern)
      - ./src/main/docker/certificates:/app/certificates:ro
      # Read-only file-based gateway configuration mount (production pattern)
      - ./src/main/docker/sheriff-config:/app/sheriff-config:ro
      # Read-only static-asset directory backing the source: directory asset route
      # (/assets/static and /secure-assets). Mounted at /app/assets, matching the
      # `directory:` root in the asset endpoint config. A read-only mount into the
      # read_only container is fine — bind mounts are independent of the root fs.
      - ./src/main/docker/assets:/app/assets:ro
      # Read-only mount of the demo SPA, authored by the sibling demo-client module
      # (demo-client/src/main/resources/spa, plan-11 deliverable 4). Backs the
      # /assets/demo directory asset route declared in endpoints/assets.yaml. The SPA has
      # no build step, so the authored files ARE the served files — no dist/ and no build
      # ordering. A relative path crossing to a sibling module follows the precedent the
      # grpc-echo service already sets in this file (context: ..).
      - ../demo-client/src/main/resources/spa:/app/demo:ro
      # Mount the dedicated log subdirectory (defaults to ./target/quarkus-logs).
      # The start-integration-container.sh script exports LOG_TARGET_DIR to this subdir
      # and world-writes only it (least privilege); this fallback keeps a standalone
      # compose run mounting the same subdir rather than the whole target tree.
      - ${LOG_TARGET_DIR:-./target/quarkus-logs}:/logs:rw

    # OWASP Security hardening (production-grade)
    security_opt:
      - no-new-privileges:true

    # Drop all capabilities (principle of least privilege)
    cap_drop:
      - ALL

    # Read-only filesystem with tmpfs for temporary files (production setting)
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=100m

    # Resource limitations (DoS protection - production values)
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '4.0'
        reservations:
          memory: 256M
          cpus: '1.0'

    # Health check: no in-container healthcheck (the distroless image ships neither a shell nor
    # curl). Readiness is gated host-side by start-integration-container.sh probing the published
    # management port 19000 over HTTPS with -k.

    # Network isolation (production pattern). The alias is what lets a passthrough client reach
    # this gateway under a tls.passthrough_sni name: the benchmark's ClientHello carries
    # passthrough.test.example, so that name must resolve to THIS container for the accept-time
    # SNI front listener to see a match and L4-relay to PASSTHROUGH_BACKEND. Map form is required
    # here — the short-form list carries no aliases. The backend certificate already covers the
    # name (SAN DNS:passthrough.test.example on the passthrough-backend service).
    networks:
      api-sheriff:
        aliases:
          - passthrough.test.example

    # Production restart policy
    restart: unless-stopped

  # Dedicated mTLS-terminated gateway instance backing MtlsHandshakeIT (GW-06 / D2). mTLS is a
  # property of the single terminated Quarkus HTTPS listener, so it cannot coexist on the primary
  # instance (10443) whose terminated path serves the rest of the suite without a client cert. This
  # instance reuses the SAME native image, overlays an mTLS-enabled gateway.yaml (require-and-verify
  # against mtls-client-ca.crt, no passthrough → Quarkus terminates directly on the public port),
  # and is published on 10444. TLS is pinned to 1.2 here so the JDK black-box client observes the
  # client-auth rejection synchronously at startHandshake() — under TLS 1.3 JSSE surfaces a
  # client-auth failure only on the first read, which MtlsHandshakeIT's read-less handshake would
  # miss; the mutual-auth security check itself is identical on 1.2 and 1.3.
  api-sheriff-mtls:
    image: "api-sheriff:distroless"
    # Same JVM-default-truststore trust as the primary instance: this service overlays the same oidc
    # block (lockstep gateway.yaml) so its confidential-client engine needs the private-CA trust for
    # any OIDC discovery/token call — harmless if the mTLS suite never exercises a login. See the
    # primary api-sheriff service's command comment for the mechanism (token-sheriff-client#597).
    command:
      - -Djavax.net.ssl.trustStore=/app/certificates/localhost-truststore.p12
      - -Djavax.net.ssl.trustStorePassword=localhost-trust
      - -Djavax.net.ssl.trustStoreType=PKCS12
    # Management-interface scheme for host-side readiness discovery (see the api-sheriff service).
    labels:
      de.cuioss.sheriff.management-scheme: "https"

    ports:
      - "10444:8443"  # External test port for MtlsHandshakeIT (test.mtls.port)
      - "19001:9000"  # Management interface (health/metrics, HTTPS — single port, see below)
    environment:
      - QUARKUS_PROFILE=it
      # Deployment-supplied benchmark-idp trust bucket, in lockstep with the primary api-sheriff
      # service — see that service's comment for the mechanism.
      - QUARKUS_CONFIG_LOCATIONS=/app/certificates/benchmark-idp-trust.properties
      - QUARKUS_LOG_FILE_ENABLE=true
      - LOG_FILE_PATH=/logs/quarkus-mtls.log
      # Terminate directly on the public port (no passthrough front on this instance).
      - QUARKUS_HTTP_SSL_CERTIFICATE_FILES=/app/certificates/localhost.crt
      - QUARKUS_HTTP_SSL_CERTIFICATE_KEY_FILES=/app/certificates/localhost.key
      # Management-interface certificate, kept in lockstep with the primary api-sheriff service —
      # see that service's comment for the single-port mechanism. Without it this instance's
      # management port 19001 stays plain HTTP while the primary's is HTTPS, and the host-side
      # readiness wait in start-integration-container.sh (https + -k for 19000-19004 and 19006) would hang.
      # api-sheriff-plain-mgmt on 19005 is the one deliberate exception to that lockstep and is
      # gated by its own http:// block.
      - QUARKUS_MANAGEMENT_SSL_CERTIFICATE_FILES=/app/certificates/localhost.crt
      - QUARKUS_MANAGEMENT_SSL_CERTIFICATE_KEY_FILES=/app/certificates/localhost.key
      - QUARKUS_TLS_DEFAULT_TRUST__STORE_P12_PATH=/app/certificates/localhost-truststore.p12
      - QUARKUS_TLS_DEFAULT_TRUST__STORE_P12_PASSWORD=localhost-trust
      # Pin the terminated HTTPS listener to TLS 1.2 so the require-client-cert rejection is
      # observable synchronously at startHandshake() (see the service comment). The controlling key
      # is quarkus.http.ssl.protocols (the HTTPS listener's protocol list); quarkus.tls.protocols is
      # not the listener's control and would leave TLS 1.3 offered.
      - QUARKUS_HTTP_SSL_PROTOCOLS=TLSv1.2
      - SHERIFF_CONFIG_DIR=/app/sheriff-config
      # Container-side value the bare ${OIDC_CLIENT_SECRET} reference in the overlaid
      # mtls gateway.yaml (oidc.client_secret) resolves to via EnvSecretResolver — kept
      # in lockstep with the primary api-sheriff service, whose gateway.yaml has the same
      # oidc block through the shared bff-session endpoint.
      - OIDC_CLIENT_SECRET=integration-secret
    depends_on:
      keycloak:
        condition: service_started
      go-httpbin:
        condition: service_started
      asset-origin:
        condition: service_started
      grpc-echo:
        condition: service_healthy
    volumes:
      - ./src/main/docker/certificates:/app/certificates:ro
      # Shared config dir, then overlay ONLY gateway.yaml with the mTLS-enabled variant.
      - ./src/main/docker/sheriff-config:/app/sheriff-config:ro
      - ./src/main/docker/sheriff-config-mtls/gateway.yaml:/app/sheriff-config/gateway.yaml:ro
      - ./src/main/docker/assets:/app/assets:ro
      - ${LOG_TARGET_DIR:-./target/quarkus-logs}:/logs:rw
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=100m
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '4.0'
        reservations:
          memory: 256M
          cpus: '1.0'
    # No in-container healthcheck: the distroless image ships neither a shell nor curl. Readiness is
    # gated host-side by start-integration-container.sh probing the published management port 19001,
    # exactly as the primary instance is gated on 19000.
    networks:
      - api-sheriff
    restart: unless-stopped

  # --- Variant 3: the dedicated cookie-mode (stateless sealed-cookie session) gateway instance -----
  # The session mode is a property of the whole gateway, so it cannot coexist on the primary instance
  # (10443) whose server-mode binding serves the landed Bff*IT suite. This instance reuses the SAME
  # native image, overlays a cookie-mode gateway.yaml (session.mode: cookie, no store, no passthrough
  # → Quarkus terminates directly on the public port), and is published on 10445.
  #
  # SESSION_ENCRYPTION_KEY supplies the AES-256 sealing key the overlaid gateway.yaml references as a
  # bare ${SESSION_ENCRYPTION_KEY}. Passing the key explicitly — rather than letting the gateway
  # generate one per boot — is what makes the sealed cookie portable across instances that share
  # nothing but this value, which is the property BffCookieStatelessnessIT proves.
  api-sheriff-cookie:
    image: "api-sheriff:distroless"
    # Same JVM-default-truststore trust as the primary instance: this service overlays the same oidc
    # block (lockstep gateway.yaml) so its confidential-client engine needs the private-CA trust for
    # the OIDC discovery/token calls the cookie login flow makes. See the primary api-sheriff
    # service's command comment for the mechanism (token-sheriff-client#597).
    command:
      - -Djavax.net.ssl.trustStore=/app/certificates/localhost-truststore.p12
      - -Djavax.net.ssl.trustStorePassword=localhost-trust
      - -Djavax.net.ssl.trustStoreType=PKCS12
    # Management-interface scheme for host-side readiness discovery (see the api-sheriff service).
    labels:
      de.cuioss.sheriff.management-scheme: "https"

    ports:
      - "10445:8443"  # External test port for the Bff*Cookie*IT suite (test.cookie.port)
      - "19002:9000"  # Management interface (health/metrics, HTTPS — single port, see below)
    environment:
      - QUARKUS_PROFILE=it
      # Deployment-supplied benchmark-idp trust bucket, in lockstep with the primary api-sheriff
      # service — see that service's comment for the mechanism.
      - QUARKUS_CONFIG_LOCATIONS=/app/certificates/benchmark-idp-trust.properties
      - QUARKUS_LOG_FILE_ENABLE=true
      - LOG_FILE_PATH=/logs/quarkus-cookie.log
      # Terminate directly on the public port (no passthrough front on this instance).
      - QUARKUS_HTTP_SSL_CERTIFICATE_FILES=/app/certificates/localhost.crt
      - QUARKUS_HTTP_SSL_CERTIFICATE_KEY_FILES=/app/certificates/localhost.key
      # Management-interface certificate, kept in lockstep with the primary api-sheriff service —
      # see that service's comment for the single-port mechanism. Without it this instance's
      # management port 19002 stays plain HTTP while the primary's is HTTPS, and the host-side
      # readiness wait in start-integration-container.sh (https + -k for 19000-19004 and 19006) would hang.
      # api-sheriff-plain-mgmt on 19005 is the one deliberate exception to that lockstep.
      - QUARKUS_MANAGEMENT_SSL_CERTIFICATE_FILES=/app/certificates/localhost.crt
      - QUARKUS_MANAGEMENT_SSL_CERTIFICATE_KEY_FILES=/app/certificates/localhost.key
      - QUARKUS_TLS_DEFAULT_TRUST__STORE_P12_PATH=/app/certificates/localhost-truststore.p12
      - QUARKUS_TLS_DEFAULT_TRUST__STORE_P12_PASSWORD=localhost-trust
      - SHERIFF_CONFIG_DIR=/app/sheriff-config
