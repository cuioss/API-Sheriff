      # as ${SESSION_ENCRYPTION_KEY}. A fixed test value: it seals only throwaway integration-realm
      # sessions and is never a production key.
      - SESSION_ENCRYPTION_KEY=YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY=
    depends_on:
