      # plan-11 deliverable 4). Both demo gateways serve the identical bundle, so the
      # Playwright suite runs the SAME specs against both session modes — the only
      # per-project difference is the base URL.
      - ../demo-client/src/main/resources/spa:/app/demo:ro
      - ${LOG_TARGET_DIR:-./target/quarkus-logs}:/logs:rw
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
