    restart: unless-stopped

  # The deliberate plain-HTTP-management exception (ADR-0025).
  #
  # Every other gateway instance serves its management port over HTTPS, and that lockstep is what the
  # host-side readiness loop relies on. This one instance proves the supported downgrade path, and it
  # is the ONLY instance allowed to break the lockstep — hence its own readiness gate, its own port,
  # and this comment.
  #
  # The downgrade is Quarkus-native, not bespoke: QUARKUS_MANAGEMENT_TLS_CONFIGURATION_NAME selects
  # the `plain-management` TLS bucket that application.properties declares with NO key material. The
  # named lookup resolves, the key material is null-guarded, and the recorder swaps in the plain
  # options because getKeyCertOptions() is null. Because it is runtime configuration, the SAME native
  # image every other instance runs is reused unchanged — no rebuild, no variant image, and no config
  # overlay: this service mounts the shared sheriff-config directory exactly as shipped.
  #
  # QUARKUS_MANAGEMENT_ENABLED=false would NOT be an equivalent shortcut: it is fixed at build time
  # (baked into the native image, so it could not be set here at all) and it moves health and metrics
  # onto the MAIN TLS-terminated router, producing an HTTPS probe endpoint rather than a plain one.
  api-sheriff-plain-mgmt:
    image: "api-sheriff:distroless"
    # Same JVM-default-truststore trust as every other instance — see the primary api-sheriff
    # service's command comment for the mechanism (token-sheriff-client#597).
    command:
      - -Djavax.net.ssl.trustStore=/app/certificates/localhost-truststore.p12
      - -Djavax.net.ssl.trustStorePassword=localhost-trust
      - -Djavax.net.ssl.trustStoreType=PKCS12
    # This instance's whole purpose is that its management interface is PLAIN HTTP: it selects the
    # key-less `plain-management` TLS bucket via QUARKUS_MANAGEMENT_TLS_CONFIGURATION_NAME. The label
    # is what lets the host-side readiness probe use http:// here and https:// everywhere else from
    # ONE loop — the scheme difference is data, not a special case in the script. The probe must never
    # need -k against this port: if it ever does, the plain-management opt-out has silently stopped
    # working and THAT is the bug, not the probe.
    labels:
      de.cuioss.sheriff.management-scheme: "http"

    ports:
      - "10448:8443"  # External test port for the plain-management opt-out (test.plain.mgmt.port)
      - "19005:9000"  # Management interface — PLAIN HTTP on this instance only, deliberately
    environment:
      - QUARKUS_PROFILE=it
      # Deployment-supplied benchmark-idp trust bucket, in lockstep with the primary api-sheriff
      # service — see that service's comment for the mechanism.
      - QUARKUS_CONFIG_LOCATIONS=/app/certificates/benchmark-idp-trust.properties
      # ManagementPlainHttpOptOutIT reads this container's log FILE for the ApiSheriff-115 downgrade
      # warning, so the enable flag is load-bearing here, not decorative.
      - QUARKUS_LOG_FILE_ENABLE=true
      - LOG_FILE_PATH=/logs/quarkus-plain-mgmt.log
      - QUARKUS_HTTP_SSL_CERTIFICATE_FILES=/app/certificates/localhost.crt
      - QUARKUS_HTTP_SSL_CERTIFICATE_KEY_FILES=/app/certificates/localhost.key
      # This instance mounts the SHARED sheriff-config, whose gateway.yaml declares a non-empty
      # passthrough_sni — so the SNI front listener claims the public port 8443 exactly as on the
      # primary api-sheriff service, and the terminated HTTPS listener MUST be moved to the internal
      # port or the two collide and boot fails with "Port 8443 seems to be in use by another
      # process". The five other gateway instances escape this only because each overlays
      # gateway.yaml with a variant declaring no passthrough_sni; this one deliberately does not
      # overlay, so that the management opt-out is the single variable under test. Keep in lockstep
      # with the primary service's identical setting — the invariant is documented at the
      # passthrough_sni block in sheriff-config/gateway.yaml.
      - QUARKUS_HTTP_SSL_PORT=8444
      # THE OPT-OUT. Selecting the key-less `plain-management` bucket takes the management interface
      # to plain HTTP; boot still succeeds and emits WARN ApiSheriff-115 naming the port.
      - QUARKUS_MANAGEMENT_TLS_CONFIGURATION_NAME=plain-management
      # The QUARKUS_MANAGEMENT_SSL_CERTIFICATE_FILES / _KEY_FILES pair every other instance sets is
      # deliberately ABSENT here. Its absence is not what produces the downgrade — the selected
      # key-less bucket is — but leaving it set would only be misleading noise.
      - QUARKUS_TLS_DEFAULT_TRUST__STORE_P12_PATH=/app/certificates/localhost-truststore.p12
      - QUARKUS_TLS_DEFAULT_TRUST__STORE_P12_PASSWORD=localhost-trust
      - SHERIFF_CONFIG_DIR=/app/sheriff-config
      # Container-side value the bare ${OIDC_CLIENT_SECRET} reference in the shared gateway.yaml
      # (oidc.client_secret) resolves to via EnvSecretResolver.
      - OIDC_CLIENT_SECRET=integration-secret
    depends_on:
      keycloak:
        condition: service_started
      go-httpbin:
        condition: service_started
      asset-origin:
        condition: service_started
      grpc-echo:
        condition: service_healthy
    volumes:
      - ./src/main/docker/certificates:/app/certificates:ro
      # Shared config dir, unmodified: the opt-out is an environment variable, so this instance needs
      # no gateway.yaml overlay at all.
      - ./src/main/docker/sheriff-config:/app/sheriff-config:ro
      - ./src/main/docker/assets:/app/assets:ro
      - ${LOG_TARGET_DIR:-./target/quarkus-logs}:/logs:rw
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=100m
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '4.0'
        reservations:
          memory: 256M
          cpus: '1.0'
    # No in-container healthcheck: the distroless image ships neither a shell nor curl. Readiness is
    # gated host-side by start-integration-container.sh, in the same Compose-derived loop as every
    # other api-sheriff* instance — the http:// probe comes from this service's management-scheme
    # label above, not from a branch on its name.
    networks:
      - api-sheriff
    restart: unless-stopped

  # --- The genuinely empty-passthrough_sni instance backing the benchmark's empty-mode arm --------
  # `passthrough_sni` is a property of the whole gateway process: declaring it non-empty is what
  # STARTS the accept-time Vert.x SNI front listener on the public TLS port, and the primary instance
  # declares two entries for its whole lifetime. So the `passthroughRelayEmpty` benchmark arm — whose
  # entire claim is that it measures D1's zero-overhead default, where that front listener is NEVER
  # created — could not be run against the primary instance without measuring the exact opposite of
  # what it names. Before this instance existed it was pointed at the primary anyway, so both arms of
  # the no-regression gate issued the identical request to the identical listener stack on ONE
  # gateway: the gate was comparing a configuration against itself and could neither pass nor fail
  # for the reason it existed.
  #
  # This instance reuses the SAME native image and overlays a gateway.yaml that is byte-identical to
  # the shared one except for the removed `tls.passthrough_sni` block; published on 10449. It is
  # separate rather than a mode of the primary because the two configurations must run CONCURRENTLY
  # for the benchmark lane to measure both arms in one run.
  #
  # It sets NO QUARKUS_HTTP_SSL_PORT, and that absence is load-bearing rather than an omission: with
  # no passthrough_sni there is no front listener to claim 8443, so the terminated Quarkus HTTPS
  # listener keeps the public port directly. Setting the loopback relocation here would move the
  # terminated listener off 8443 with nothing left listening on it.
  api-sheriff-passthrough-empty:
    image: "api-sheriff:distroless"
    # Same JVM-default-truststore trust as every other instance — see the primary api-sheriff
    # service's command comment for the mechanism (token-sheriff-client#597).
    command:
      - -Djavax.net.ssl.trustStore=/app/certificates/localhost-truststore.p12
      - -Djavax.net.ssl.trustStorePassword=localhost-trust
      - -Djavax.net.ssl.trustStoreType=PKCS12
    # Management-interface scheme for host-side readiness discovery (see the api-sheriff service).
    labels:
      de.cuioss.sheriff.management-scheme: "https"

    ports:
      - "10449:8443"  # External test port for the empty-passthrough_sni benchmark arm
      - "19006:9000"  # Management interface (health/metrics, HTTPS — single port, see below)
    environment:
      - QUARKUS_PROFILE=it
      # Deployment-supplied benchmark-idp trust bucket, in lockstep with the primary api-sheriff
      # service — see that service's comment for the mechanism.
      - QUARKUS_CONFIG_LOCATIONS=/app/certificates/benchmark-idp-trust.properties
      - QUARKUS_LOG_FILE_ENABLE=true
      - LOG_FILE_PATH=/logs/quarkus-passthrough-empty.log
      # NO QUARKUS_HTTP_SSL_PORT here — see the service comment. The overlaid gateway.yaml declares no
      # passthrough_sni, so no front listener is created and the terminated listener owns 8443.
      - QUARKUS_HTTP_SSL_CERTIFICATE_FILES=/app/certificates/localhost.crt
      - QUARKUS_HTTP_SSL_CERTIFICATE_KEY_FILES=/app/certificates/localhost.key
      # Management-interface certificate, kept in lockstep with every other instance — see the
      # primary api-sheriff service's comment for the single-port mechanism. Without it this
      # instance's management port 19006 stays plain HTTP while the others are HTTPS, and the
      # host-side readiness wait in start-integration-container.sh (https + -k for 19000-19004 and
      # 19006) would hang. api-sheriff-plain-mgmt on 19005 is the one deliberate exception.
      - QUARKUS_MANAGEMENT_SSL_CERTIFICATE_FILES=/app/certificates/localhost.crt
      - QUARKUS_MANAGEMENT_SSL_CERTIFICATE_KEY_FILES=/app/certificates/localhost.key
      - QUARKUS_TLS_DEFAULT_TRUST__STORE_P12_PATH=/app/certificates/localhost-truststore.p12
      - QUARKUS_TLS_DEFAULT_TRUST__STORE_P12_PASSWORD=localhost-trust
      - SHERIFF_CONFIG_DIR=/app/sheriff-config
      # Container-side value the bare ${OIDC_CLIENT_SECRET} reference in the overlaid gateway.yaml
      # (oidc.client_secret) resolves to via EnvSecretResolver — kept in lockstep with the primary
      # api-sheriff service, whose gateway.yaml carries the same oidc block.
      - OIDC_CLIENT_SECRET=integration-secret
    depends_on:
      keycloak:
        condition: service_started
      go-httpbin:
        condition: service_started
      asset-origin:
        condition: service_started
      grpc-echo:
        condition: service_healthy
    volumes:
      - ./src/main/docker/certificates:/app/certificates:ro
      # Shared config dir, then overlay ONLY gateway.yaml with the no-passthrough_sni variant.
      - ./src/main/docker/sheriff-config:/app/sheriff-config:ro
      - ./src/main/docker/sheriff-config-passthrough-empty/gateway.yaml:/app/sheriff-config/gateway.yaml:ro
      - ./src/main/docker/assets:/app/assets:ro
      - ${LOG_TARGET_DIR:-./target/quarkus-logs}:/logs:rw
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=100m
    # Identical to the primary instance's budget, per ADR-0012: the empty-mode arm is compared
    # against the primary's proxiedStatic baseline, so a different CPU or memory limit here would
    # make the comparison measure the budget difference rather than the passthrough configuration.
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '4.0'
        reservations:
          memory: 256M
          cpus: '1.0'
    # No in-container healthcheck: the distroless image ships neither a shell nor curl. Readiness is
    # gated host-side by start-integration-container.sh probing the published management port 19006.
    networks:
      - api-sheriff
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.6.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=1h'
      # --web.enable-lifecycle is deliberately NOT set. It exposes unauthenticated POST /-/reload and
      # POST /-/quit on port 9090, which the block above publishes to the host — a remote-shutdown
      # control on a service that needs none. Nothing in this repository calls either endpoint.
      # The :ro flag stops the CONTAINER from writing the scrape config; it does not stop a host user
      # editing ./prometheus.yml while the stack runs, so a host-side edit is a real possibility —
      # it simply requires a restart to take effect. Do not add lifecycle back to "make reloading
      # easier": bring the service down and up, which is what an ephemeral test stack does anyway.
    networks:
      - api-sheriff

  k6:
    build:
      context: ..
      dockerfile: benchmarks/Dockerfile.k6
    networks:
      - api-sheriff
    profiles:
      - benchmark
    restart: "no"
    # k6's handleSummary() writes one summary document per run into /results, which the
    # K6ResultPostProcessor reads back from the host. K6_OUTPUT_DIR is set by the Maven
    # benchmark executions; the default keeps a bare `docker compose run k6` working.
    volumes:
      - ${K6_OUTPUT_DIR:-../benchmarks/target/benchmark-results/k6}:/results
    # The stock grafana/k6 image runs as an unprivileged uid that does not exist on the host,
    # so it cannot write into the host-owned bind mount above. This is an ephemeral load
    # generator on a local benchmark network with no published ports; running it as the host
    # user is not an option because the uid is not known to compose, so it runs as root and
    # the result files stay removable by `mvn clean` (the parent directory is host-owned).
    user: "0:0"
    # Value-less entries pass the host variable through only when it is set, so an unset
    # variable stays unset in the container rather than becoming an empty string. PASSTHROUGH_SNI
    # selects the passthrough_relay.js mode (mapped | empty) and is set per benchmark execution in
    # benchmarks/pom.xml; without it here the selector never reaches k6 and both executions would
    # run the same mode.
    environment:
      - BENCHMARK_VUS
      - BENCHMARK_DURATION
      - BENCHMARK_MAX_ERROR_RATE
      - GATEWAY_TARGET
      - PASSTHROUGH_SNI

networks:
  api-sheriff:
    driver: bridge
