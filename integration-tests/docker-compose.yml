      - ./src/main/docker/sheriff-config-cookie/gateway.yaml:/app/sheriff-config/gateway.yaml:ro
      - ./src/main/docker/assets:/app/assets:ro
      # The demo SPA, same read-only mount as the primary instance (demo-client module,
      # plan-11 deliverable 4). Both demo gateways serve the identical bundle, so the
      # Playwright suite runs the SAME specs against both session modes — the only
      # per-project difference is the base URL.
      - ../demo-client/src/main/resources/spa:/app/demo:ro
      - ${LOG_TARGET_DIR:-./target/quarkus-logs}:/logs:rw
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=100m
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '4.0'
        reservations:
          memory: 256M
          cpus: '1.0'
    # Health check: inherited from the image, exactly as the primary and mTLS instances — the exec-form
    # probe baked into Dockerfile.native. No healthcheck: key here; the image carries exactly one
    # executable, so only the exec form is available and only the image can carry it.
    networks:
